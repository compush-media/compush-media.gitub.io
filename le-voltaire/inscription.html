<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Activer -10% — Fidelavis</title>

  <!-- ✅ Core commun -->
  <script src="../assets/core.js"></script>

  <!-- ✅ trackEventFidelavis fourni par core.js (chargé avant ce script) — pas de redéfinition locale -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --gold:#B8924F;
      --line:rgba(0,0,0,.08);
      --shadow:0 16px 34px rgba(0,0,0,.10);
      --radius:18px;
      --bg1:#f7f0e8;
      --bg2:#f4eadf;
      --ok:#1f8a4c;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);
      color:#1d1d1d;
      padding:10px 12px calc(70px + env(safe-area-inset-bottom));
      text-align:center;
    }
    .wrap{max-width:460px;margin:0 auto;}

    .badge{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 12px;border-radius:999px;
      background:#fff;border:1px solid var(--line);
      font-weight:900;font-size:12px;
      margin:0 0 6px;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
    h1{
      margin:0 0 6px;
      font-size:22px;
      line-height:1.10;
      font-weight:950;
      letter-spacing:-0.35px;
    }
    .micro{
      margin:0 0 10px;
      font-size:13px;
      font-weight:900;
      color:#2b2b2b;
      opacity:.88;
    }

    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:10px;
      text-align:left;
    }
    iframe{
      width:100%;
      border:0;
      border-radius:14px;
      background:#fff;
      display:block;
      height:560px;
    }

    .sticky{
      position:fixed;
      left:0; right:0; bottom:0;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:linear-gradient(180deg, rgba(247,240,232,0) 0%, rgba(247,240,232,.92) 30%, rgba(247,240,232,.98) 100%);
      backdrop-filter: blur(10px);
      z-index:999;
    }
    .stickyInner{
      max-width:460px;
      margin:0 auto;
      display:flex;
      gap:10px;
      justify-content:center;
      align-items:center;
    }
    .btnLink{
      flex:1 1 0;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      font-weight:950;font-size:13px;
      color:#2b2b2b;
      text-decoration:none;
      box-shadow:0 10px 22px rgba(0,0,0,.06);
    }
  </style>

  <!-- ✅ Détection retour GHL après soumission -->
  <script>
  (function(){
    const params = new URLSearchParams(location.search);
    if (params.get("submitted") !== "1") return;

    const RESTO = window.Fidelavis?.rememberLastResto?.() || window.Fidelavis?.getRestoSlug?.() || "resto1";
    const now = Date.now();

    try{
      localStorage.setItem("is_registered", "1");
      localStorage.setItem("fv_onboarding_done", "1");
      localStorage.setItem(`fv_registered_${RESTO}`, "1");
      localStorage.setItem(`fv_registered_at_${RESTO}`, String(now));
    }catch(e){}

    // ✅ Cookie de persistance pour PWA standalone iOS (localStorage isolé de Safari)
    window.Fidelavis?.setAuthCookie?.();

    const dedupKey = `signup_${RESTO}`;
    const last = Number(localStorage.getItem(dedupKey) || "0");

    if (!last || (now - last) > 86400000) {
      try { localStorage.setItem(dedupKey, String(now)); } catch(e){}

      try {
        window.Fidelavis?.track?.("signup", {
          src: "ghl_redirect_inscription",
          page: "inscription",
          resto: RESTO
        });
      } catch(e){}

      try {
        window.trackEventFidelavis?.("form_submit", RESTO, {
          src: "ghl_redirect_inscription",
          demo: location.pathname.includes("/demo/") ? "1" : "0"
        });
      } catch(e){}
    }

    params.delete("submitted");
    const clean = location.pathname + (params.toString() ? "?" + params.toString() : "");
    try { history.replaceState({}, document.title, clean); } catch(e){}

    setTimeout(() => window.location.replace("redit.html"), 220);
  })();
  </script>
</head>

<body>
  <div class="wrap">
    <div class="badge"><span class="dot"></span>Dernière étape</div>
    <h1>🎁 Où devons-nous envoyer votre -10% ?</h1>
    <p class="micro">⚡ 10 secondes • 🎁 Gratuit • 🔒 Anti-spam</p>

    <div class="card" id="card">
      <iframe
        id="ghlFrame"
        src="https://api.leadconnectorhq.com/widget/form/MAbxQNqssstYs2a4VbuI"
        title="Formulaire d'inscription"></iframe>
    </div>
  </div>

  <div class="sticky">
    <div class="stickyInner">
      <a class="btnLink" id="ppBtn" href="/privacy.html">🔐 Confidentialité</a>
      <a class="btnLink" id="cguBtn" href="/cgu.html">📄 CGU</a>
    </div>
  </div>

  <script>
  (function(){
    const RESTO = window.Fidelavis?.rememberLastResto?.() || window.Fidelavis?.getRestoSlug?.() || "resto1";

    try {
      if (!sessionStorage.getItem("fv_session_id")) {
        sessionStorage.setItem("fv_session_id", "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2,8));
      }
    } catch(e){}

    try {
      if (!localStorage.getItem("device_id")) {
        localStorage.setItem("device_id", "dev_" + Math.random().toString(36).slice(2,10));
      }
    } catch(e){}

    try{
      const key = `scan_to_signup_${RESTO}_${new Date().toISOString().slice(0,10)}`;
      if (!sessionStorage.getItem(key)) {
        sessionStorage.setItem(key, "1");
        // ✅ Un seul appel — core.js gère un iframe unique par envoi
        window.Fidelavis?.track?.("scan_to_signup", {
          src: "inscription",
          page: "inscription",
          resto: RESTO
        });
      }
    }catch(e){}

    const from = encodeURIComponent(location.pathname);
    document.getElementById("ppBtn").href  = "/privacy.html?from=" + from;
    document.getElementById("cguBtn").href = "/cgu.html?from=" + from;

    // ─── Détection soumission GHL via postMessage ────────────
    // GHL redirige l'iframe → le parent ne voit jamais ?submitted=1
    // Ce listener capte l'événement submit directement depuis l'iframe.
    let _ghlTracked = false;
    window.addEventListener("message", function(ev) {
      if (_ghlTracked) return;
      var d = ev.data;
      if (!d) return;
      if (typeof d === "string") {
        try { d = JSON.parse(d); } catch(_) { return; }
      }
      if (typeof d !== "object") return;
      var evType = (d.event || d.type || "").toLowerCase();
      var isSubmit = evType.includes("submit") || evType.includes("submitted") || !!d.submitted;
      if (!isSubmit) return;

      _ghlTracked = true;

      const now2 = Date.now();
      try {
        localStorage.setItem("is_registered", "1");
        localStorage.setItem("fv_onboarding_done", "1");
        localStorage.setItem("fv_registered_" + RESTO, "1");
        localStorage.setItem("fv_registered_at_" + RESTO, String(now2));
      } catch(_) {}

      // Cookie de persistance pour PWA iOS standalone (localStorage isolé)
      window.Fidelavis?.setAuthCookie?.();

      const dedupKey2 = "signup_pm_" + RESTO;
      const last2 = Number(localStorage.getItem(dedupKey2) || "0");
      if (!last2 || (now2 - last2) > 86400000) {
        try { localStorage.setItem(dedupKey2, String(now2)); } catch(_) {}
        try {
          window.Fidelavis?.track?.("signup", {
            src: "ghl_postmessage",
            page: "inscription",
            resto: RESTO
          });
        } catch(_) {}
      }

      setTimeout(() => window.location.replace("redit.html"), 400);
    });
    // ────────────────────────────────────────────────────────

    function setFrameHeight(){
      const frame = document.getElementById("ghlFrame");
      const card  = document.getElementById("card");
      const sticky = document.querySelector(".sticky");

      const vh = window.innerHeight;
      const top = card.getBoundingClientRect().top;
      const stickyH = sticky.getBoundingClientRect().height;

      const safety = 8;
      const available = Math.max(420, Math.floor(vh - top - stickyH - safety));
      frame.style.height = available + "px";
    }

    window.addEventListener("resize", setFrameHeight);
    window.addEventListener("orientationchange", setFrameHeight);
    setTimeout(setFrameHeight, 60);
    setTimeout(setFrameHeight, 240);
  })();
  </script>

</body>
</html>
