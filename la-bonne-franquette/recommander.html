<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Recommander – Fidelavis</title>

  <script src="../assets/core.js"></script>

  <script>(function(){
    var m=location.pathname.match(/^\/([^/]+)\//);var s=m?m[1]:'';
    var c=s?localStorage.getItem('fv_brand_'+s):null;
    if(c)document.documentElement.style.setProperty('--brand',c);
    fetch('/'+s+'/config.json').then(function(r){return r.json();}).then(function(d){
      if(d&&d.color)document.documentElement.style.setProperty('--brand',d.color);
    }).catch(function(){});
  })();</script>

  <style>
    :root{
      --brand:#B48C4A;
      --bg:#fbfaf8;
      --card:#ffffff;
      --ink:#191919;
      --muted:#6f6f6f;
      --line:rgba(0,0,0,.08);
      --shadow:0 18px 50px rgba(0,0,0,.08);
      --r:22px;
      --topbar-h:56px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:
        radial-gradient(1100px 520px at 50% -160px,rgba(180,140,74,0.16),transparent 60%),
        linear-gradient(180deg,#fbfaf8 0%,#f6f2ec 100%);
      color:var(--ink);
      padding-top:calc(var(--topbar-h) + 20px);
      padding-bottom:36px;
    }
    .wrap{ max-width:520px; margin:0 auto; padding:0 14px; text-align:center; }

    /* Topbar */
    .topbar{
      position:fixed; top:0; left:0; right:0;
      height:var(--topbar-h); display:flex; align-items:center;
      justify-content:space-between; padding:0 16px;
      background:rgba(251,250,248,.88); backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line); z-index:100;
    }
    .back-btn{
      display:inline-grid; place-items:center;
      width:38px; height:38px; border-radius:50%;
      background:rgba(180,140,74,.14); border:none; cursor:pointer;
    }
    .back-btn::before{
      content:""; width:11px; height:11px;
      border-left:2.5px solid var(--brand);
      border-bottom:2.5px solid var(--brand);
      transform:translateX(2px) rotate(45deg); display:block;
    }
    .topbar-title{ font-size:15px; font-weight:800; color:var(--ink); }

    /* Hero */
    .hero-icon{ font-size:64px; line-height:1; margin-bottom:14px; }
    h1{ font-size:26px; font-weight:950; margin:0 0 10px; color:var(--ink); }
    .sub{ font-size:15px; color:var(--muted); margin:0 0 28px; line-height:1.5; max-width:340px; margin-left:auto; margin-right:auto; }

    /* Share buttons */
    .share-grid{ display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
    .share-btn{
      display:flex; align-items:center; gap:14px;
      width:100%; padding:16px 18px;
      background:var(--card); border:1px solid var(--line);
      border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.06);
      cursor:pointer; text-align:left; transition:transform .12s,box-shadow .12s;
      font-family:inherit;
    }
    .share-btn:active{ transform:scale(.97); box-shadow:0 4px 12px rgba(0,0,0,.05); }
    @media(hover:hover){ .share-btn:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(0,0,0,.09); } }
    .share-btn-icon{
      width:46px; height:46px; border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-size:22px; flex-shrink:0;
    }
    .share-btn-text{ flex:1; }
    .share-btn-label{ font-size:15px; font-weight:800; color:var(--ink); display:block; }
    .share-btn-sub{ font-size:12px; color:var(--muted); display:block; margin-top:2px; }

    .wa-icon{ background:#d5f5e3; }
    .sms-icon{ background:#dbeafe; }
    .copy-icon{ background:rgba(180,140,74,.12); }
    .native-icon{ background:#f3e8ff; }

    /* Grand bouton natif */
    .btn-native{
      width:100%; padding:16px; border-radius:16px; border:none;
      background:linear-gradient(135deg,var(--brand) 0%,#a97f37 100%);
      color:#fff; font-size:16px; font-weight:900; font-family:inherit;
      cursor:pointer; box-shadow:0 16px 32px rgba(180,140,74,.25);
      transition:transform .12s,box-shadow .12s;
      display:flex; align-items:center; justify-content:center; gap:10px;
    }
    .btn-native:active{ transform:scale(.98); }
    @media(hover:hover){ .btn-native:hover{ transform:translateY(-2px); box-shadow:0 20px 36px rgba(180,140,74,.3); } }

    /* Toast */
    #toast{
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
      background:var(--ink); color:#fff; padding:11px 20px;
      border-radius:999px; font-size:14px; font-weight:700;
      box-shadow:0 6px 20px rgba(0,0,0,.2); z-index:9999;
      transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .28s;
      opacity:0; white-space:nowrap; pointer-events:none;
    }
    #toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }
    #toast.success{ background:#1a9e5c; }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(10px);}
      to{opacity:1;transform:translateY(0);}
    }
    .anim{ animation:fadeIn .35s ease; }
  </style>
</head>

<body>
  <header class="topbar">
    <button class="back-btn" aria-label="Retour" onclick="goBack()"></button>
    <span class="topbar-title">Recommander</span>
    <div style="width:38px"></div>
  </header>

  <div class="wrap anim">
    <div class="hero-icon">❤️</div>
    <h1>Invitez un ami</h1>
    <p class="sub" id="subText">Partagez ce restaurant à vos proches et faites-leur découvrir une expérience unique.</p>

    <div class="share-grid" id="shareGrid">
      <!-- rempli par JS -->
    </div>

    <button class="btn-native" id="btnNative" style="display:none" onclick="shareNative()">
      <span>📤</span><span>Partager maintenant</span>
    </button>
  </div>

  <div id="toast"></div>

<script>
const RESTO = window.Fidelavis?.getRestoSlug?.() || "resto1";
const SHARE_URL = window.location.origin + "/" + RESTO + "/indexnfc.html";
let _restoName = "";

function goBack(){
  if(window.history.length > 1) window.history.back();
  else window.Fidelavis?.go?.("index.html");
}

function showToast(msg, type){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show" + (type ? " " + type : "");
  clearTimeout(t._tt);
  t._tt = setTimeout(() => { t.className = ""; }, 2600);
}

function trackShare(method){
  window.Fidelavis?.track?.("share_click", { src: "recommander_" + method });
  try{
    const key = "fv_shares_" + RESTO;
    const n = parseInt(localStorage.getItem(key) || "0") + 1;
    localStorage.setItem(key, String(n));
  }catch(_){}
}

function shareWa(){
  trackShare("whatsapp");
  const msg = encodeURIComponent("Hé ! J'adore " + (_restoName || "ce restaurant") + " 🍽️ Tu devrais essayer, ils ont des offres exclusives : " + SHARE_URL);
  window.open("https://wa.me/?text=" + msg, "_blank");
}

function shareSms(){
  trackShare("sms");
  const msg = encodeURIComponent("Hé ! J'adore " + (_restoName || "ce restaurant") + " 🍽️ Offres exclusives : " + SHARE_URL);
  window.location.href = "sms:?body=" + msg;
}

function copyLink(){
  trackShare("copy");
  if(navigator.clipboard?.writeText){
    navigator.clipboard.writeText(SHARE_URL)
      .then(() => showToast("✅ Lien copié !", "success"))
      .catch(() => { prompt("Copiez ce lien :", SHARE_URL); });
  } else {
    prompt("Copiez ce lien :", SHARE_URL);
  }
}

function shareNative(){
  trackShare("native");
  navigator.share({
    title: _restoName || "Restaurant",
    text: "Découvrez " + (_restoName || "ce restaurant") + " et ses offres exclusives 🍽️",
    url: SHARE_URL
  }).catch(() => {});
}

(async function init(){
  let cfg = null;
  try{ cfg = await window.Fidelavis?.loadConfig?.(); }catch(e){}
  _restoName = (cfg && cfg.name) || localStorage.getItem("fv_resto_name_" + RESTO) || "ce restaurant";

  document.getElementById("subText").textContent =
    "Partagez " + _restoName + " à vos proches et faites-leur découvrir une expérience unique.";

  const grid = document.getElementById("shareGrid");
  grid.innerHTML = `
    <button class="share-btn" onclick="shareWa()">
      <div class="share-btn-icon wa-icon">💬</div>
      <div class="share-btn-text">
        <span class="share-btn-label">WhatsApp</span>
        <span class="share-btn-sub">Envoyer à un contact ou un groupe</span>
      </div>
    </button>
    <button class="share-btn" onclick="shareSms()">
      <div class="share-btn-icon sms-icon">✉️</div>
      <div class="share-btn-text">
        <span class="share-btn-label">SMS</span>
        <span class="share-btn-sub">Envoyer par message texte</span>
      </div>
    </button>
    <button class="share-btn" onclick="copyLink()">
      <div class="share-btn-icon copy-icon">🔗</div>
      <div class="share-btn-text">
        <span class="share-btn-label">Copier le lien</span>
        <span class="share-btn-sub">Coller dans n'importe quelle app</span>
      </div>
    </button>`;

  if(navigator.share){
    document.getElementById("btnNative").style.display = "flex";
  }
})();
</script>
</body>
</html>
