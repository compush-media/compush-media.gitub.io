<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réinitialiser mot de passe — Fidelavis</title>
  <style>
    :root {
      --brand:#B48C4A; --brand2:#a97f37; --brand-bg:rgba(180,140,74,.09);
      --brand-border:rgba(180,140,74,.28);
      --bg:#fbfaf8; --bg2:#f5f1eb; --card:#ffffff;
      --ink:#191919; --muted:#6f6f6f; --line:rgba(0,0,0,.08);
      --shadow:0 4px 28px rgba(0,0,0,.08); --r:14px;
      --green:#1a9e5c; --red:#d93025; --blue:#1a73e8;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

    .header{background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 24px;height:58px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
    .logo{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:900;font-size:13px;padding:5px 11px;border-radius:999px}
    .header-title{font-size:16px;font-weight:800}
    .header a{margin-left:auto;font-size:13px;color:var(--muted);text-decoration:none;font-weight:600}
    .header a:hover{color:var(--brand)}

    .page{max-width:540px;margin:36px auto;padding:0 20px 60px}
    .hero{text-align:center;margin-bottom:28px}
    .hero-icon{font-size:44px;margin-bottom:12px}
    .hero h1{font-size:24px;font-weight:900;margin-bottom:7px}
    .hero p{color:var(--muted);font-size:14px}

    /* TOKEN */
    .token-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);border:1.5px solid var(--brand-border);background:var(--brand-bg);margin-bottom:20px;font-size:13px}
    .token-banner.ok{border-color:rgba(26,158,92,.3);background:rgba(26,158,92,.07)}
    .token-banner.error{border-color:rgba(217,48,37,.3);background:rgba(217,48,37,.06)}
    .token-dot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex-shrink:0}
    .token-banner.ok .token-dot{background:var(--green)}
    .token-banner.error .token-dot{background:var(--red)}
    .token-banner b{font-weight:800}
    .token-actions{margin-left:auto;display:flex;gap:8px}
    .token-btn{font-size:12px;font-weight:700;padding:5px 10px;border-radius:7px;border:none;cursor:pointer;background:rgba(0,0,0,.07);color:var(--ink)}
    .token-btn:hover{background:rgba(0,0,0,.12)}

    /* CARD */
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow);margin-bottom:20px}
    .card-title{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px}
    .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
    .field:last-child{margin-bottom:0}
    label{font-size:12px;font-weight:700;color:var(--muted)}
    select,input[type="text"],input[type="password"]{padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s}
    select:focus,input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
    input.error{border-color:var(--red)}
    .hint{font-size:11px;color:var(--muted)}

    /* RESTO CARD */
    .resto-info{display:none;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
    .resto-info.show{display:flex}
    .resto-dot{width:36px;height:36px;border-radius:50%;flex-shrink:0}
    .resto-name{font-weight:800;font-size:14px}
    .resto-slug{font-size:11px;color:var(--muted);font-family:monospace}

    /* PASS ROW */
    .pass-row{display:flex;align-items:center;gap:8px}
    .pass-row input{flex:1}
    .eye-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:6px;border-radius:6px;color:var(--muted);flex-shrink:0}
    .eye-btn:hover{background:var(--bg2)}

    /* BUTTON */
    .btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;transition:opacity .15s;margin-top:4px}
    .btn-primary:hover{opacity:.88}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}

    /* PROGRESS */
    .progress-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow);display:none}
    .progress-card.show{display:block}
    .step{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
    .step:last-child{border-bottom:none}
    .step-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
    .step-icon.wait{background:var(--bg2);color:var(--muted)}
    .step-icon.spin{background:rgba(180,140,74,.15);color:var(--brand);animation:spin .8s linear infinite}
    .step-icon.done{background:rgba(26,158,92,.12);color:var(--green)}
    .step-icon.fail{background:rgba(217,48,37,.1);color:var(--red)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .step-label{font-weight:700}

    .success-banner{display:flex;align-items:center;gap:14px;padding:18px;background:rgba(26,158,92,.07);border:1.5px solid rgba(26,158,92,.25);border-radius:var(--r);margin-top:20px}
    .success-icon{font-size:32px}
    .success-name{font-size:16px;font-weight:900}
    .success-creds{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.8}
    .success-creds code{background:var(--bg2);padding:2px 6px;border-radius:5px;font-size:12px;color:var(--ink)}

    .error-box{background:rgba(217,48,37,.06);border:1.5px solid rgba(217,48,37,.25);border-radius:10px;padding:14px 16px;font-size:13px;color:#b52819;margin-top:14px;line-height:1.6}

    .btn-new{display:block;width:100%;padding:12px;text-align:center;border:1.5px dashed var(--brand-border);border-radius:10px;font-size:14px;font-weight:700;color:var(--brand);background:none;cursor:pointer;margin-top:16px}
    .btn-new:hover{background:var(--brand-bg)}
  </style>
</head>
<body>

<header class="header">
  <span class="logo">FV</span>
  <span class="header-title">Fidelavis</span>
  <a href="index.html">← Dashboard</a>
</header>

<div class="page">
  <div class="hero">
    <div class="hero-icon">🔑</div>
    <h1>Réinitialiser le mot de passe</h1>
    <p>Choisissez un restaurant et définissez de nouveaux accès admin.</p>
  </div>

  <!-- TOKEN -->
  <div class="token-banner" id="tokenBanner">
    <div class="token-dot"></div>
    <span><b>Token GitHub</b> — chargement…</span>
    <div class="token-actions" id="tokenActions"></div>
  </div>

  <!-- FORM -->
  <div class="card" id="mainCard">
    <div class="card-title">Restaurant</div>

    <div class="field">
      <label for="fResto">Choisir le restaurant</label>
      <select id="fResto" onchange="onRestoChange()">
        <option value="">— chargement… —</option>
      </select>
    </div>

    <div class="resto-info" id="restoInfo">
      <div class="resto-dot" id="restoDot"></div>
      <div>
        <div class="resto-name" id="restoName"></div>
        <div class="resto-slug" id="restoSlug"></div>
      </div>
    </div>

    <div class="card-title" style="margin-top:8px">Nouveaux accès</div>

    <div class="field">
      <label for="fAdminPass">Nouveau mot de passe admin *</label>
      <div class="pass-row">
        <input id="fAdminPass" type="password" placeholder="ex: bistro2025" autocomplete="new-password" />
        <button class="eye-btn" onclick="toggleEye('fAdminPass',this)" title="Afficher/masquer">👁</button>
      </div>
      <span class="hint">Identifiant : <code>admin</code></span>
    </div>

    <div class="field">
      <label for="fEmployePass">Nouveau mot de passe employé</label>
      <div class="pass-row">
        <input id="fEmployePass" type="password" placeholder="laisser vide = inchangé" autocomplete="new-password" />
        <button class="eye-btn" onclick="toggleEye('fEmployePass',this)" title="Afficher/masquer">👁</button>
      </div>
      <span class="hint">Identifiant : <code>employe</code> — laisser vide pour ne pas modifier</span>
    </div>

    <button class="btn-primary" id="resetBtn" onclick="resetPassword()">
      🔑 Réinitialiser le mot de passe
    </button>
  </div>

  <!-- PROGRESS -->
  <div class="progress-card" id="progressCard">
    <div id="stepsList"></div>
    <div class="error-box" id="errorBox" style="display:none"></div>
  </div>
</div>

<script>
const GH_OWNER  = 'compush-media';
const GH_REPO   = 'compush-media.gitub.io';
const GH_BRANCH = 'main';

// ─── Token ─────────────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem('fv_gh_token') || ''; }

async function initToken() {
  const b = document.getElementById('tokenBanner');
  if (!getToken()) {
    b.className = 'token-banner error';
    b.querySelector('span').innerHTML = '<b>Token GitHub manquant</b> — configurez-le sur la page <a href="new-restaurant.html">Nouveau restaurant</a>';
    return false;
  }
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`, {
      headers: { 'Authorization': `Bearer ${getToken()}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
    });
    const data = await res.json();
    const canPush = data.permissions?.push || data.permissions?.admin;
    if (!res.ok || !canPush) throw new Error();
    b.className = 'token-banner ok';
    b.querySelector('span').innerHTML = `<b>Token GitHub</b> — accès vérifié ✓`;
    document.getElementById('tokenActions').innerHTML =
      `<button class="token-btn" onclick="initToken()">Tester</button>`;
    return true;
  } catch {
    b.className = 'token-banner error';
    b.querySelector('span').innerHTML = '<b>Token invalide ou insuffisant</b> — reconfigurer sur <a href="new-restaurant.html">Nouveau restaurant</a>';
    return false;
  }
}

// ─── GitHub API ─────────────────────────────────────────────────────────────
async function ghApi(path, method='GET', body=null) {
  const opts = {
    method,
    headers: {
      'Authorization': `Bearer ${getToken()}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json',
    }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}${path}`, opts);
  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    if (res.status === 403) throw new Error('403 — Token sans permission d\'écriture. Reconfigurez-le sur la page Nouveau restaurant.');
    throw new Error(`GitHub API ${res.status}: ${err.message || res.statusText}`);
  }
  if (res.status === 204) return null;
  return res.json();
}

// ─── Load restaurants ───────────────────────────────────────────────────────
let restaurants = {};
async function loadRestaurants() {
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/data/restaurants.json`, {
      headers: { 'Authorization': `Bearer ${getToken()}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
    });
    const data = await res.json();
    restaurants = JSON.parse(atob(data.content.replace(/\s/g,'')));
    const sel = document.getElementById('fResto');
    sel.innerHTML = '<option value="">— Sélectionner un restaurant —</option>' +
      Object.entries(restaurants).map(([slug, r]) =>
        `<option value="${slug}">${r.name} (/${slug}/)</option>`
      ).join('');
  } catch {
    document.getElementById('fResto').innerHTML = '<option value="">Erreur de chargement</option>';
  }
}

function onRestoChange() {
  const slug = document.getElementById('fResto').value;
  const info = document.getElementById('restoInfo');
  if (!slug || !restaurants[slug]) { info.classList.remove('show'); return; }
  const r = restaurants[slug];
  document.getElementById('restoDot').style.background =
    `linear-gradient(135deg,${r.brandColor||'#B48C4A'},${r.brandColor2||'#9E7A3E'})`;
  document.getElementById('restoName').textContent = r.name;
  document.getElementById('restoSlug').textContent = `/${slug}/admin/login.html`;
  info.classList.add('show');
}

// ─── Eye toggle ─────────────────────────────────────────────────────────────
function toggleEye(id, btn) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
  btn.textContent = el.type === 'password' ? '👁' : '🙈';
}

// ─── Steps UI ───────────────────────────────────────────────────────────────
const STEPS = [
  { id:'s1', label:'Lecture du fichier login.html actuel' },
  { id:'s2', label:'Application des nouveaux mots de passe' },
  { id:'s3', label:'Commit et déploiement' },
  { id:'s4', label:'Envoi de l\'email de notification' },
];
function renderSteps() {
  document.getElementById('stepsList').innerHTML = STEPS.map(s =>
    `<div class="step" id="${s.id}">
      <div class="step-icon wait" id="${s.id}Icon">○</div>
      <div class="step-label">${s.label}</div>
    </div>`
  ).join('');
}
function stepStart(id){ const i=document.getElementById(id+'Icon'); i.className='step-icon spin'; i.textContent='↻'; }
function stepDone(id) { const i=document.getElementById(id+'Icon'); i.className='step-icon done'; i.textContent='✓'; }
function stepFail(id) { const i=document.getElementById(id+'Icon'); i.className='step-icon fail'; i.textContent='✕'; }

// ─── Reset password ──────────────────────────────────────────────────────────
async function resetPassword() {
  const slug      = document.getElementById('fResto').value;
  const adminPass = document.getElementById('fAdminPass').value.trim();
  const empPass   = document.getElementById('fEmployePass').value.trim();

  // Validate
  document.getElementById('fAdminPass').classList.toggle('error', !adminPass);
  if (!slug)      { document.getElementById('fResto').style.borderColor='var(--red)'; return; }
  else              document.getElementById('fResto').style.borderColor='';
  if (!adminPass) return;

  document.getElementById('resetBtn').disabled = true;
  const pc = document.getElementById('progressCard');
  renderSteps();
  pc.classList.add('show');
  pc.scrollIntoView({ behavior:'smooth', block:'start' });
  document.getElementById('errorBox').style.display = 'none';

  try {
    // ── S1 : fetch current login.html ─────────────────────────────
    stepStart('s1');
    const refData    = await ghApi(`/git/ref/heads/${GH_BRANCH}`);
    const commitSha  = refData.object.sha;
    const commitData = await ghApi(`/git/commits/${commitSha}`);
    const treeSha    = commitData.tree.sha;
    const treeData   = await ghApi(`/git/trees/${treeSha}?recursive=1`);

    const loginPath = `${slug}/admin/login.html`;
    const loginItem = treeData.tree.find(f => f.path === loginPath);
    if (!loginItem) throw new Error(`Fichier introuvable : ${loginPath}`);

    const blobData = await ghApi(`/git/blobs/${loginItem.sha}`);
    let content = new TextDecoder().decode(
      Uint8Array.from(atob(blobData.content.replace(/\s/g,'')), c => c.charCodeAt(0))
    );
    stepDone('s1');

    // ── S2 : patch credentials ────────────────────────────────────
    stepStart('s2');
    content = content.replace(
      /(\{ user: "admin",\s*pass: ")[^"]*(")/,
      `$1${adminPass}$2`
    );
    if (empPass) {
      content = content.replace(
        /(\{ user: "employe",\s*pass: ")[^"]*(")/,
        `$1${empPass}$2`
      );
    }
    stepDone('s2');

    // ── S3 : commit ───────────────────────────────────────────────
    stepStart('s3');
    const blob = await ghApi('/git/blobs', 'POST', { content, encoding: 'utf-8' });
    const newTree = await ghApi('/git/trees', 'POST', {
      base_tree: treeSha,
      tree: [{ path: loginPath, mode: '100644', type: 'blob', sha: blob.sha }]
    });
    const newCommit = await ghApi('/git/commits', 'POST', {
      message: `fix: réinitialisation mot de passe admin — ${restaurants[slug]?.name || slug}`,
      tree: newTree.sha,
      parents: [commitSha]
    });
    await ghApi(`/git/refs/heads/${GH_BRANCH}`, 'PATCH', { sha: newCommit.sha, force: false });
    stepDone('s3');

    // ── S4 : send password reset email ───────────────────────
    stepStart('s4');
    const r4 = restaurants[slug];
    const brevoGasUrl = r4?.brevoGasUrl;
    const adminEmail  = r4?.email;
    if (brevoGasUrl && adminEmail) {
      try {
        const emailPayload = {
          action:         'passwordReset',
          restaurantId:   slug,
          restaurantName: r4.name || slug,
          recipientEmail: adminEmail,
          recipientName:  r4.name || '',
          adminPass,
        };
        if (empPass) emailPayload.empPass = empPass;
        const emailRes = await fetch(brevoGasUrl, {
          method:  'POST',
          headers: { 'Content-Type': 'text/plain' },
          body:    JSON.stringify(emailPayload)
        });
        const emailData = await emailRes.json().catch(() => ({}));
        if (!emailData.success) throw new Error(emailData.error || 'Erreur inconnue');
        stepDone('s4');
      } catch(emailErr) {
        stepFail('s4');
        document.getElementById('errorBox').style.display = 'block';
        document.getElementById('errorBox').textContent =
          '⚠️ Mot de passe mis à jour, mais l\'email n\'a pas pu être envoyé : ' + emailErr.message;
      }
    } else {
      const s4Icon = document.getElementById('s4Icon');
      s4Icon.className = 'step-icon wait';
      s4Icon.textContent = '—';
      document.getElementById('s4').querySelector('.step-label').textContent =
        'Email ignoré' + (!brevoGasUrl ? ' (Brevo non configuré)' : ' (adresse email manquante)');
    }

    // ── SUCCESS ───────────────────────────────────────────────────
    const r = restaurants[slug];
    const emailSentLine = (brevoGasUrl && adminEmail)
      ? `<br><small style="color:var(--green)">📧 Email envoyé à ${adminEmail}</small>`
      : '';
    pc.insertAdjacentHTML('beforeend', `
      <div class="success-banner">
        <span class="success-icon">✅</span>
        <div>
          <div class="success-name">${r?.name || slug} — mot de passe mis à jour</div>
          <div class="success-creds">
            Admin&nbsp;&nbsp; : <code>admin</code> / <code>${adminPass}</code><br>
            ${empPass ? `Employé : <code>employe</code> / <code>${empPass}</code>` : `Employé : <em>inchangé</em>`}
            ${emailSentLine}
          </div>
        </div>
      </div>
      <a class="btn-new" href="https://app.cartefidelavis.com/${slug}/admin/login.html" target="_blank">
        Tester la connexion →
      </a>
      <button class="btn-new" onclick="location.reload()">Réinitialiser un autre restaurant</button>
    `);

  } catch(err) {
    STEPS.forEach(s => { if(document.getElementById(s.id+'Icon').classList.contains('spin')) stepFail(s.id); });
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('errorBox').textContent = '⚠️ ' + err.message;
    document.getElementById('resetBtn').disabled = false;
  }
}

// ─── Init ────────────────────────────────────────────────────────────────────
(async () => {
  const ok = await initToken();
  if (ok) await loadRestaurants();
})();
</script>
</body>
</html>
