<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fidelavis — Obtenir mon ID Google Business</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --brand:  #B48C4A;
      --bg:     #fbfaf8;
      --card:   #ffffff;
      --ink:    #191919;
      --muted:  #6f6f6f;
      --line:   rgba(0,0,0,.08);
      --green:  #1a9e5c;
      --green-bg:#edf7f2;
      --red:    #d93025;
      --red-bg: #fdf0ef;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(0,0,0,.09);
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
    }
    .logo {
      font-size: 22px;
      font-weight: 900;
      color: var(--brand);
      margin-bottom: 8px;
    }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; }

    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px 20px;
      background: #fff; border: 1.5px solid var(--line);
      border-radius: 12px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: box-shadow .15s;
      color: var(--ink);
    }
    .btn-google:hover { box-shadow: 0 2px 12px rgba(0,0,0,.1); }
    .btn-google:disabled { opacity: .5; cursor: not-allowed; }

    .result { display: none; margin-top: 24px; }
    .result.show { display: block; }

    .location-box {
      background: var(--green-bg);
      border: 1.5px solid rgba(26,158,92,.25);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .location-name { font-weight: 800; font-size: 15px; margin-bottom: 6px; }
    .location-id {
      font-family: monospace; font-size: 12px;
      background: #fff; padding: 8px 10px;
      border-radius: 8px; border: 1px solid var(--line);
      word-break: break-all; margin-bottom: 10px;
      color: #333;
    }
    .btn-copy {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; background: var(--green); color: #fff;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
      cursor: pointer; width: 100%; justify-content: center;
    }
    .btn-copy:hover { opacity: .9; }
    .btn-copy.copied { background: #0d7a44; }

    .error-box {
      background: var(--red-bg);
      border: 1.5px solid rgba(217,48,37,.2);
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
      color: var(--red);
      margin-bottom: 16px;
    }
    .guide {
      background: #f8f6f2;
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.8;
    }
    .guide strong { color: var(--brand); }
    .guide a { color: var(--brand); font-weight: 700; }
    .guide ol { padding-left: 20px; }
    .guide li { margin-bottom: 6px; }
    .step-url {
      font-family: monospace; font-size: 11px;
      background: #fff; padding: 6px 10px;
      border-radius: 6px; border: 1px solid var(--line);
      word-break: break-all; margin: 8px 0; display: block;
    }
    .user-info {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: var(--green-bg); border-radius: 10px;
      margin-bottom: 16px; font-size: 13px;
    }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--brand); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px; flex-shrink: 0;
    }
    .loading { text-align: center; color: var(--muted); font-size: 14px; padding: 16px 0; }
    .spinner {
      width: 28px; height: 28px; border: 3px solid var(--line);
      border-top-color: var(--brand); border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">Fidelavis</div>
  <h1>Obtenir mon ID Google Business</h1>
  <p class="subtitle">
    Connectez votre compte Google pour obtenir l'identifiant de votre fiche.<br>
    Votre ambassadeur en a besoin pour activer les réponses automatiques aux avis.
  </p>

  <button class="btn-google" id="connectBtn" onclick="connectGoogle()">
    <svg width="18" height="18" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Connecter mon compte Google
  </button>

  <div class="result" id="result"></div>
</div>

<script>
const CLIENT_ID = '160826808258-k3mh1hgf3vgquu1okkdq8vj0smmn0jdh.apps.googleusercontent.com';
const SCOPE     = 'https://www.googleapis.com/auth/business.manage';
let googleToken = null;

// ── Gestion du retour OAuth (hash fragment) ──────────────────────
(function() {
  const hash = new URLSearchParams(location.hash.substring(1));
  if (hash.get('access_token')) {
    googleToken = hash.get('access_token');
    history.replaceState({}, '', location.pathname);
    onTokenReceived();
  }
})();

function connectGoogle() {
  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0"></div> Connexion…';

  // Essai avec Google Identity Services
  if (window.google && google.accounts && google.accounts.oauth2) {
    try {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: (resp) => {
          if (resp.access_token) {
            googleToken = resp.access_token;
            onTokenReceived();
          } else {
            resetBtn();
          }
        }
      });
      client.requestAccessToken({ prompt: 'select_account' });
      return;
    } catch(e) {}
  }

  // Fallback : redirect OAuth
  const redirect = encodeURIComponent(location.origin + '/fidelavis-admin/get-location-id.html');
  window.location.href =
    'https://accounts.google.com/o/oauth2/v2/auth' +
    '?client_id=' + CLIENT_ID +
    '&redirect_uri=' + redirect +
    '&response_type=token' +
    '&scope=' + encodeURIComponent(SCOPE) +
    '&prompt=select_account';
}

function resetBtn() {
  const btn = document.getElementById('connectBtn');
  btn.disabled = false;
  btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Connecter mon compte Google`;
}

async function onTokenReceived() {
  const resultEl = document.getElementById('result');
  const btn      = document.getElementById('connectBtn');
  btn.style.display = 'none';
  resultEl.classList.add('show');
  resultEl.innerHTML = '<div class="loading"><div class="spinner"></div>Recherche de votre fiche…</div>';

  // ── 1. Infos utilisateur ──────────────────────────────────────
  let userEmail = '', userName = '';
  try {
    const u = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { 'Authorization': 'Bearer ' + googleToken }
    });
    const ud = await u.json();
    userEmail = ud.email || '';
    userName  = ud.name  || '';
  } catch(_) {}

  // ── 2. Tentative API GBP ──────────────────────────────────────
  let locations = [];
  let apiOk     = false;
  let apiError  = '';

  // Tentative 1 : mybusinessaccountmanagement → accounts → locations
  try {
    const r1 = await fetch('https://mybusinessaccountmanagement.googleapis.com/v1/accounts', {
      headers: { 'Authorization': 'Bearer ' + googleToken }
    });
    if (r1.ok) {
      const d1   = await r1.json();
      const accs = d1.accounts || [];
      for (const acc of accs) {
        const r2 = await fetch(
          'https://mybusinessinformation.googleapis.com/v1/' + acc.name + '/locations?readMask=name,title',
          { headers: { 'Authorization': 'Bearer ' + googleToken } }
        );
        if (r2.ok) {
          const d2 = await r2.json();
          (d2.locations || []).forEach(loc => {
            locations.push({ id: loc.name, name: loc.title || loc.name });
          });
          apiOk = true;
        }
      }
    } else {
      const err = await r1.json().catch(() => ({}));
      apiError  = err?.error?.message || ('Code ' + r1.status);
    }
  } catch(e) { apiError = e.message; }

  // ── 3. Rendu ─────────────────────────────────────────────────
  let html = '';

  // Bloc compte connecté
  if (userEmail) {
    html += `<div class="user-info">
      <div class="user-avatar">${(userName || userEmail)[0].toUpperCase()}</div>
      <div>
        <div style="font-weight:700;font-size:14px">${esc(userName || userEmail)}</div>
        <div style="font-size:12px;color:var(--muted)">${esc(userEmail)}</div>
      </div>
    </div>`;
  }

  if (apiOk && locations.length > 0) {
    // ✅ Succès — on affiche les fiches
    html += `<p style="font-weight:700;font-size:14px;margin-bottom:12px;color:var(--green)">✅ ${locations.length} fiche${locations.length > 1 ? 's' : ''} trouvée${locations.length > 1 ? 's' : ''}</p>`;
    locations.forEach((loc, i) => {
      const locId = loc.id; // ex: accounts/109.../locations/956...
      html += `<div class="location-box">
        <div class="location-name">📍 ${esc(loc.name)}</div>
        <div class="location-id" id="locid-${i}">${esc(locId)}</div>
        <button class="btn-copy" onclick="copyId('locid-${i}', this)">📋 Copier l'ID</button>
      </div>`;
    });
    html += `<p style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6">
      Transmettez cet ID à votre ambassadeur pour qu'il le saisisse dans le formulaire de création.
    </p>`;

  } else {
    // ❌ API indisponible — guide manuel
    html += `<div class="error-box">
      ⚠️ L'accès automatique à votre fiche n'est pas encore disponible${apiError ? ' (' + esc(apiError) + ')' : ''}.
      Suivez le guide ci-dessous pour trouver votre ID manuellement.
    </div>`;

    html += `<div class="guide">
      <p style="font-weight:700;margin-bottom:10px">📋 Comment trouver votre ID en 3 étapes :</p>
      <ol>
        <li>Allez sur <a href="https://business.google.com" target="_blank">business.google.com</a> avec le même compte Google (<strong>${esc(userEmail)}</strong>)</li>
        <li>Cliquez sur votre établissement pour ouvrir le tableau de bord</li>
        <li>Regardez l'URL dans votre navigateur — elle contient votre ID :</li>
      </ol>
      <span class="step-url">business.google.com/…/locations/<strong>9563940357552092280</strong>/…</span>
      <p style="margin-top:8px">Copiez le <strong>numéro</strong> qui apparaît après <code style="background:#eee;padding:1px 4px;border-radius:3px">/locations/</code> et transmettez-le à votre ambassadeur.</p>
    </div>`;
  }

  html += `<p style="font-size:12px;color:var(--muted);margin-top:16px;text-align:center">
    Vous pouvez fermer cette page après avoir copié votre ID.
  </p>`;

  resultEl.innerHTML = html;
}

function copyId(elId, btn) {
  const text = document.getElementById(elId)?.textContent || '';
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ Copié !';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copier l\'ID'; btn.classList.remove('copied'); }, 2500);
  });
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
