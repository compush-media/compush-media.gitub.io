<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Merci — Fidelavis</title>
  <style>
    :root {
      --brand: #b6152b;
      --green: #059669;
      --green-bg: #d1fae5;
      --bg: #f4f6f9;
      --ink: #1c1c2e;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(0,0,0,.10);
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
    }

    .icon {
      width: 72px; height: 72px;
      background: var(--green-bg);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      margin: 0 auto 24px;
    }

    h1 {
      font-size: 26px; font-weight: 900;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px; color: var(--muted);
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .highlight {
      color: var(--ink); font-weight: 600;
    }

    .divider {
      border: none; border-top: 1px solid #e5e7eb;
      margin: 28px 0;
    }

    .btn {
      display: inline-block;
      background: var(--brand); color: #fff;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 15px; font-weight: 700;
      text-decoration: none;
      margin-top: 8px;
      transition: background .15s;
    }
    .btn:hover { background: #8b0f21; }

    .logo {
      font-size: 13px; color: var(--muted);
      margin-top: 32px;
      font-weight: 700; letter-spacing: .03em;
    }
  </style>
</head>
<script>
  // Redirection immédiate vers le formulaire de création du restaurant
  (function() {
    var params = new URLSearchParams(window.location.search);
    var sessionId = params.get("session_id") || "";
    var url = "/fidelavis-admin/setup.html" + (sessionId ? "?session_id=" + sessionId : "");
    window.location.replace(url);
  })();
</script>
<body>
  <div class="card">
    <div class="icon">⏳</div>
    <h1>Redirection…</h1>
    <p>Vous allez être redirigé vers la configuration de votre restaurant.</p>
  </div>
</body>
</html>
