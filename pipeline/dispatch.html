<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dispatch DM Fidelavis</title>
<meta name="viewport" content="width=1200">
<style>
  :root {
    --bg: #0e0e10;
    --panel: #18181c;
    --panel-2: #1f1f24;
    --line: #2a2a30;
    --ink: #f5f5f7;
    --ink-mute: #9b9ba3;
    --brand: #ffd966;
    --green: #34d399;
    --red: #f87171;
    --blue: #60a5fa;
    --r: 14px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }

  header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(10px);
    background: rgba(14, 14, 16, .85);
    border-bottom: 1px solid var(--line);
    padding: 14px 28px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  .stats { display: flex; gap: 14px; font-size: 12px; color: var(--ink-mute); margin-left: 12px; }
  .stat strong { color: var(--ink); font-size: 14px; margin-left: 4px; }
  .stat.ok strong   { color: var(--green); }
  .stat.miss strong { color: var(--red); }
  .filter input, .filter select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }
  .filter { display: flex; gap: 8px; margin-left: auto; }
  .btn-reset {
    background: transparent; color: var(--ink-mute); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .btn-reset:hover { color: var(--ink); border-color: var(--ink-mute); }

  main { padding: 24px 28px 60px; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
    overflow: hidden; display: flex; flex-direction: column;
    transition: border-color .15s;
  }
  .card.sent  { border-color: rgba(52,211,153,.4); background: linear-gradient(0deg, rgba(52,211,153,.04), rgba(52,211,153,.04)), var(--panel); }
  .card.no-handle { opacity: .55; }

  .card .preview {
    background: #000; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--line); overflow: hidden;
  }
  .card .preview img { width: 75%; height: auto; }
  .card .preview video { max-width: 100%; max-height: 100%; }

  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .name { font-weight: 700; font-size: 15px; }
  .handle { font-size: 12.5px; color: var(--brand); text-decoration: none; word-break: break-all; }
  .handle:hover { text-decoration: underline; }
  .no-h { font-size: 12px; color: var(--red); font-style: italic; }

  textarea.msg {
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 10px; font: 12px/1.55 ui-monospace, "SF Mono", Menlo, monospace;
    resize: vertical; min-height: 130px; width: 100%;
  }

  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn {
    flex: 1 1 auto; padding: 7px 10px; font-size: 12px; font-weight: 600;
    border-radius: 8px; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  }
  .btn:hover { border-color: var(--ink-mute); }
  .btn.primary { background: var(--brand); color: #1a1a1a; border-color: var(--brand); }
  .btn.primary:hover { filter: brightness(.95); }
  .btn.sent    { background: var(--green); color: #062618; border-color: var(--green); }
  .btn.disabled { opacity: .4; pointer-events: none; }

  .meta { font-size: 11px; color: var(--ink-mute); display: flex; flex-wrap: wrap; gap: 6px 12px; }
  .meta a { color: var(--blue); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .badge { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; font-size: 11px; color: var(--ink-mute); }
  .badge.ok { color: var(--green); border-color: rgba(52,211,153,.35); }
  .badge.no { color: var(--red); border-color: rgba(248,113,113,.35); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px);
    background: var(--ink); color: #111; padding: 10px 18px; border-radius: 999px;
    font-weight: 600; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s;
    z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,.3);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty {
    padding: 60px 20px; text-align: center; color: var(--ink-mute);
    border: 1.5px dashed var(--line); border-radius: var(--r);
  }
  .empty code { color: var(--brand); }

  /* Étapes du workflow trio */
  .step { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; }
  .step-h { font-size: 12.5px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .step-n { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: var(--brand); color: #1a1a1a; font-size: 12px; font-weight: 800; flex-shrink: 0; }
  .step-tag { font-size: 10.5px; font-weight: 600; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .4px; }
  .step-tag.green { color: var(--green); }
  .step-actions { display: flex; gap: 6px; }
  .body { gap: 12px !important; }
</style>
</head>
<body>

<header>
  <h1>📨 Dispatch DM Fidelavis</h1>
  <div class="stats">
    <div class="stat"><span>Total</span><strong id="stTotal">0</strong></div>
    <div class="stat ok"><span>Envoyés</span><strong id="stSent">0</strong></div>
    <div class="stat"><span>Reste</span><strong id="stRem">0</strong></div>
    <div class="stat miss"><span>Sans handle</span><strong id="stNoH">0</strong></div>
  </div>
  <div class="filter">
    <input id="search" type="search" placeholder="Filtrer (nom, handle, slug)…" autocomplete="off">
    <select id="filterMode">
      <option value="all">Tous</option>
      <option value="todo">À envoyer</option>
      <option value="sent">Déjà envoyés</option>
      <option value="ready">Avec vidéo prête</option>
      <option value="nohandle">Sans handle IG</option>
    </select>
    <button class="btn-reset" id="resetSent">Réinitialiser ✓ envoyés</button>
  </div>
</header>

<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">
    <p>Aucune entrée à afficher.</p>
    <p style="font-size:12.5px">Lance d'abord : <code>python3 scripts/gen_dm_queue.py</code></p>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
const PUBLIC = 'https://app.cartefidelavis.com';
const LS_KEY = 'fv_dm_sent_v1';
const QUEUE_URL = '../dm_videos/dispatch_queue.json';

let _queue = [];
const _sent = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]'));

function saveSent() { localStorage.setItem(LS_KEY, JSON.stringify([..._sent])); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}

function copy(text) {
  navigator.clipboard.writeText(text).then(
    () => toast('📋 Copié dans le presse-papier'),
    () => toast('Copie échouée — sélectionne manuellement')
  );
}

function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function publicPath(rel) {
  if (!rel) return '';
  if (/^https?:/.test(rel)) return rel;
  return PUBLIC + '/' + rel.replace(/^\//, '');
}

// Les vidéos ne sont plus publiées : elles vivent sur cette machine, à côté de
// cette page. On les lit donc en relatif, comme la file elle-même (chargée via
// '../dm_videos/dispatch_queue.json'). Fonctionne aussi bien servi par
// serve.py qu'ouvert directement en file://.
function localPath(rel) {
  if (!rel) return '';
  if (/^https?:/.test(rel)) return rel;
  return '../' + rel.replace(/^\//, '');
}

function cardHTML(it) {
  const sent      = _sent.has(it.slug);
  const hasVideo  = !!(it.video_url || it.video);
  const hasPhoto  = !!(it.photo_url || it.mockup);
  const hasIG     = !!it.instagram_handle;
  const mockupUrl = it.photo_url || publicPath(it.mockup);
  const videoUrl  = localPath(it.video) || it.video_url;

  const preview = hasPhoto
    ? `<img src="${esc(mockupUrl)}" alt="${esc(it.restaurant_name)}">`
    : `<div style="color:#666;font-size:13px">— pas de visuel —</div>`;

  const handleBlock = hasIG
    ? `<a class="handle" href="${esc(it.instagram_url)}" target="_blank" rel="noopener">@${esc(it.instagram_handle)} ↗</a>`
    : `<div class="no-h">❌ Handle Instagram introuvable (config.instagramUrl manquant)</div>`;

  return `
    <article class="card ${sent ? 'sent' : ''} ${hasIG ? '' : 'no-handle'}" data-slug="${esc(it.slug)}">
      <div class="preview">${preview}</div>
      <div class="body">
        <div>
          <div class="name">${esc(it.restaurant_name)}</div>
          ${handleBlock}
        </div>

        <!-- Étape 0 : ouvrir la conversation -->
        <button class="btn primary" data-act="ig" ${hasIG ? '' : 'disabled'} style="width:100%">
          🌐 Ouvrir le DM Instagram
        </button>

        <!-- Workflow trio : 3 messages à envoyer dans l'ordre -->
        <div class="step">
          <div class="step-h"><span class="step-n">1</span> Vidéo <span class="step-tag">accroche + voix</span></div>
          <div class="step-actions">
            <button class="btn ${hasVideo ? '' : 'disabled'}" data-act="dl-video">⬇️ Télécharger la vidéo</button>
            <button class="btn ${hasVideo ? '' : 'disabled'}" data-act="open-video">▶ Aperçu</button>
          </div>
        </div>

        <div class="step">
          <div class="step-h"><span class="step-n">2</span> Photo du wallet <span class="step-tag green">reste NET sur IG</span></div>
          <div class="step-actions">
            <button class="btn ${hasPhoto ? '' : 'disabled'}" data-act="dl-photo">⬇️ Télécharger la photo</button>
            <button class="btn ${hasPhoto ? '' : 'disabled'}" data-act="open-photo">🖼 Aperçu</button>
          </div>
        </div>

        <div class="step">
          <div class="step-h"><span class="step-n">3</span> Message <span class="step-tag">texte + lien démo</span></div>
          <textarea class="msg" id="msg-${esc(it.slug)}" rows="5" spellcheck="false">${esc(it.message)}</textarea>
          <button class="btn primary" data-act="copy" style="width:100%;margin-top:6px">📋 Copier le message</button>
        </div>

        <div class="meta">
          <a href="${esc(it.demo_url)}" target="_blank" rel="noopener">démo ↗</a>
          <a href="${esc(it.wallet_url)}" target="_blank" rel="noopener">wallet ↗</a>
        </div>

        <button class="btn ${sent ? 'sent' : ''}" data-act="sent" style="width:100%">
          ${sent ? '✓ Envoyé — cliquer pour annuler' : '✓ Marquer comme envoyé'}
        </button>
      </div>
    </article>`;
}

/** Force le téléchargement d'un fichier distant (sinon le navigateur l'ouvre). */
async function downloadFile(url, filename) {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    const b = await r.blob();
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(u);
    toast('⬇️ Téléchargé : ' + filename);
  } catch (e) {
    window.open(url, '_blank', 'noopener');
    toast('Ouvert dans un onglet (téléchargement bloqué)');
  }
}

function render() {
  const q     = document.getElementById('search').value.trim().toLowerCase();
  const mode  = document.getElementById('filterMode').value;
  const list  = _queue.filter(it => {
    if (q) {
      const hay = (it.restaurant_name + ' ' + it.instagram_handle + ' ' + it.slug).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    const sent = _sent.has(it.slug);
    if (mode === 'todo'     && sent) return false;
    if (mode === 'sent'     && !sent) return false;
    if (mode === 'ready'    && !it.video) return false;
    if (mode === 'nohandle' && it.instagram_handle) return false;
    return true;
  });
  const grid  = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML  = list.map(cardHTML).join('');
  empty.style.display = list.length ? 'none' : '';

  // stats
  document.getElementById('stTotal').textContent = _queue.length;
  document.getElementById('stSent').textContent  = _queue.filter(it => _sent.has(it.slug)).length;
  document.getElementById('stRem').textContent   = _queue.filter(it => !_sent.has(it.slug)).length;
  document.getElementById('stNoH').textContent   = _queue.filter(it => !it.instagram_handle).length;
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const card = btn.closest('.card');
  const slug = card?.dataset.slug;
  const it   = _queue.find(x => x.slug === slug);
  if (!it) return;
  const act  = btn.dataset.act;
  const videoUrl = localPath(it.video) || it.video_url;
  const photoUrl = it.photo_url || publicPath(it.mockup);
  if (act === 'copy') {
    const ta = document.getElementById('msg-' + slug);
    copy(ta.value);
  } else if (act === 'ig') {
    if (it.instagram_url) window.open(it.instagram_url, '_blank', 'noopener');
  } else if (act === 'open-video') {
    if (videoUrl) window.open(videoUrl, '_blank', 'noopener');
  } else if (act === 'open-photo') {
    if (photoUrl) window.open(photoUrl, '_blank', 'noopener');
  } else if (act === 'dl-video') {
    if (videoUrl) downloadFile(videoUrl, `${slug}-dm.mp4`);
  } else if (act === 'dl-photo') {
    if (photoUrl) downloadFile(photoUrl, `${slug}-wallet.png`);
  } else if (act === 'sent') {
    if (_sent.has(slug)) _sent.delete(slug); else _sent.add(slug);
    saveSent(); render();
  }
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('filterMode').addEventListener('change', render);
document.getElementById('resetSent').addEventListener('click', () => {
  if (!_sent.size) return toast('Aucun marqué envoyé.');
  if (!confirm(`Réinitialiser le statut envoyé pour ${_sent.size} entrée(s) ?`)) return;
  _sent.clear(); saveSent(); render();
  toast('Statut envoyés réinitialisé.');
});

function showFilePicker() {
  const empty = document.getElementById('empty');
  empty.style.display = '';
  empty.innerHTML = `
    <p>Impossible de charger <code>${esc(QUEUE_URL)}</code> via fetch (file:// bloque).</p>
    <p style="font-size:13px;margin-top:14px">
      Soit lance un serveur local : <code>python3 serve.py</code> puis ouvre
      <a href="http://localhost:3000/pipeline/dispatch.html" style="color:var(--brand)">http://localhost:3000/pipeline/dispatch.html</a>
    </p>
    <p style="font-size:13px;margin-top:14px">Ou charge manuellement <code>dm_videos/dispatch_queue.json</code> :</p>
    <input type="file" accept=".json" id="filePick" style="margin-top:10px">`;
  document.getElementById('filePick').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { _queue = JSON.parse(await f.text()); empty.style.display = 'none'; render(); }
    catch (err) { toast('JSON invalide : ' + err.message); }
  });
}

(async function init() {
  try {
    const res = await fetch(QUEUE_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    _queue = await res.json();
  } catch (e) {
    showFilePicker();
    return;
  }
  render();
})();
</script>
</body>
</html>
