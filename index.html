<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Fidelavis</title>
  <link rel="icon" type="image/svg+xml" href="/img/fidelavis-icon.svg" />

  <script>
    (function () {
      // Flux NFC/QR : ?resto=X → mini-app du restaurant
      var resto = new URLSearchParams(location.search).get("resto");
      if (resto) {
        var r = resto.toLowerCase().replace(/[^a-z0-9-]/g, "");
        if (r) {
          location.replace("/" + r + "/indexnfc.html");
          return;
        }
      }
      // Sinon → site vitrine
      location.replace("https://cartefidelavis.com/");
    })();
  </script>
</head>
<body></body>
</html>
