<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Réserver une table – Fidelavis</title>

  <script src="../assets/core.js"></script>

  <script>(function(){
    var m=location.pathname.match(/^\/([^/]+)\//);var s=m?m[1]:'';
    var c=s?localStorage.getItem('fv_brand_'+s):null;
    if(c)document.documentElement.style.setProperty('--brand',c);
    fetch('/'+s+'/config.json').then(function(r){return r.json();}).then(function(d){
      if(d&&d.color)document.documentElement.style.setProperty('--brand',d.color);
    }).catch(function(){});
  })();</script>

  <style>
    :root{
      --brand:#B48C4A;
      --bg:#fbfaf8;
      --card:#ffffff;
      --ink:#191919;
      --muted:#6f6f6f;
      --line:rgba(0,0,0,.08);
      --shadow:0 18px 50px rgba(0,0,0,.08);
      --r:22px;
      --topbar-h:56px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:
        radial-gradient(1100px 520px at 50% -160px,rgba(180,140,74,0.16),transparent 60%),
        linear-gradient(180deg,#fbfaf8 0%,#f6f2ec 100%);
      color:var(--ink);
      padding-top:calc(var(--topbar-h) + 20px);
      padding-bottom:36px;
    }
    .wrap{ max-width:520px; margin:0 auto; padding:0 14px; }

    /* Topbar */
    .topbar{
      position:fixed; top:0; left:0; right:0;
      height:var(--topbar-h); display:flex; align-items:center;
      justify-content:space-between; padding:0 16px;
      background:rgba(251,250,248,.88); backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line); z-index:100;
    }
    .back-btn{
      display:inline-grid; place-items:center;
      width:38px; height:38px; border-radius:50%;
      background:rgba(180,140,74,.14); border:none; cursor:pointer;
    }
    .back-btn::before{
      content:""; width:11px; height:11px;
      border-left:2.5px solid var(--brand);
      border-bottom:2.5px solid var(--brand);
      transform:translateX(2px) rotate(45deg); display:block;
    }
    .topbar-title{ font-size:15px; font-weight:800; color:var(--ink); }

    h1{ font-size:26px; font-weight:950; margin:0 0 6px; color:var(--ink); }
    .sub{ font-size:14px; color:var(--muted); margin:0 0 20px; line-height:1.4; }

    /* Quick actions */
    .quick-actions{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
    .btn{
      width:100%; padding:15px 16px; border-radius:14px;
      border:none; cursor:pointer; font-weight:800; font-size:15px;
      font-family:inherit; transition:opacity .15s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn:active{ opacity:.82; }
    .btnPrimary{
      background:linear-gradient(180deg,var(--brand) 0%,#a97f37 100%);
      color:#fff; box-shadow:0 14px 28px rgba(180,140,74,.22);
    }
    .btnSecondary{
      background:var(--card); color:var(--brand);
      border:2px solid rgba(180,140,74,.5);
    }
    .btnWa{
      background:#25D366; color:#fff;
      box-shadow:0 10px 22px rgba(37,211,102,.22);
    }

    /* Divider */
    .divider{
      display:flex; align-items:center; gap:12px;
      color:var(--muted); font-size:12px; font-weight:700;
      text-transform:uppercase; letter-spacing:.5px;
      margin:0 0 20px;
    }
    .divider::before,.divider::after{
      content:""; flex:1; height:1px; background:var(--line);
    }

    /* Form */
    .card{
      background:var(--card); border:1px solid var(--line);
      border-radius:var(--r); box-shadow:var(--shadow); padding:20px 18px;
    }
    label{ display:block; font-size:13px; font-weight:700; margin:14px 0 6px; color:var(--ink); }
    label:first-child{ margin-top:0; }
    input,textarea{
      width:100%; padding:12px 14px; border:1.5px solid var(--line);
      border-radius:11px; font-size:15px; font-family:inherit;
      background:var(--bg); color:var(--ink);
      transition:border-color .15s,box-shadow .15s;
    }
    input:focus,textarea:focus{
      outline:none; border-color:var(--brand);
      box-shadow:0 0 0 3px rgba(180,140,74,.10); background:#fff;
    }
    textarea{ resize:none; height:80px; }
    .btn-submit{
      width:100%; padding:15px; margin-top:18px;
      background:linear-gradient(180deg,var(--brand) 0%,#a97f37 100%);
      color:#fff; border:none; border-radius:14px;
      font-size:16px; font-weight:800; font-family:inherit; cursor:pointer;
      box-shadow:0 14px 28px rgba(180,140,74,.22);
    }
    .success-msg{
      margin-top:14px; padding:14px; border-radius:12px;
      background:#d4edda; color:#155724; font-weight:700;
      font-size:14px; text-align:center; display:none;
    }
    @keyframes fadeIn{
      from{opacity:0;transform:translateY(8px);}
      to{opacity:1;transform:translateY(0);}
    }
    .anim{ animation:fadeIn .35s ease; }
  </style>
</head>

<body>
  <header class="topbar">
    <button class="back-btn" aria-label="Retour" onclick="goBack()"></button>
    <span class="topbar-title">Réserver une table</span>
    <div style="width:38px"></div>
  </header>

  <div class="wrap anim">
    <h1>📅 Réserver une table</h1>
    <p class="sub" id="subText">Choisissez votre mode de réservation.</p>

    <div class="quick-actions" id="quickActions">
      <!-- rempli par JS -->
    </div>

    <div id="formSection" style="display:none">
      <div class="divider">ou formulaire rapide</div>
      <div class="card">
        <form id="resvForm" onsubmit="submitForm(event)">
          <label>Nom</label>
          <input type="text" id="fNom" placeholder="Votre nom" required />
          <label>Nombre de personnes</label>
          <input type="number" id="fNbr" min="1" max="20" placeholder="2" required />
          <label>Date</label>
          <input type="date" id="fDate" required />
          <label>Heure</label>
          <input type="time" id="fHeure" required />
          <label>Message (optionnel)</label>
          <textarea id="fMsg" placeholder="Allergies, occasion spéciale…"></textarea>
          <button type="submit" class="btn-submit">Envoyer la demande</button>
        </form>
        <div class="success-msg" id="successMsg">✅ Demande envoyée ! Le restaurant vous confirmera rapidement.</div>
      </div>
    </div>
  </div>

<script>
const RESTO = window.Fidelavis?.getRestoSlug?.() || "resto1";

function goBack(){
  if(window.history.length > 1) window.history.back();
  else window.Fidelavis?.go?.("index.html");
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

(async function init(){
  let cfg = null;
  try{ cfg = await window.Fidelavis?.loadConfig?.(); }catch(e){}

  const qa = document.getElementById("quickActions");
  const actions = [];

  if(cfg && cfg.reservationUrl){
    actions.push(`<button class="btn btnPrimary" onclick="resaOnline('${esc(cfg.reservationUrl)}')">🌐 Réserver en ligne</button>`);
  }

  if(cfg && cfg.phone){
    const tel = cfg.phone.replace(/\s/g,"");
    actions.push(`<button class="btn btnSecondary" onclick="resaTel('${esc(tel)}')">📞 Appeler le restaurant</button>`);
    const waMsg = encodeURIComponent("Bonjour, je souhaite réserver une table.");
    actions.push(`<button class="btn btnWa" onclick="resaWa('${esc(tel)}','${waMsg}')">💬 Réserver par WhatsApp</button>`);
  }

  if(actions.length){
    qa.innerHTML = actions.join('');
    // Afficher le formulaire en complément (pas de redirect)
    if(!cfg.reservationUrl){
      document.getElementById("formSection").style.display = "block";
    }
  } else {
    // Aucune config : afficher seulement le formulaire
    qa.innerHTML = '';
    document.getElementById("subText").textContent = "Remplissez ce formulaire, le restaurant vous contactera.";
    document.getElementById("formSection").style.display = "block";
    document.querySelector(".divider") && (document.querySelector(".divider").style.display = "none");
  }
})();

function resaOnline(url){
  window.Fidelavis?.track?.("reserve_click",{src:"reservation_page_online"});
  window.open(url,"_blank");
}
function resaTel(tel){
  window.Fidelavis?.track?.("call_click",{src:"reservation_page_tel"});
  window.location.href = "tel:" + tel;
}
function resaWa(tel,msg){
  window.Fidelavis?.track?.("reserve_click",{src:"reservation_page_wa"});
  window.open("https://wa.me/" + tel.replace(/^\+/,"") + "?text=" + msg,"_blank");
}

function submitForm(e){
  e.preventDefault();
  window.Fidelavis?.track?.("reserve_click",{src:"reservation_page_form"});
  document.getElementById("resvForm").style.display = "none";
  document.getElementById("successMsg").style.display = "block";
}
</script>
</body>
</html>
