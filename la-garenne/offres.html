<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8206A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fidelavis">
<link rel="manifest" id="mf" href="/la-garenne/manifest.json">
<script>
  /* Fichier d'installation propre au commerce, sur TOUTES les pages : on peut
     ajouter l'appli à l'écran d'accueil depuis n'importe laquelle (souvent
     depuis l'extrait vidéo, sans passer par installer.html). Son start_url
     app.html?first=<slug> rouvre l'appli sur la vidéo du bon commerce.
     Commerce connu par ?s= ou, à défaut, par celui qui a amené l'habitant. */
  (function(){
    var s = (new URLSearchParams(location.search).get('s') || '').toLowerCase().replace(/[^a-z0-9-]/g,'');
    if (!s) { try { var src = JSON.parse(localStorage.getItem('hl_source') || 'null'); s = (src && src.slug || '').replace(/[^a-z0-9-]/g,''); } catch(e) {} }
    if (s) document.getElementById('mf').href = '/la-garenne/manifests/' + s + '.json';
  })();
</script>
<link rel="apple-touch-icon" sizes="180x180" href="/la-garenne/icons/icon-180.png">
<script defer src="https://progressier.app/zb3Ezrlt6Ezd6iN3VpMW/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/la-garenne/hl.css">
<script src="/la-garenne/hl.js"></script>
<title>Offres – Les Commerces de La Garenne</title>
</head>
<body>
<div id="bar"></div>
<main class="ct">
  <h1 style="margin:6px 0 4px">Vos avantages</h1>
  <p class="muted small" style="margin-bottom:14px">Chaque offre s'utilise en caisse : le commerçant saisit son code sur votre téléphone.</p>
  <div class="clist" id="liste"></div>
</main>
<script>
(function(){
  document.getElementById('bar').innerHTML = HL.brandbar(false);
  HL.nav('offres');
  var mois = new Date().toISOString().slice(0,7);
  HL.charger().then(function(d){
    var l = d.commerces.filter(function(c){ return c.offre && HL.dureeOffre(c.offre); })
      .sort(function(a,b){ return (a.offre.fin || '9999').localeCompare(b.offre.fin || '9999'); });
    document.getElementById('liste').innerHTML = l.length ? l.map(function(c){
      var h = HL.offreHtml(c, 'offres');
      // Déjà utilisée ce mois-ci sur cet appareil : on l'atténue et on le dit.
      if (HL.ls('hl_offre_' + c.slug + '_' + mois)) h = h.replace('class="offre"', 'class="offre" style="opacity:.55"').replace('</p><span', ' · utilisée ce mois-ci</p><span');
      return h;
    }).join('') : '<p class="muted">Pas d\'offre en cours.</p>';
  });
})();
</script>
</body>
</html>
