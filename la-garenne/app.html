<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8206A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fidelavis">
<link rel="manifest" id="mf" href="/la-garenne/manifest.json">
<script>
  /* Fichier d'installation propre au commerce, sur TOUTES les pages : on peut
     ajouter l'appli à l'écran d'accueil depuis n'importe laquelle (souvent
     depuis l'extrait vidéo, sans passer par installer.html). Son start_url
     app.html?first=<slug> rouvre l'appli sur la vidéo du bon commerce.
     Commerce connu par ?s= ou, à défaut, par celui qui a amené l'habitant. */
  (function(){
    var s = (new URLSearchParams(location.search).get('s') || '').toLowerCase().replace(/[^a-z0-9-]/g,'');
    if (!s) { try { var src = JSON.parse(localStorage.getItem('hl_source') || 'null'); s = (src && src.slug || '').replace(/[^a-z0-9-]/g,''); } catch(e) {} }
    if (s) document.getElementById('mf').href = '/la-garenne/manifests/' + s + '.json';
  })();
</script>
<link rel="apple-touch-icon" sizes="180x180" href="/la-garenne/icons/icon-180.png">
<script defer src="https://progressier.app/zb3Ezrlt6Ezd6iN3VpMW/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/la-garenne/hl.css">
<script src="/la-garenne/hl.js"></script>
<title>Les Commerces de La Garenne</title>
<style>
  .hero{position:relative;margin:0 16px;border-radius:22px;overflow:hidden;background:#333 url('/assets/heros/banniere-3.jpg') center/cover;padding:26px 16px 16px;color:#fff;}
  .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.6));}
  .hero > *{position:relative;}
  .hero h1{font-size:25px;margin-bottom:16px;text-shadow:0 1px 8px rgba(0,0,0,.35);}
  .bienvenue{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:60px;background:rgba(251,246,241,.96);}
  .bienvenue .card{display:flex;gap:12px;align-items:center;max-width:360px;margin:0 16px;}
  .bienvenue .ck{width:36px;height:36px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;}
  .notif{display:flex;gap:12px;align-items:center;margin-top:22px;}
  .notif .ic{width:44px;height:44px;border-radius:14px;background:var(--rose-soft);color:var(--rose);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .notif .chip{background:var(--rose);color:#fff;border-color:var(--rose);white-space:nowrap;}
</style>
</head>
<body>
<div id="bar"></div>

<section class="hero">
  <h1>Les bonnes adresses de La Garenne-Colombes</h1>
  <form class="search" action="/la-garenne/commerces.html">
    <span id="icnRecherche"></span>
    <input type="search" name="q" placeholder="Rechercher un commerce…" aria-label="Rechercher un commerce">
  </form>
</section>

<!-- Accueil = ce qui est nouveau cette semaine. L'annuaire complet vit dans l'onglet Commerces. -->
<main class="ct">
  <nav class="cats" id="cats" aria-label="Catégories" style="margin-top:18px"></nav>

  <div class="semaine" id="semaine"></div>

  <div class="sec-title"><h2>Offres de la semaine</h2><a href="/la-garenne/offres.html">Toutes</a></div>
  <div class="clist" id="offres"></div>

  <!-- Encart sponsorisé : un seul, juste après les offres (jamais avant) pour
       une vraie visibilité du commerçant qui paie. -->
  <div id="pub" style="margin-top:22px"></div>

  <div class="sec-title"><h2>À la une cette semaine</h2><a href="/la-garenne/decouvrir.html">Tout voir</a></div>
  <div class="rail" id="rail"></div>

  <div id="notif" class="card notif hide">
    <span class="ic" id="icnAlerte"></span>
    <div style="flex:1"><b>Ne ratez pas les bons plans de La Garenne</b>
      <p class="small muted">Nouvelles adresses, vidéos et offres de la semaine. Une notification maximum par semaine.</p></div>
  </div>
  <button class="btn hide" id="btnNotif" type="button" style="margin-top:10px"><span>Activer les alertes</span><span class="arr">›</span></button>

</main>

<script>
/* Étapes 6, 7 et 9.
   Premier lancement de l'appli installée : le manifeste du commerce ouvre
   app.html?first=<slug>. On confirme l'installation, on enregistre
   l'attribution dans la mémoire propre à l'appli, puis on ouvre la vidéo
   complète. Les lancements suivants arrivent ici, sur l'accueil. */
(function(){
  var first = HL.qs('first').toLowerCase().replace(/[^a-z0-9-]/g,'');
  if (!first && HL.isStandalone()) first = HL.ls('hl_pending') || '';   // Android : mémoire partagée
  if (!first && HL.isStandalone()) { var src0 = HL.getSource(); if (src0) first = src0.slug; }   // cookie éventuellement recopié par iOS
  if (first && HL.isStandalone() && !HL.ls('hl_first_done')) {
    HL.ls('hl_first_done', String(Date.now()));
    HL.ls('hl_pending', null);
    var src = HL.getSource();
    HL.setSource(first, 'install');
    HL.track('installation_confirmee', first, (src && src.canal) || 'inconnu');
    document.body.insertAdjacentHTML('beforeend',
      '<div class="bienvenue"><div class="card"><span class="ck">✓</span>' +
      '<div><b>Les Commerces de La Garenne</b><p class="small muted">est installé sur votre appareil</p></div></div></div>');
    setTimeout(function(){ location.replace(HL.BASE + 'video.html?s=' + encodeURIComponent(first) + '&bienvenue=1'); }, 1400);
    return;
  }

  document.getElementById('bar').innerHTML = HL.brandbar(false);
  HL.nav('accueil');
  HL.track('accueil_vue', null, HL.isStandalone() ? 'appli' : 'web');

  document.getElementById('icnRecherche').innerHTML = HL.icone('recherche', 20);
  document.getElementById('icnAlerte').innerHTML = HL.icone('alerte', 24);

  /* Alertes : dans l'appli installée, on demande l'autorisation sur appui ;
     dans le navigateur, les alertes passent par l'installation. */
  var notif = document.getElementById('notif'), btnNotif = document.getElementById('btnNotif');
  var peutDemander = HL.isStandalone() && 'Notification' in window && Notification.permission === 'default';
  if (peutDemander || !HL.isStandalone()) { notif.classList.remove('hide'); btnNotif.classList.remove('hide'); }
  btnNotif.setAttribute('data-hl', 'alertes_bouton'); btnNotif.setAttribute('data-src', HL.isStandalone() ? 'appli' : 'web');
  btnNotif.addEventListener('click', function(){
    if (HL.isStandalone()) { HL.notifs(null); notif.classList.add('hide'); btnNotif.classList.add('hide'); return; }
    var src = HL.getSource();
    location.href = HL.BASE + 'installer.html' + (src ? '?s=' + encodeURIComponent(src.slug) : '');
  });

  HL.charger().then(function(d){
    // Catégories : toutes, dans l'ordre fixé, « Bientôt » quand elles sont vides
    var nb = {};
    d.commerces.forEach(function(c){ nb[c.categorie] = (nb[c.categorie] || 0) + 1; });
    var cats = '<a class="cat" href="' + HL.BASE + 'commerces.html"><span class="ic">' + HL.icone('tout', 26) + '</span>Tout</a>';
    Object.keys(HL.CATEGORIES).forEach(function(k){
      var m = HL.CATEGORIES[k];
      cats += nb[k]
        ? '<a class="cat" href="' + HL.BASE + 'commerces.html?cat=' + k + '"><span class="ic">' + HL.icone(m.ic, 26) + '</span>' + HL.esc(m.label) + '</a>'
        : '<button class="cat bientot" type="button" data-bientot="' + HL.esc(m.label) + '"><span class="ic">' + HL.icone(m.ic, 26) + '</span>' + HL.esc(m.label) + '<span class="bt">Bientôt</span></button>';
    });
    var catsEl = document.getElementById('cats');
    catsEl.innerHTML = cats;
    catsEl.addEventListener('click', function(e){
      var b = e.target.closest('[data-bientot]'); if (!b) return;
      HL.track('categorie_bientot', null, b.getAttribute('data-bientot'));
      HL.toast(b.getAttribute('data-bientot') + ' : bientôt à La Garenne');
    });

    // À la une : vidéos des commerçants, les plus récentes d'abord.
    // Une vidéo sponsorisée peut s'y glisser, jamais en première position.
    var videos = [];
    d.commerces.forEach(function(c){ videos = videos.concat(c.videos); });
    videos.sort(function(a,b){ return (b.debut||'').localeCompare(a.debut||''); });
    var pubV = d.pubs.filter(function(p){ return p.format === 'video'; })[0];
    var html = videos.filter(function(v){ return !pubV || v.id !== pubV.video.id; }).map(function(v){ return HL.vcardHtml(v, 'accueil'); });
    if (pubV && html.length >= 1) html.splice(Math.min(2, html.length), 0, HL.vcardHtml(pubV.video, 'accueil', pubV));
    document.getElementById('rail').innerHTML = html.join('');
    if (pubV) { var el = document.getElementById('pub-' + pubV.id); if (el) HL.impression(el, pubV, 'accueil'); }

    // Offres actives, celles qui finissent le plus tôt d'abord
    var offres = d.commerces.filter(function(c){ return c.offre && HL.dureeOffre(c.offre); })
      .sort(function(a,b){ return (a.offre.fin || '9999').localeCompare(b.offre.fin || '9999'); });
    document.getElementById('offres').innerHTML = offres.slice(0,3).map(function(c){ return HL.offreHtml(c, 'accueil'); }).join('');

    // Cette semaine à La Garenne : ce qui est nouveau depuis 7 jours
    var nouvelles = videos.filter(function(v){ return HL.recent(v); }).length;
    function pl(n, un, plusieurs){ return n + ' ' + (n > 1 ? plusieurs : un); }
    document.getElementById('semaine').innerHTML =
      '<span class="ic">' + HL.icone('semaine', 22) + '</span><div><b>Cette semaine à La Garenne</b><p>' +
      (nouvelles ? pl(nouvelles, 'nouvelle vidéo', 'nouvelles vidéos') : pl(videos.length, 'vidéo à découvrir', 'vidéos à découvrir')) +
      ' · ' + pl(offres.length, 'offre', 'offres') + '</p></div>';

    // Encart sponsorisé : un seul à la fois
    var pubF = d.pubs.filter(function(p){ return p.format === 'fixe' && p.emplacement === 'accueil'; })[0];
    if (pubF) {
      document.getElementById('pub').innerHTML = HL.pubFixeHtml(pubF, 'accueil');
      HL.impression(document.getElementById('pub-' + pubF.id), pubF, 'accueil');
    }
  });
})();
</script>
</body>
</html>
