<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Espace association – Les Commerces de La Garenne</title>
<link rel="stylesheet" href="/la-garenne/polices/polices.css">
<link rel="stylesheet" href="/la-garenne/hl.css">
<script src="/la-garenne/hl.js"></script>
<style>
  body{max-width:1040px;padding-bottom:40px;}
  [hidden]{display:none!important;}   /* sinon label.f{display:block} l'emporte sur hidden */
  .tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:6px 0 18px;}
  .tabs .chip .nb{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--rose);color:#fff;font-size:11px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .tile{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);}
  .tile .lb{font-size:12.5px;color:var(--muted);font-weight:700;}
  .tile .v{font:900 28px/1.15 'Lato',sans-serif;margin-top:4px;}
  .tile .ex{font-size:12px;color:var(--muted);}
  .tw{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:12px;color:var(--muted);white-space:nowrap;}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;}
  tr.clic{cursor:pointer;} tr.clic:hover td{background:#FFF9F4;}
  .st{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#EEF0F6;color:#4A5070;white-space:nowrap;}
  .st.valide,.st.publiee,.st.programmee{background:var(--ok-soft);color:var(--ok);}
  .st.en_attente,.st.a_moderer,.st.demande{background:var(--sponso-soft);color:var(--sponso);}
  .st.refuse,.st.refusee,.st.suspendu,.st.annulee{background:#FDECEC;color:#B23B3B;}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .form .large{grid-column:1/-1;}
  label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink);}
  label.f span{display:block;margin-bottom:5px;}
  label.f input,label.f select,label.f textarea{width:100%;min-height:42px;border-radius:10px;border:1.5px solid var(--line);padding:8px 12px;font:inherit;font-size:14.5px;background:#fff;color:var(--ink);}
  label.f textarea{min-height:70px;resize:vertical;}
  label.f input:focus,label.f select:focus,label.f textarea:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-soft);}
  label.ck{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:700;}
  .bloc{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
  .bloc h3{margin-bottom:12px;}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0;}
  .bar .btn{width:auto;min-height:44px;font-size:15px;}
  .b2{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;color:var(--ink);}
  .b2.ok{background:var(--ok);color:#fff;border-color:var(--ok);}
  .b2.ko{color:#B23B3B;border-color:#F0C4C4;}
  .msg{font-size:13.5px;font-weight:700;}
  .msg.ok{color:var(--ok);} .msg.ko{color:#B23B3B;}
  .alerte{background:var(--sponso-soft);color:var(--sponso);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
  .check{list-style:none;padding:0;margin:8px 0 12px;font-size:13.5px;}
  .check li{padding:3px 0;}
  .file{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);}
  .file:last-child{border-bottom:0;}
  .lot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .file .sel{width:22px;height:22px;margin-top:30px;flex-shrink:0;accent-color:var(--ok);}
  .file .ph{width:84px;height:84px;border-radius:12px;background:#eee center/cover;flex-shrink:0;}
  .vide{color:var(--muted);font-size:14px;padding:12px 0;}
  #login{max-width:420px;margin:30px auto;}
</style>
</head>
<body class="sans-nav">
<div id="bar"></div>
<main class="ct">
  <div id="login" class="hide">
    <h1 style="margin-bottom:6px">Espace association</h1>
    <p class="muted" style="margin-bottom:16px">Compte association ou superadmin. Validation des commerces, modération, publicités et résultats du réseau.</p>
    <form class="bloc" id="f" novalidate>
      <label class="f"><span>Identifiant</span><input id="user" autocomplete="username"></label>
      <label class="f" style="margin-top:12px"><span>Mot de passe</span><input id="pass" type="password" autocomplete="current-password"></label>
      <button class="btn" type="submit" style="margin-top:16px"><span>Se connecter</span><span class="arr">›</span></button>
      <p class="msg ko" id="err" role="alert" style="margin-top:10px"></p>
    </form>
    <p class="small" style="text-align:center;margin:26px 0 8px"><a href="/la-garenne/confidentialite.html" style="color:var(--muted)">Confidentialité et mesure d'audience</a></p>
  </div>

  <div id="app" class="hide">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap">
      <div><h1>Espace association</h1><p class="small muted" id="qui"></p></div>
      <button class="lien" id="sortir" type="button" style="width:auto;padding:6px 0">Se déconnecter</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Rubriques"></nav>
    <section id="vue"></section>
  </div>
</main>

<script>
(function(){
  var SUPA_URL = 'https://rtdiaeskmyjjwohirhzj.supabase.co';
  var SUPA_KEY = 'sb_publishable_V9jcAKPdqxhupYWxoejARQ_D_AmOpcZ';
  var CLE = 'fv_session_la-garenne';
  var esc = HL.esc, fmt = new Intl.NumberFormat('fr-FR');
  var D = null, STATS = null, onglet = HL.qs('o') || 'reseau', jours = 30;
  document.getElementById('bar').innerHTML = HL.brandbar(false);

  function rpc(nom, corps){
    return fetch(SUPA_URL + '/rest/v1/rpc/' + nom, {
      method: 'POST',
      headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(corps || {})
    }).then(function(r){ if (!r.ok) throw new Error('Service indisponible (' + r.status + ')'); return r.json(); });
  }
  function jeton(){ return HL.ls(CLE) || ''; }
  function connexion(msg){
    document.getElementById('app').classList.add('hide');
    document.getElementById('login').classList.remove('hide');
    if (msg) document.getElementById('err').textContent = msg;
  }

  /* ── Connexion : fv_admin_login, compte superadmin ou association ── */
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var u = document.getElementById('user').value.trim(), p = document.getElementById('pass').value, err = document.getElementById('err');
    if (!u || !p) { err.textContent = 'Renseignez votre identifiant et votre mot de passe.'; return; }
    err.textContent = '';
    // Comptes « association » d'abord (fv_private.hl_comptes), puis les
    // admins Fidelavis : seul le superadmin y a accès à cet espace.
    rpc('hl_asso_login', { p_username: u, p_password: p }).then(function(j){
      if (j && j.ok && j.token) return j;
      if (j && j.reason === 'compte non rattaché à une association') throw { msg: 'Ce compte n\'est rattaché à aucune association : demandez à la ville de le rattacher.' };
      return rpc('fv_admin_login', { p_slug: 'la-garenne', p_username: u, p_password: p });
    }).then(function(j){
      if (!j || !j.ok || !j.token) { err.textContent = 'Identifiant ou mot de passe incorrect.'; return; }
      if (j.role !== 'superadmin' && j.role !== 'association') { err.textContent = 'Ce compte n\'a pas accès à l\'espace association.'; return; }
      HL.ls(CLE, j.token);
      demarrer();
    }).catch(function(e){ err.textContent = (e && e.msg) || 'Connexion impossible pour le moment.'; });
  });
  document.getElementById('sortir').addEventListener('click', function(){ HL.ls(CLE, null); connexion(''); });

  function charger(){
    return Promise.all([rpc('hl_admin_data', { p_token: jeton() }), rpc('hl_admin_stats', { p_token: jeton(), p_days: jours })]).then(function(r){
      if (!r[0].ok || !r[1].ok) throw { session: true };
      D = r[0]; STATS = r[1];
    });
  }
  function demarrer(){
    if (!jeton()) { connexion(''); return; }
    charger().then(function(){
      document.getElementById('login').classList.add('hide');
      document.getElementById('app').classList.remove('hide');
      rendre();
    }).catch(function(e){
      if (e && e.session) { HL.ls(CLE, null); connexion('Session expirée : reconnectez-vous.'); }
      else connexion('Service indisponible pour le moment.');
    });
  }

  /* ── Aides ── */
  var STATUTS_C = { en_attente: 'En attente', valide: 'Validé', refuse: 'Refusé', suspendu: 'Suspendu' };
  var STATUTS_M = { brouillon: 'Brouillon', a_moderer: 'À modérer', publiee: 'Publiée', refusee: 'Refusée' };
  var STATUTS_P = { demande: 'Demande', programmee: 'Programmée', terminee: 'Terminée', annulee: 'Annulée' };
  var CTAS = { offre: 'Voir l\'offre', itineraire: 'Itinéraire', reserver: 'Réserver', contacter: 'Contacter' };
  function st(k, lib){ return '<span class="st ' + esc(k) + '">' + esc((lib || {})[k] || k || '—') + '</span>'; }
  function n(x){ return fmt.format(x || 0); }
  function dateFr(d){ return d ? new Date(d + 'T12:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'; }
  function aujourdhui(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function ville(){ return D.role === 'superadmin'; }
  function nomAsso(s){ var a = (D.associations || []).filter(function(x){ return x.slug === s; })[0]; return a ? a.nom : (s || ''); }
  function commerce(slug){ return D.commerces.filter(function(c){ return c.slug === slug; })[0]; }
  function nom(slug){ var c = commerce(slug); return c ? (c.doc.nom || slug) : slug; }
  function opts(map, v){ return Object.keys(map).map(function(k){ return '<option value="' + esc(k) + '"' + (k === v ? ' selected' : '') + '>' + esc(map[k]) + '</option>'; }).join(''); }
  function champ(lab, k, v, type, extra){
    if (type === 'textarea') return '<label class="f ' + (extra || '') + '"><span>' + lab + '</span><textarea data-k="' + k + '">' + esc(v == null ? '' : v) + '</textarea></label>';
    if (type && type.select) return '<label class="f ' + (extra || '') + '"><span>' + lab + '</span><select data-k="' + k + '">' + opts(type.select, v) + '</select></label>';
    if (type === 'checkbox') return '<label class="ck ' + (extra || '') + '"><input type="checkbox" data-k="' + k + '"' + (v ? ' checked' : '') + '> ' + lab + '</label>';
    return '<label class="f ' + (extra || '') + '"><span>' + lab + '</span><input type="' + (type || 'text') + '" data-k="' + k + '" value="' + esc(v == null ? '' : v) + '"></label>';
  }
  // Relit un formulaire en objet : data-k="offre.titre", "videos.0.titre"…
  function lire(racine){
    var o = {};
    Array.prototype.forEach.call(racine.querySelectorAll('[data-k]'), function(el){
      var v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value.trim();
      var parts = el.getAttribute('data-k').split('.'), cur = o;
      parts.forEach(function(p, i){
        var cle = /^\d+$/.test(p) ? +p : p;
        if (i === parts.length - 1) cur[cle] = v;
        else { if (cur[cle] == null) cur[cle] = /^\d+$/.test(parts[i+1]) ? [] : {}; cur = cur[cle]; }
      });
    });
    return o;
  }

  /* ── File de modération : commerces en attente, offres et vidéos à modérer ── */
  function aModerer(){
    var l = [];
    D.commerces.forEach(function(c){
      if (c.statut === 'en_attente') l.push({ type: 'commerce', c: c });
      if (c.doc.offre && c.doc.offre.statut === 'a_moderer') l.push({ type: 'offre', c: c });
      (c.doc.videos || []).forEach(function(v, i){ if (v.statut === 'a_moderer') l.push({ type: 'video', c: c, v: v, i: i }); });
      var pr = c.doc.propositions || {};
      if (pr.offre && pr.offre.statut === 'a_moderer') l.push({ type: 'prop_offre', c: c });
      (pr.videos || []).forEach(function(v){ if (v.statut === 'a_moderer') l.push({ type: 'prop_video', c: c, v: v }); });
    });
    if (ville()) D.pubs.forEach(function(p){ if (p.statut === 'demande') l.push({ type: 'pub', p: p }); });
    return l;
  }

  function rendre(){
    var nb = aModerer().length;
    document.getElementById('qui').textContent = ville() ? 'Niveau ville · toutes les associations' : nomAsso(D.association) + ' · vos adhérents';
    var T = ville()
      ? [['reseau','Réseau'],['valider','À valider'],['commerces','Commerces'],['pubs','Publicités'],['cdc','Coup de cœur'],['anna','Vidéo Anna'],['associations','Associations'],['comptes','Comptes']]
      : [['reseau','Vos résultats'],['valider','À valider'],['commerces','Vos adhérents'],['pubs','Mises en avant'],['comptes','Comptes']];
    if (!T.some(function(t){ return t[0] === onglet; })) onglet = 'reseau';
    document.getElementById('tabs').innerHTML = T.map(function(t){
      return '<button class="chip' + (t[0] === onglet ? ' on' : '') + '" data-o="' + t[0] + '">' + t[1] + (t[0] === 'valider' && nb ? '<span class="nb">' + nb + '</span>' : '') + '</button>';
    }).join('');
    ({ reseau: vueReseau, valider: vueValider, commerces: vueCommerces, pubs: vuePubs, cdc: vueCdc, anna: vueAnna, associations: vueAssociations, comptes: vueComptes })[onglet]();
  }
  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-o]'); if (!b) return;
    onglet = b.getAttribute('data-o'); history.replaceState(null, '', '?o=' + onglet); rendre();
  });
  var vue = document.getElementById('vue');

  /* ── Réseau : résultats de tout le pilote, chaque indicateur à part ── */
  var filtreAsso = '';
  function vueReseau(){
    var coms = D.commerces.filter(function(c){ return !filtreAsso || (filtreAsso === '-' ? !c.association : c.association === filtreAsso); });
    var dans = {}; coms.forEach(function(c){ dans[c.slug] = 1; });
    var tot = { scans: 0, installations: 0, vues: 0, clics: 0, utilisations: 0, pub_affichages: 0, pub_clics: 0 };
    STATS.commerces.forEach(function(c){ if (dans[c.slug]) Object.keys(tot).forEach(function(k){ tot[k] += c[k] || 0; }); });
    var actifs = coms.filter(function(c){ return c.statut === 'valide'; }).length;
    var parSlug = {}; STATS.commerces.forEach(function(c){ parSlug[c.slug] = c; });
    vue.innerHTML =
      '<div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:12px"><h2>' + (ville() ? 'Résultats du réseau' : 'Résultats de vos adhérents') + '</h2><div class="chips" id="per">' +
      [7,30,90].map(function(j){ return '<button class="chip' + (j === jours ? ' on' : '') + '" data-j="' + j + '">' + j + ' jours</button>'; }).join('') + '</div></div>' +
      (ville() && (D.associations || []).length ? '<div class="chips" id="fa" style="margin-bottom:12px"><button class="chip' + (!filtreAsso ? ' on' : '') + '" data-a="">Toutes</button>' +
        D.associations.map(function(a){ return '<button class="chip' + (a.slug === filtreAsso ? ' on' : '') + '" data-a="' + esc(a.slug) + '">' + esc(a.nom) + '</button>'; }).join('') +
        '<button class="chip' + (filtreAsso === '-' ? ' on' : '') + '" data-a="-">Sans association</button></div>' : '') +
      '<div class="grid">' +
        (filtreAsso ? '' : tile('Habitants actifs', STATS.habitants, ville() ? 'appareils ayant utilisé l\'appli' : 'ayant vu l\'un de vos adhérents')) +
        tile('Commerces actifs', actifs, 'validés et visibles') +
        tile('Scans QR / NFC', tot.scans, 'dans tous les commerces') +
        tile('Installations', tot.installations, 'attribuées au commerce scanné') +
        tile('Vues vidéo', tot.vues, '≥ 3 s regardées') +
        tile('Clics', tot.clics, 'sur les boutons d\'action') +
        tile('Utilisations en caisse', tot.utilisations, 'offres validées au code') +
        tile('Pubs : affichages / clics', tot.pub_affichages, n(tot.pub_clics) + ' clics') +
      '</div>' +
      // Indicateurs du plan du pilote (ensemble du périmètre, sans filtre par association).
      (filtreAsso ? '' : '<div class="grid" style="margin-top:10px">' +
        tile('Habitants revenus', STATS.habitants_revenus, (STATS.habitants ? Math.round(100 * STATS.habitants_revenus / STATS.habitants) : 0) + ' % actifs au moins 2 semaines différentes') +
        '<div class="tile"><p class="lb">Délai de validation</p><p class="v">' + (STATS.delai_validation_h == null ? '—' : String(STATS.delai_validation_h).replace('.', ',') + ' h') + '</p><p class="ex">médiane, ' + n(STATS.propositions_traitees) + ' proposition(s) traitée(s) · objectif 48 h</p></div>' +
        (ville() ? tile('Alerte du lundi', STATS.alertes_ouvertes, 'ouvertures de l\'appli depuis ' + n(STATS.alertes_envoyees) + ' alerte(s) envoyée(s)') : '') +
      '</div>') +
      '<p class="small muted" style="margin:10px 0 18px">Aucun taux n\'est calculé entre ces chiffres : ce ne sont pas les mêmes personnes d\'une étape à l\'autre. Une vue n\'est pas une vente.</p>' +
      '<div class="tw"><table><thead><tr><th>Commerce</th>' + (ville() ? '<th>Association</th>' : '') + '<th>Statut</th><th class="n">Scans</th><th class="n">Install.</th><th class="n">Vues</th><th class="n">Clics</th><th class="n">Offres vues</th><th class="n">Utilisations</th><th></th></tr></thead><tbody>' +
      coms.map(function(c){
        var s = parSlug[c.slug] || {};
        return '<tr><td><b>' + esc(c.doc.nom || c.slug) + '</b></td>' + (ville() ? '<td class="small">' + esc(nomAsso(c.association) || '—') + '</td>' : '') + '<td>' + st(c.statut, STATUTS_C) + '</td>' +
          ['scans','installations','vues','clics','offres_vues','utilisations'].map(function(k){ return '<td class="n">' + n(s[k]) + '</td>'; }).join('') +
          '<td><a href="' + HL.BASE + 'pro/tableau.html?s=' + encodeURIComponent(c.slug) + '" target="_blank" rel="noopener" class="small">Détail ›</a></td></tr>';
      }).join('') + '</tbody></table></div>';
    document.getElementById('per').addEventListener('click', function(e){
      var b = e.target.closest('[data-j]'); if (!b) return; jours = +b.getAttribute('data-j');
      rpc('hl_admin_stats', { p_token: jeton(), p_days: jours }).then(function(j){ if (j.ok) { STATS = j; rendre(); } });
    });
    var fa = document.getElementById('fa');
    if (fa) fa.addEventListener('click', function(e){ var b = e.target.closest('[data-a]'); if (!b) return; filtreAsso = b.getAttribute('data-a'); vueReseau(); });
  }
  function tile(lb, v, ex){ return '<div class="tile"><p class="lb">' + lb + '</p><p class="v">' + n(v) + '</p><p class="ex">' + ex + '</p></div>'; }

  /* ── À valider : contrôles avant diffusion ── */
  var filtreCat = '';
  function vueValider(){
    var l = aModerer();
    // Nouveaux commerces : cases à cocher, filtre par catégorie et validation groupée.
    var coms = l.filter(function(it){ return it.type === 'commerce'; });
    var cats = {}; coms.forEach(function(it){ var k = it.c.doc.categorie || ''; cats[k] = (cats[k] || 0) + 1; });
    if (filtreCat && !cats[filtreCat]) filtreCat = '';
    var lot = coms.length > 1 ? '<div class="lot" id="lot">' +
        '<button class="chip' + (!filtreCat ? ' on' : '') + '" data-c="">Tous (' + coms.length + ')</button>' +
        Object.keys(cats).map(function(k){ return '<button class="chip' + (k === filtreCat ? ' on' : '') + '" data-c="' + esc(k) + '">' + esc((HL.CATEGORIES[k] || {}).label || k || 'Sans catégorie') + ' (' + cats[k] + ')</button>'; }).join('') +
      '</div><div class="lot"><button class="b2" id="toutCocher" type="button">Tout cocher</button><button class="b2" id="rienCocher" type="button">Tout décocher</button>' +
        '<button class="b2 ok" id="validerSel" type="button" disabled>Valider la sélection (0)</button><span class="small muted" id="selInfo">Les commerces sans adresse ne peuvent pas être cochés.</span></div>' : '';
    vue.innerHTML = '<h2 style="margin-bottom:12px">À valider</h2>' + lot + '<div class="bloc" id="file">' +
      (l.length ? l.map(itemHtml).join('') : '<p class="vide">Rien à valider pour le moment.</p>') + '</div>';
    l.forEach(function(it, k){ if (it.type === 'video' || (it.type === 'prop_video' && !it.v.poids)) controlerVideo(it.v, 'chk-' + k); });
    var file = document.getElementById('file');
    function visibles(){ return Array.prototype.filter.call(file.querySelectorAll('.sel:not(:disabled)'), function(c){ return c.closest('.file').style.display !== 'none'; }); }
    function majSel(){
      var b = document.getElementById('validerSel'); if (!b) return;
      var n = file.querySelectorAll('.sel:checked').length;
      b.disabled = !n; b.textContent = 'Valider la sélection (' + n + ')';
    }
    function filtrer(){
      Array.prototype.forEach.call(file.querySelectorAll('.file'), function(el){
        var c = el.getAttribute('data-cat');
        el.style.display = !filtreCat || c === filtreCat ? '' : 'none';
        if (filtreCat && c !== filtreCat) { var x = el.querySelector('.sel'); if (x) x.checked = false; }
      });
      majSel();
    }
    if (coms.length > 1) {
      filtrer();

  // Poids du fichier : lu dans l'en-tête HTTP quand le serveur le donne.
  function controlerVideo(v, id){
    var li = function(){ var ul = document.getElementById(id); return ul && ul.querySelector('[data-poids]'); };
    if (!v.src) { if (li()) li().textContent = '⚠️ Aucun fichier vidéo'; return; }
    fetch(v.src, { method: 'HEAD' }).then(function(r){
      var o = +r.headers.get('content-length'); var el = li(); if (!el) return;
      if (!r.ok) el.textContent = '⚠️ Fichier introuvable (' + r.status + ')';
      else if (!o) el.textContent = '💡 Poids inconnu (lien externe) : vérifier à la main';
      else el.textContent = (o <= 20e6 ? '✅' : '⚠️') + ' Poids : ' + (o / 1e6).toFixed(1).replace('.', ',') + ' Mo (20 Mo maximum)';
    }).catch(function(){ var el = li(); if (el) el.textContent = '💡 Poids non vérifiable (lien externe)'; });
  }
  function decider(it, act, bouton){
    var motif = '';
    if (act === 'ko') { motif = prompt('Motif du refus (visible par le commerçant) :') || ''; if (!motif) return; }
    bouton.disabled = true;
    var p;
    if (it.type === 'prop_offre' || it.type === 'prop_video') {
      p = rpc('hl_admin_moderer', { p_token: jeton(), p_slug: it.c.slug, p_type: it.type === 'prop_offre' ? 'offre' : 'video',
        p_id: it.v ? it.v.id : null, p_decision: act === 'ok' ? 'publier' : 'refuser', p_motif: motif || null });
    } else if (it.type === 'pub') {
      var pub = JSON.parse(JSON.stringify(it.p)); pub.statut = act === 'ok' ? 'programmee' : 'annulee';
      if (motif) pub.doc.motif_refus = motif;
      p = rpc('hl_admin_save_pub', { p_token: jeton(), p_pub: pub });
    } else {
      var c = it.c, doc = JSON.parse(JSON.stringify(c.doc)), statut = c.statut;
      if (it.type === 'commerce') { statut = act === 'ok' ? 'valide' : 'refuse'; if (motif) doc.motif_refus = motif; }
      if (it.type === 'offre') { doc.offre.statut = act === 'ok' ? 'publiee' : 'refusee'; if (motif) doc.offre.motif_refus = motif; }
      if (it.type === 'video') { doc.videos[it.i].statut = act === 'ok' ? 'publiee' : 'refusee'; if (motif) doc.videos[it.i].motif_refus = motif; }
      p = rpc('hl_admin_save_commerce', { p_token: jeton(), p_slug: c.slug, p_statut: statut, p_doc: doc, p_association: c.association || null });
    }
    p.then(function(j){
      if (!j.ok) throw new Error(j.reason || 'refusé');
      HL.toast(act === 'ok' ? 'Validé et publié' : 'Refusé');
      return charger().then(rendre);
    }).catch(function(e){ bouton.disabled = false; alert('Enregistrement impossible : ' + e.message); });
  }

      videos.push({ id: s + '-' + Date.now().toString(36), statut: 'a_moderer', type: 'portrait', cta: 'offre' });
      document.getElementById('videos').innerHTML = videos.map(videoHtml).join('');
    });
    document.getElementById('videos').addEventListener('click', function(e){
      var b = e.target.closest('[data-suppr]'); if (!b) return;
      if (!confirm('Retirer cette vidéo de la fiche ?')) return;
      videos = relireVideos(); videos.splice(+b.getAttribute('data-suppr'), 1);
      document.getElementById('videos').innerHTML = videos.map(videoHtml).join('');
    });
    if (!neuf) verifierManifeste(c.slug);

    // Retirer : masqué de l'appli et détaché de son association.
    var bRet = document.getElementById('retirer');
    if (bRet) bRet.addEventListener('click', function(){
      if (!confirm('Retirer « ' + d.nom + ' » de ' + nomAsso(c.association) + ' ?\n\nIl disparaîtra aussitôt de l\'appli des habitants.')) return;
      bRet.disabled = true;
      rpc('hl_admin_retirer_commerce', { p_token: jeton(), p_slug: c.slug }).then(function(j){
        if (!j.ok) throw new Error(j.reason || 'refusé');
        return charger().then(function(){ HL.toast('« ' + d.nom + ' » retiré de l\'association'); vueCommerces(); });
      }).catch(function(e){ bRet.disabled = false; document.getElementById('msgSuppr').textContent = 'Impossible : ' + e.message; });
    });
    // Supprimer : ville uniquement, confirmation en tapant l'identifiant.
    var bSup = document.getElementById('supprimer');
    if (bSup) bSup.addEventListener('click', function(){
      var tape = prompt('Suppression définitive de « ' + d.nom + ' » : fiche, offre, vidéos et publicités.\nCette action est irréversible.\n\nPour confirmer, tapez son identifiant : ' + c.slug);
      if (tape === null) return;
      if (tape.trim() !== c.slug) { document.getElementById('msgSuppr').textContent = 'Identifiant différent : rien n\'a été supprimé.'; return; }
      bSup.disabled = true;
      rpc('hl_admin_supprimer_commerce', { p_token: jeton(), p_slug: c.slug }).then(function(j){
        if (!j.ok) throw new Error(j.reason || 'refusé');
        return charger().then(function(){ HL.toast('« ' + d.nom + ' » supprimé définitivement'); vueCommerces(); });
      }).catch(function(e){ bSup.disabled = false; document.getElementById('msgSuppr').textContent = 'Impossible : ' + e.message; });
    });

    document.getElementById('enreg').addEventListener('click', function(){
      var msg = document.getElementById('msg'), slug = neuf ? document.getElementById('slug').value.trim().toLowerCase() : c.slug;
      if (!/^[a-z0-9-]{2,60}$/.test(slug)) { msg.className = 'msg ko'; msg.textContent = 'Identifiant : lettres minuscules, chiffres et tirets.'; return; }
      if (neuf && commerce(slug)) { msg.className = 'msg ko'; msg.textContent = 'Cet identifiant existe déjà.'; return; }
      var lu = lire(document.getElementById('ed'));
      var doc = Object.assign({}, d, lu);
      doc.videos = (lu.videos || []).filter(Boolean);
      doc.offre = document.getElementById('aOffre').checked ? lu.offre : null;
      if (doc.avis && !doc.avis.note) delete doc.avis;
      if (!doc.nom) { msg.className = 'msg ko'; msg.textContent = 'Le nom est obligatoire.'; return; }
      var ids = doc.videos.map(function(v){ return v.id; });
      if (ids.some(function(x, i){ return !x || ids.indexOf(x) !== i; })) { msg.className = 'msg ko'; msg.textContent = 'Chaque vidéo doit avoir un identifiant unique.'; return; }
      msg.className = 'msg'; msg.textContent = 'Enregistrement…';
      rpc('hl_admin_save_commerce', { p_token: jeton(), p_slug: slug, p_statut: document.getElementById('statut').value, p_doc: doc,
        p_association: ville() ? document.getElementById('asso').value : null }).then(function(j){
        if (!j.ok) throw new Error(j.reason || 'refusé');
        return charger().then(function(){ msg.className = 'msg ok'; msg.textContent = 'Enregistré. Visible dans l\'appli au prochain chargement.'; if (neuf) editerCommerce(commerce(slug)); });
      }).catch(function(e){ msg.className = 'msg ko'; msg.textContent = 'Enregistrement impossible : ' + e.message; });
    });
  }
  // Sans son fichier d'installation, l'appli installée depuis ce commerce
  // s'ouvrirait sur l'accueil au lieu de sa vidéo. Il est créé toutes les
  // 2 heures par .github/workflows/hl-manifestes.yml pour les commerces validés.
  function verifierManifeste(slug){
    fetch(HL.BASE + 'manifests/' + encodeURIComponent(slug) + '.json', { method: 'HEAD', cache: 'no-store' }).then(function(r){
      if (!r.ok) document.getElementById('manif').innerHTML = '<p class="alerte">Fichier d\'installation en préparation : il est créé automatiquement dans les 2 heures qui suivent la validation du commerce. ' +
        'D\'ici là, l\'appli installée depuis son QR code s\'ouvrirait sur l\'accueil au lieu de sa vidéo : attendez ce délai avant de distribuer son QR code.</p>';
    });
  }

  /* ── Publicités : programmation, relais, chevauchements ── */
  function conflits(p){
    if (p.format !== 'fixe' || !p.debut || !p.fin) return [];
    return D.pubs.filter(function(q){
      return q.id !== p.id && q.format === 'fixe' && q.emplacement === p.emplacement && q.statut === 'programmee' && q.debut && q.fin && q.debut <= p.fin && q.fin >= p.debut;
    }).map(function(q){ return 'Chevauche « ' + nom(q.slug) + ' » (' + dateFr(q.debut) + ' → ' + dateFr(q.fin) + ') : une seule s\'affiche à la fois, celle qui commence en premier.'; });
  }
  function etat(p){
    var j = aujourdhui();
    if (p.statut !== 'programmee') return st(p.statut, STATUTS_P);
    if (p.fin && p.fin < j) return '<span class="st">Terminée</span>';
    if (p.debut && p.debut > j) return '<span class="st demande">À venir</span>';
    return '<span class="st programmee">En ligne</span>';
  }
  function vuePubs(){
    var l = D.pubs.slice().sort(function(a,b){ return (b.debut || '').localeCompare(a.debut || ''); });
    vue.innerHTML = '<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>' + (ville() ? 'Publicités' : 'Mises en avant') + '</h2><button class="b2" id="nouvelle">' + (ville() ? '+ Programmer une publicité' : '+ Demander une mise en avant') + '</button></div>' +
      (ville() ? '' : '<p class="alerte">Les publicités sont programmées par la ville pour toutes les associations. Vous pouvez demander une mise en avant pour l\'un de vos adhérents : la ville l\'accepte, la programme ou vous propose d\'autres dates.</p>') +
      '<p class="small muted" style="margin-bottom:12px">Accueil : une publicité fixe à la fois, en tête des offres de la semaine. Découvrir : une vidéo sponsorisée au plus pour cinq vidéos. À la fin d\'une publicité, la suivante prend le relais ; sans publicité, le Coup de cœur s\'affiche.</p>' +
      '<div class="tw"><table><thead><tr><th>Commerce</th><th>Format</th><th>Diffusion</th><th>État</th><th>Alerte</th></tr></thead><tbody>' +
      (l.length ? l.map(function(p){
        var cf = conflits(p);
        return '<tr class="clic" data-p="' + esc(p.id) + '"><td><b>' + esc(nom(p.slug)) + '</b><br><span class="small muted">' + esc(p.id) + '</span></td>' +
          '<td>' + (p.format === 'video' ? 'Vidéo sponsorisée' : 'Publicité fixe') + (p.doc.cta === 'offre' ? '<br><span class="small muted">présente l\'offre</span>' : '') + '</td>' +
          '<td>' + dateFr(p.debut) + ' → ' + dateFr(p.fin) + '</td><td>' + etat(p) + '</td><td>' + (cf.length ? '⚠️ chevauchement' : '') + '</td></tr>';
      }).join('') : '<tr><td colspan="5" class="vide">Aucune publicité.</td></tr>') + '</tbody></table></div>';
    vue.querySelector('tbody').addEventListener('click', function(e){ var tr = e.target.closest('[data-p]'); if (tr) editerPub(D.pubs.filter(function(p){ return p.id === tr.getAttribute('data-p'); })[0]); });
    document.getElementById('nouvelle').addEventListener('click', function(){ editerPub(null); });
  }
  function editerPub(p){
    var neuf = !p;
    p = p || { id: '', slug: (D.commerces[0] || {}).slug, format: 'fixe', statut: ville() ? 'programmee' : 'demande', emplacement: 'accueil', debut: aujourdhui(), fin: '', doc: { cta: 'offre' } };
    var coms = {}; D.commerces.filter(function(c){ return c.statut === 'valide'; }).forEach(function(c){ coms[c.slug] = c.doc.nom + (ville() && c.association ? ' · ' + nomAsso(c.association) : ''); });
    var figee = !ville() && !neuf && p.statut !== 'demande';   // déjà traitée par la ville
    vue.innerHTML = '<button class="lien" id="retour" type="button" style="width:auto;padding:0 0 10px;text-align:left">‹ Toutes les publicités</button>' +
      '<h2 style="margin-bottom:12px">' + (neuf ? (ville() ? 'Nouvelle publicité' : 'Demande de mise en avant') : 'Publicité · ' + esc(nom(p.slug))) + '</h2>' +
      (figee ? '<p class="alerte">Cette publicité a été traitée par la ville (' + esc(STATUTS_P[p.statut] || p.statut) + ') : elle n\'est plus modifiable ici.</p>' : '') +
      '<div id="alertesPub"></div>' +
      '<div class="bloc" id="ed"><div class="form">' +
        champ('Commerce', 'slug', p.slug, { select: coms }) +
        champ('Format', 'format', p.format, { select: { fixe: 'Publicité fixe (accueil)', video: 'Vidéo sponsorisée (Découvrir et À la une)' } }) +
        (ville() ? champ('Statut', 'statut', p.statut, { select: STATUTS_P }) : '') +
        champ('Début', 'debut', p.debut, 'date') + champ('Fin', 'fin', p.fin, 'date') +
        champ('Bouton d\'action', 'doc.cta', p.doc.cta, { select: CTAS }) +
        '<div class="large" id="partFixe"><div class="form">' +
          '<p class="small muted large">Avec le bouton « Voir l\'offre », la carte présente l\'offre publiée du commerce (titre, validité) : laissez titre et texte vides.</p>' +
          champ('Visuel (URL)', 'doc.visuel', p.doc.visuel, null, 'large') + champ('Titre', 'doc.titre', p.doc.titre) + champ('Texte court', 'doc.texte', p.doc.texte) +
        '</div></div>' +
        '<div class="large" id="partVideo"><label class="f"><span>Vidéo publiée du commerce</span><select data-k="doc.videoId" id="videoId"></select></label></div>' +
      '</div></div>' +
      (figee ? '' : '<div class="bar"><button class="btn" id="enreg" type="button"><span>' + (ville() ? 'Enregistrer' : 'Envoyer la demande') + '</span><span class="arr">›</span></button><span class="msg" id="msg"></span>' +
      (neuf ? '' : '<button class="b2 ko" id="suppr" type="button">' + (ville() ? 'Supprimer' : 'Retirer la demande') + '</button>') + '</div>');
    var ed = document.getElementById('ed');
    if (figee) Array.prototype.forEach.call(ed.querySelectorAll('input,select,textarea'), function(x){ x.disabled = true; });
    function maj(){
      var lu = lire(ed), c = commerce(lu.slug);
      document.getElementById('partFixe').style.display = lu.format === 'fixe' ? '' : 'none';
      document.getElementById('partVideo').style.display = lu.format === 'video' ? '' : 'none';
      var vids = ((c && c.doc.videos) || []).filter(function(v){ return v.statut === 'publiee'; });
      var sel = document.getElementById('videoId'), cur = sel.value || p.doc.videoId;
      sel.innerHTML = vids.length ? vids.map(function(v){ return '<option value="' + esc(v.id) + '"' + (v.id === cur ? ' selected' : '') + '>' + esc(v.titre) + '</option>'; }).join('') : '<option value="">Aucune vidéo publiée</option>';
      var al = [];
      if (lu.format === 'fixe' && lu.doc.cta === 'offre' && !(c && c.doc.offre && c.doc.offre.statut === 'publiee')) al.push('Ce commerce n\'a pas d\'offre publiée : la carte ne s\'affichera pas.');
      if (lu.format === 'fixe' && lu.doc.cta === 'offre' && c && c.doc.offre && c.doc.offre.fin && lu.fin && c.doc.offre.fin < lu.fin) al.push('L\'offre se termine le ' + dateFr(c.doc.offre.fin) + ', avant la publicité : la carte disparaîtra à cette date.');
      if (lu.format === 'video' && !vids.length) al.push('Ce commerce n\'a aucune vidéo publiée.');
      al = al.concat(conflits({ id: p.id, format: lu.format, emplacement: lu.format === 'video' ? 'decouvrir' : 'accueil', debut: lu.debut, fin: lu.fin }));
      document.getElementById('alertesPub').innerHTML = al.map(function(t){ return '<p class="alerte">' + esc(t) + '</p>'; }).join('');
    }
    ed.addEventListener('change', maj); maj();
    document.getElementById('retour').addEventListener('click', vuePubs);
    if (figee) { maj(); return; }
    if (!neuf) document.getElementById('suppr').addEventListener('click', function(){
      if (!confirm('Supprimer définitivement cette publicité ? Ses statistiques restent comptées.')) return;
      rpc('hl_admin_delete_pub', { p_token: jeton(), p_id: p.id }).then(function(){ return charger(); }).then(vuePubs);
    });
    document.getElementById('enreg').addEventListener('click', function(){
      var msg = document.getElementById('msg'), lu = lire(ed);
      if (!lu.debut || !lu.fin) { msg.className = 'msg ko'; msg.textContent = 'Indiquez les dates de début et de fin.'; return; }
      if (lu.fin < lu.debut) { msg.className = 'msg ko'; msg.textContent = 'La fin est avant le début.'; return; }
      var pub = { id: p.id || ('pub-' + lu.slug + '-' + lu.debut), slug: lu.slug, format: lu.format, statut: ville() ? lu.statut : 'demande',
        emplacement: lu.format === 'video' ? 'decouvrir' : 'accueil', debut: lu.debut, fin: lu.fin,
        doc: Object.assign({}, p.doc, lu.doc) };
      if (pub.format === 'video') { delete pub.doc.visuel; delete pub.doc.titre; delete pub.doc.texte; if (!pub.doc.videoId) { msg.className = 'msg ko'; msg.textContent = 'Choisissez une vidéo publiée.'; return; } }
      else delete pub.doc.videoId;
      msg.className = 'msg'; msg.textContent = 'Enregistrement…';
      rpc('hl_admin_save_pub', { p_token: jeton(), p_pub: pub }).then(function(j){
        if (!j.ok) throw new Error(j.reason || 'refusé');
        return charger().then(function(){ msg.className = 'msg ok'; msg.textContent = ville() ? 'Enregistrée.' : 'Demande envoyée à la ville.'; p = D.pubs.filter(function(x){ return x.id === pub.id; })[0]; });
      }).catch(function(e){ msg.className = 'msg ko'; msg.textContent = 'Enregistrement impossible : ' + e.message; });
    });
  }

  /* ── Coup de cœur : l'emplacement quand aucune publicité n'est en ligne ── */
  function vueCdc(){
    var cur = ((D.reglages || {}).coup_de_coeur || {}).slug || '';
    var j = aujourdhui();
    var l = D.commerces.filter(function(c){ return c.statut === 'valide' && c.doc.offre && c.doc.offre.statut === 'publiee' && (!c.doc.offre.fin || c.doc.offre.fin >= j); });
    vue.innerHTML = '<h2 style="margin-bottom:8px">Coup de cœur de la semaine</h2>' +
      '<p class="muted" style="margin-bottom:14px">Quand aucune publicité n\'est en ligne, la grande carte en tête des offres présente ce commerce, avec un badge « Coup de cœur » et sans mention payante.</p>' +
      '<div class="bloc">' +
      '<label class="ck" style="padding:8px 0"><input type="radio" name="cdc" value=""' + (!cur ? ' checked' : '') + '> Automatique : l\'offre qui se termine le plus tôt</label>' +
      l.map(function(c){ return '<label class="ck" style="padding:8px 0"><input type="radio" name="cdc" value="' + esc(c.slug) + '"' + (c.slug === cur ? ' checked' : '') + '> ' + esc(c.doc.nom) + ' · <span class="muted" style="font-weight:400">' + esc(c.doc.offre.titre) + '</span></label>'; }).join('') +
      '<div class="bar"><button class="btn" id="enreg" type="button"><span>Enregistrer</span><span class="arr">›</span></button><span class="msg" id="msg"></span></div></div>';
    document.getElementById('enreg').addEventListener('click', function(){
      var v = (vue.querySelector('input[name=cdc]:checked') || {}).value || '', msg = document.getElementById('msg');
      rpc('hl_admin_set_reglage', { p_token: jeton(), p_cle: 'coup_de_coeur', p_valeur: { slug: v } }).then(function(r){
        if (!r.ok) throw new Error(r.reason);
        return charger().then(function(){ msg.className = 'msg ok'; msg.textContent = 'Enregistré.'; });
      }).catch(function(e){ msg.className = 'msg ko'; msg.textContent = 'Enregistrement impossible : ' + e.message; });
    });
  }

  /* ── Vidéo Anna (niveau ville) : Claude lit les avis et écrit le texte,
     l'avatar HeyGen le lit sur les photos du commerce. Chaque rendu est
     payant : le commerçant valide le texte avant le lancement. ── */
  var anna = { photos: {}, suivi: null };
  function vueAnna(){
    var coms = D.commerces.filter(function(c){ return c.statut === 'valide'; });
    var h = '<h2 style="margin-bottom:8px">Vidéo présentée par Anna</h2>' +
      '<p class="muted" style="margin-bottom:14px">Collez les avis du commerce : Claude en tire les points forts et écrit le texte qu\'Anna, présentatrice virtuelle, lira sur les photos du commerce. La vidéo arrive ensuite dans l\'espace du commerçant, qui l\'envoie à son association.</p>' +
      '<div class="bloc"><h3>1 · Le commerce et ses avis</h3><div class="form">' +
        '<label class="f"><span>Commerce</span><select id="aCom"><option value="">— Choisir —</option>' +
          coms.map(function(c){ return '<option value="' + esc(c.slug) + '">' + esc(c.doc.nom || c.slug) + '</option>'; }).join('') + '</select></label>' +
        '<label class="f large"><span>Avis clients (copiés depuis la fiche Google du commerçant, avec son accord)</span><textarea id="aAvis" style="min-height:160px" placeholder="Collez ici 10 à 100 avis. Les noms des auteurs ne sont pas nécessaires. Rien n\'est conservé."></textarea></label>' +
      '</div><p class="small muted" id="aNb"></p>' +
      '<div class="bar"><button class="btn" id="aAnalyser" type="button"><span>Écrire le texte avec Claude</span><span class="arr">›</span></button><span class="msg" id="aMsg1"></span></div></div>' +
      '<div class="bloc" id="aRes" hidden><h3>2 · Le texte d\'Anna</h3><div id="aAnalyse"></div><div class="form">' +
        '<label class="f large"><span>Texte lu par Anna (corrigez si besoin, puis faites-le valider au commerçant)</span><textarea id="aTexte" style="min-height:120px;font-weight:400" maxlength="700"></textarea></label>' +
      '</div><p class="small muted" id="aDuree"></p></div>' +
      '<div class="bloc" id="aLance" hidden><h3>3 · Photos et lancement</h3>' +
        '<p class="small muted">2 à 6 photos du commerce, à la verticale de préférence. Le nom du commerce s\'affiche sur la 1<sup>re</sup>.</p>' +
        '<div class="row" id="aPhotos" style="flex-wrap:wrap;gap:10px;margin:10px 0"></div>' +
        '<div class="form"><label class="f"><span>Bouton de fin</span><select id="aCta">' + opts(CTAS, 'offre') + '</select></label></div>' +
        '<label class="ck" style="margin-top:12px"><input type="checkbox" id="aAccord"> Le commerçant a relu ce texte et accepte une vidéo présentée par un avatar, avec la mention « générée par IA ».</label>' +
        '<div class="bar"><button class="btn" id="aLancer" type="button"><span>Lancer la vidéo Anna</span><span class="arr">›</span></button><span class="msg" id="aMsg2"></span></div></div>' +
      '<div class="bloc"><h3>Vidéos Anna récentes</h3><div id="aListe"><p class="muted small">Chargement…</p></div></div>';
    vue.innerHTML = h;
    anna.photos = {};
    rendrePhotosAnna();
    var avis = document.getElementById('aAvis');
    avis.addEventListener('input', function(){
      document.getElementById('aNb').textContent = avis.value.trim() ? avis.value.length.toLocaleString('fr-FR') + ' caractères' + (avis.value.length > 60000 ? ' · trop long : 60 000 au plus' : '') : '';
    });
    document.getElementById('aTexte').addEventListener('input', dureeAnna);
    document.getElementById('aAnalyser').addEventListener('click', analyserAnna);
    document.getElementById('aLancer').addEventListener('click', lancerAnna);
    document.getElementById('aPhotos').addEventListener('change', choisirPhotoAnna);
    listeAnna();
  }
  function dureeAnna(){
    var mots = document.getElementById('aTexte').value.trim().split(/\s+/).filter(Boolean).length;
    var s = Math.round(mots / 2.6);   // débit mesuré de la voix : environ 2,6 mots par seconde
    document.getElementById('aDuree').textContent = mots + ' mots · environ ' + s + ' s de voix · coût HeyGen estimé ' +
      (s * 0.0167).toFixed(2).replace('.', ',') + ' $' + (mots > 60 ? ' · un peu long : visez 40 à 55 mots' : '');
  }
  function analyserAnna(){
    var slug = document.getElementById('aCom').value, b = this, m = document.getElementById('aMsg1');
    var avis = document.getElementById('aAvis').value.trim();
    if (!slug) { m.className = 'msg ko'; m.textContent = 'Choisissez le commerce.'; return; }
    if (avis.length > 60000) { m.className = 'msg ko'; m.textContent = '60 000 caractères au plus.'; return; }
    b.disabled = true; m.className = 'msg'; m.textContent = 'Claude lit les avis… (20 à 60 secondes)';
    fetch(SUPA_URL + '/functions/v1/hl-avis-texte', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ jeton: jeton(), slug: slug, avis: avis }) })
    .then(function(r){ return r.json(); }).then(function(j){
      b.disabled = false;
      if (!j.ok) throw new Error(j.erreur || 'refusé');
      var a = j.analyse;
      function liste(t, l){ return l && l.length ? '<p class="small" style="font-weight:700;margin-top:10px">' + t + '</p><ul class="small" style="margin:4px 0 0;padding-left:18px">' + l.join('') + '</ul>' : ''; }
      document.getElementById('aAnalyse').innerHTML =
        (a.remarque ? '<p class="small" style="background:#FDECEC;color:#8A2B2B;border-radius:10px;padding:10px 12px;font-weight:700;margin-bottom:8px">⚠️ ' + esc(a.remarque) + '</p>' : '') +
        '<p class="small muted">' + n(a.nb_avis) + ' avis analysés · accroche proposée : « ' + esc(a.accroche) + ' »</p>' +
        liste('Points forts', (a.points_forts || []).map(function(p){ return '<li>' + esc(p.theme) + ' <span class="muted">· ' + n(p.nb_avis) + ' avis</span></li>'; })) +
        liste('À confirmer avec le commerçant', (a.verifications || []).map(function(v){ return '<li>' + esc(v) + '</li>'; })) +
        liste('À améliorer (pour le commerçant seulement, jamais dans la vidéo)', (a.a_ameliorer || []).map(function(v){ return '<li>' + esc(v) + '</li>'; })) +
        '<div style="height:12px"></div>';
      document.getElementById('aTexte').value = a.texte || '';
      document.getElementById('aRes').hidden = false; document.getElementById('aLance').hidden = false;
      dureeAnna();
      m.className = 'msg ok'; m.textContent = 'Texte prêt : relisez-le ci-dessous.';
      document.getElementById('aRes').scrollIntoView({ behavior: 'smooth' });
    }).catch(function(e){ b.disabled = false; m.className = 'msg ko'; m.textContent = 'Impossible : ' + e.message; });
  }
  function rendrePhotosAnna(){
    var h = '';
    for (var i = 1; i <= 6; i++) {
      var ph = anna.photos['photo' + i];
      h += '<label style="width:84px;height:150px;border-radius:12px;background:var(--rose-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--rose);font-weight:900;cursor:pointer;border:1.5px dashed var(--line)" data-v="' + i + '">' + (ph ? '' : '+ ' + i) +
        '<input type="file" accept="image/*" hidden data-photo="photo' + i + '"></label>';
    }
    var el = document.getElementById('aPhotos'); el.innerHTML = h;
    Object.keys(anna.photos).forEach(function(k){ var l = el.querySelector('[data-v="' + k.slice(5) + '"]'); if (l) l.style.backgroundImage = 'url(' + anna.photos[k].url + ')'; });
  }
  // Même préparation que dans l'espace commerçant : JPEG de 2400 px au plus.
  function versJpeg(f){
    return new Promise(function(ok, ko){
      var url = URL.createObjectURL(f), img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, hh = img.naturalHeight, k = Math.min(1, 2400 / Math.max(w, hh));
        if (Math.min(w, hh) < 500) { URL.revokeObjectURL(url); ko(new Error('photo trop petite (500 px de côté au moins)')); return; }
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(hh * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? ok(b) : ko(new Error('photo illisible')); }, 'image/jpeg', 0.86);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); ko(new Error('photo illisible')); };
      img.src = url;
    });
  }
  function choisirPhotoAnna(e){
    var inp = e.target.closest('[data-photo]'); if (!inp || !inp.files[0]) return;
    var id = inp.getAttribute('data-photo'), m = document.getElementById('aMsg2');
    versJpeg(inp.files[0]).then(function(b){
      if (anna.photos[id]) URL.revokeObjectURL(anna.photos[id].url);
      anna.photos[id] = { blob: b, url: URL.createObjectURL(b) }; rendrePhotosAnna(); m.textContent = '';
    }).catch(function(x){ m.className = 'msg ko'; m.textContent = 'Photo ' + id.slice(5) + ' : ' + x.message; });
  }
  function televerserPhoto(slug, blob){
    return fetch(SUPA_URL + '/functions/v1/hl-televersement', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ jeton: jeton(), slug: slug, genre: 'rush_photo', type: 'image/jpeg', taille: blob.size }) })
    .then(function(r){ return r.json(); }).then(function(a){
      if (!a.ok) throw new Error(a.erreur || 'envoi refusé');
      return fetch(a.url_envoi, { method: 'PUT', headers: { 'content-type': 'image/jpeg' }, body: blob }).then(function(r){
        if (!r.ok) throw new Error('envoi interrompu (' + r.status + ')'); return a.chemin; });
    });
  }
  function lancerAnna(){
    var slug = document.getElementById('aCom').value, b = this, m = document.getElementById('aMsg2');
    var texte = document.getElementById('aTexte').value.trim();
    var ids = [1, 2, 3, 4, 5, 6].map(function(i){ return 'photo' + i; }).filter(function(k){ return anna.photos[k]; });
    function ko(t){ m.className = 'msg ko'; m.textContent = t; }
    if (!slug) return ko('Choisissez le commerce.');
    if (texte.length < 20) return ko('Le texte est trop court.');
    if (ids.length < 2) return ko('Ajoutez au moins 2 photos.');
    if (!document.getElementById('aAccord').checked) return ko('Cochez l\'accord du commerçant.');
    var c = commerce(slug);
    if (!confirm('Lancer la vidéo Anna pour ' + (c ? c.doc.nom : slug) + ' ? Le rendu consomme des crédits HeyGen.')) return;
    b.disabled = true; m.className = 'msg'; m.textContent = 'Envoi des photos…';
    var rushes = [];
    ids.reduce(function(ch, k){ return ch.then(function(){ return televerserPhoto(slug, anna.photos[k].blob).then(function(chemin){ rushes.push({ plan: k, chemin: chemin }); }); }); }, Promise.resolve())
    .then(function(){
      return rpc('hl_admin_avatar_creer', { p_token: jeton(), p_slug: slug, p_rushes: rushes,
        p_options: { texte: texte, titre: c ? c.doc.nom : '', cta: document.getElementById('aCta').value } });
    }).then(function(j){
      b.disabled = false;
      if (!j.ok) throw new Error(j.reason || 'refusé');
      m.className = 'msg ok'; m.textContent = 'C\'est parti : la vidéo sera prête dans 5 à 10 minutes, ci-dessous et dans l\'espace du commerçant.';
      listeAnna();
    }).catch(function(e){ b.disabled = false; ko('Impossible : ' + e.message); });
  }
  var ST_ANNA = { en_attente: 'En file d\'attente', en_cours: 'Montage en cours', pret: 'Prête · chez le commerçant', erreur: 'Échec', envoye: 'Envoyée à l\'association', abandonne: 'Supprimée' };
  function listeAnna(){
    clearTimeout(anna.suivi);
    rpc('hl_admin_avatar_liste', { p_token: jeton() }).then(function(j){
      var el = document.getElementById('aListe'); if (!el || !j.ok) return;
      var l = j.montages || [];
      el.innerHTML = l.length ? l.map(function(x){
        return '<div style="border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px"><div class="row" style="gap:8px;flex-wrap:wrap"><b>' + esc(nom(x.slug)) + '</b>' +
          '<span class="small muted">' + new Date(x.created_at).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' · ' + esc(ST_ANNA[x.statut] || x.statut) + (x.duree ? ' · ' + esc(x.duree) + ' s' : '') + '</span></div>' +
          (x.erreur ? '<p class="small" style="color:#B23B3B">' + esc(x.erreur) + '</p>' : '') +
          (x.src ? '<video controls playsinline preload="metadata" style="width:100%;max-width:280px;aspect-ratio:9/16;border-radius:12px;background:#111" poster="' + esc(x.affiche || '') + '" src="' + esc(x.src) + '">' +
            (x.sousTitres ? '<track kind="subtitles" srclang="fr" label="Français" default src="' + esc(x.sousTitres) + '">' : '') + '</video>' : '') +
          '<p class="small muted">« ' + esc(x.texte || '') + ' »</p></div>';
      }).join('') : '<p class="muted small">Aucune vidéo Anna pour le moment.</p>';
      if (l.some(function(x){ return x.statut === 'en_attente' || x.statut === 'en_cours'; }) && onglet === 'anna') anna.suivi = setTimeout(listeAnna, 20000);
    });
  }

  /* ── Associations de la ville (niveau ville) ── */
  function vueAssociations(){
    var l = D.associations || [];
    vue.innerHTML = '<h2 style="margin-bottom:8px">Associations de commerçants</h2>' +
      '<p class="muted" style="margin-bottom:14px">Chaque association gère ses adhérents, ses comptes et ne voit que les chiffres de ses adhérents. Les publicités et le Coup de cœur restent gérés ici, au niveau ville.</p>' +
      '<div class="tw" style="margin-bottom:16px"><table><thead><tr><th>Association</th><th>Identifiant</th><th class="n">Adhérents</th><th></th></tr></thead><tbody id="la">' +
      (l.length ? l.map(function(a){
        var nbc = D.commerces.filter(function(c){ return c.association === a.slug; }).length;
        return '<tr><td><b>' + esc(a.nom) + '</b></td><td class="small muted">' + esc(a.slug) + '</td><td class="n">' + nbc + '</td>' +
          '<td><button class="b2" data-slug="' + esc(a.slug) + '">Modifier</button></td></tr>';
      }).join('') : '<tr><td colspan="4" class="vide">Aucune association pour le moment.</td></tr>') + '</tbody></table></div>' +
      '<div class="bloc"><h3 id="faTitre">Nouvelle association</h3><div class="form">' +
        '<label class="f"><span>Nom</span><input id="an" placeholder="Union des commerçants du Centre"></label>' +
        '<label class="f"><span>Identifiant (ex. ucc-centre)</span><input id="as" autocapitalize="none"></label>' +
        '<label class="f large"><span>Logo (URL, facultatif)</span><input id="al" type="url"></label>' +
      '</div><div class="bar"><button class="btn" id="enreg" type="button"><span>Enregistrer l\'association</span><span class="arr">›</span></button><span class="msg" id="msg"></span></div></div>';
    var an = document.getElementById('an'), as = document.getElementById('as'), al = document.getElementById('al'), edite = false;
    an.addEventListener('input', function(){
      if (edite) return;
      as.value = an.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0, 60);
    });
    document.getElementById('la').addEventListener('click', function(e){
      var b = e.target.closest('[data-slug]'); if (!b) return;
      var a = l.filter(function(x){ return x.slug === b.getAttribute('data-slug'); })[0];
      edite = true; an.value = a.nom; as.value = a.slug; as.disabled = true; al.value = a.logo || '';
      document.getElementById('faTitre').textContent = 'Modifier « ' + a.nom + ' »';
    });
    document.getElementById('enreg').addEventListener('click', function(){
      var msg = document.getElementById('msg');
      rpc('hl_admin_save_association', { p_token: jeton(), p_slug: as.value.trim(), p_nom: an.value.trim(), p_logo: al.value.trim() }).then(function(j){
        if (!j.ok) throw new Error(j.reason || 'refusé');
        return charger().then(function(){ vueAssociations(); HL.toast('Association enregistrée'); });
      }).catch(function(e){ msg.className = 'msg ko'; msg.textContent = 'Impossible : ' + e.message; });
    });
  }

  /* ── Comptes « association » : créés par le superadmin, qui tape lui-même
     le mot de passe. Ils n'ouvrent que cet espace et les tableaux de bord
     des commerces du pilote, jamais les espaces admin des restaurants. ── */
  function vueComptes(){
    vue.innerHTML = '<h2 style="margin-bottom:8px">' + (ville() ? 'Comptes des associations' : 'Comptes de ' + esc(nomAsso(D.association))) + '</h2>' +
      '<p class="muted" style="margin-bottom:14px">' + (ville() ? '' : 'Pour les bénévoles de votre association. ') + 'Ces comptes ouvrent cet espace et les tableaux de bord des commerces du pilote, jamais les espaces admin des restaurants ni vos autres outils Fidelavis.</p>' +
      '<div class="tw" style="margin-bottom:16px"><table><thead><tr><th>Identifiant</th><th>Type</th>' + (ville() ? '<th>Association</th>' : '') + '<th>État</th><th>Dernière connexion</th><th></th></tr></thead><tbody id="lc"><tr><td colspan="4" class="vide">Chargement…</td></tr></tbody></table></div>' +
      '<div class="bloc"><h3 id="fcTitre">Nouveau compte</h3><div class="form">' +
        '<label class="f"><span>Identifiant (ex. asso.garenne)</span><input id="cu" autocomplete="off" autocapitalize="none"></label>' +
        '<label class="f"><span>Mot de passe (10 caractères minimum)</span><input id="cp" type="password" autocomplete="new-password"></label>' +
        '<label class="f"><span>Confirmer le mot de passe</span><input id="cp2" type="password" autocomplete="new-password"></label>' +
        '<label class="f"><span>Type de compte</span><select id="crole"><option value="association">Membre de l\'association</option><option value="commercant">Commerçant (son offre et ses vidéos)</option></select></label>' +
        '<label class="f" id="lcom" hidden><span>Commerce</span><select id="ccom"><option value="">— Choisir —</option>' +
          D.commerces.map(function(c){ return '<option value="' + esc(c.slug) + '">' + esc(c.doc.nom || c.slug) + '</option>'; }).join('') + '</select></label>' +
        (ville() ? '<label class="f" id="lasso"><span>Association</span><select id="cas"><option value="">— Choisir —</option>' +
          (D.associations || []).map(function(a){ return '<option value="' + esc(a.slug) + '">' + esc(a.nom) + '</option>'; }).join('') + '</select></label>' : '') +
        '<label class="ck" style="align-self:end;padding-bottom:10px"><input type="checkbox" id="ca" checked> Compte actif</label>' +
      '</div><p class="small muted" style="margin-top:8px">Pour un compte existant, laissez le mot de passe vide pour le garder.</p>' +
      '<div class="bar"><button class="btn" id="enreg" type="button"><span>Enregistrer le compte</span><span class="arr">›</span></button><span class="msg" id="msg"></span></div></div>';
    function liste(){
      rpc('hl_admin_comptes', { p_token: jeton() }).then(function(j){
        var lc = document.getElementById('lc'); if (!lc) return;
        if (!j.ok) { lc.innerHTML = '<tr><td colspan="4" class="vide">' + esc(j.reason) + '</td></tr>'; return; }
        lc.innerHTML = j.comptes.length ? j.comptes.map(function(c){
          return '<tr><td><b>' + esc(c.username) + '</b></td><td class="small">' + (c.role === 'commercant' ? 'Commerçant · ' + esc(nom(c.commerce)) : 'Association') + '</td>' + (ville() ? '<td class="small">' + (c.association ? esc(nomAsso(c.association)) : '<span class="st suspendu">Non rattaché</span>') + '</td>' : '') + '<td>' + (c.is_active ? '<span class="st valide">Actif</span>' : '<span class="st suspendu">Désactivé</span>') + '</td>' +
            '<td class="small muted">' + (c.last_login_at ? new Date(c.last_login_at).toLocaleString('fr-FR') : 'jamais') + '</td>' +
            '<td><button class="b2" data-u="' + esc(c.username) + '" data-a="' + (c.is_active ? '1' : '0') + '" data-as="' + esc(c.association || '') + '" data-role="' + esc(c.role || 'association') + '" data-com="' + esc(c.commerce || '') + '">Modifier</button></td></tr>';
        }).join('') : '<tr><td colspan="4" class="vide">Aucun compte pour le moment.</td></tr>';
      });
    }
    liste();
    // Commerçant : on choisit son commerce ; membre : son association (ville).
    function majType(){
      var com = document.getElementById('crole').value === 'commercant';
      document.getElementById('lcom').hidden = !com;
      if (document.getElementById('lasso')) document.getElementById('lasso').hidden = com;
    }
    document.getElementById('crole').addEventListener('change', majType);
    document.getElementById('lc').addEventListener('click', function(e){
      var b = e.target.closest('[data-u]'); if (!b) return;
      document.getElementById('cu').value = b.getAttribute('data-u');
      document.getElementById('ca').checked = b.getAttribute('data-a') === '1';
      if (document.getElementById('cas')) document.getElementById('cas').value = b.getAttribute('data-as');
      document.getElementById('crole').value = b.getAttribute('data-role'); document.getElementById('ccom').value = b.getAttribute('data-com'); majType();
      document.getElementById('fcTitre').textContent = 'Modifier « ' + b.getAttribute('data-u') + ' »';
      document.getElementById('cp').focus();
    });
    document.getElementById('enreg').addEventListener('click', function(){
      var u = document.getElementById('cu').value.trim().toLowerCase(), p1 = document.getElementById('cp').value, p2 = document.getElementById('cp2').value, msg = document.getElementById('msg');
      if (p1 !== p2) { msg.className = 'msg ko'; msg.textContent = 'Les deux mots de passe ne sont pas identiques.'; return; }
      msg.className = 'msg'; msg.textContent = 'Enregistrement…';
      var role = document.getElementById('crole').value;
      rpc('hl_admin_save_compte', { p_token: jeton(), p_username: u, p_password: p1 || null, p_actif: document.getElementById('ca').checked,
        p_association: ville() && role === 'association' ? document.getElementById('cas').value : null,
        p_role: role, p_commerce: role === 'commercant' ? document.getElementById('ccom').value : null }).then(function(j){
        if (!j.ok) throw new Error(j.reason || 'refusé');
        document.getElementById('cp').value = ''; document.getElementById('cp2').value = '';
        msg.className = 'msg ok'; msg.textContent = 'Compte « ' + u + ' » enregistré. Transmettez le mot de passe de vive voix, pas par e-mail.' +
          (role === 'commercant' ? ' Lien de connexion du commerçant : app.cartefidelavis.com/la-garenne/pro/connexion.html' : '');
        liste();
      }).catch(function(e){ msg.className = 'msg ko'; msg.textContent = 'Impossible : ' + e.message; });
    });
  }

  demarrer();
})();
</script>
</body>
