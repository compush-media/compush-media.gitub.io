<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8206A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fidelavis">
<link rel="manifest" id="mf" href="/la-garenne/manifest.json">
<script>
  /* Fichier d'installation propre au commerce, sur TOUTES les pages : on peut
     ajouter l'appli à l'écran d'accueil depuis n'importe laquelle (souvent
     depuis l'extrait vidéo, sans passer par installer.html). Son start_url
     app.html?first=<slug> rouvre l'appli sur la vidéo du bon commerce.
     Commerce connu par ?s= ou, à défaut, par celui qui a amené l'habitant. */
  (function(){
    var s = (new URLSearchParams(location.search).get('s') || '').toLowerCase().replace(/[^a-z0-9-]/g,'');
    if (!s) { try { var src = JSON.parse(localStorage.getItem('hl_source') || 'null'); s = (src && src.slug || '').replace(/[^a-z0-9-]/g,''); } catch(e) {} }
    if (s) document.getElementById('mf').href = '/la-garenne/manifests/' + s + '.json';
  })();
</script>
<link rel="apple-touch-icon" sizes="180x180" href="/la-garenne/icons/icon-180.png">
<script defer src="https://progressier.app/zb3Ezrlt6Ezd6iN3VpMW/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/la-garenne/hl.css">
<script src="/la-garenne/hl.js"></script>
<title>Découvrez ce commerce – Les Commerces de La Garenne</title>
<style>
  .intro{padding:16px 2px 0;}
  .intro h1{margin:0 0 8px;}
  .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 18px;font-size:13.5px;}
  .lockcard{background:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:10px;}
  .lockcard .ic{width:40px;height:40px;border-radius:50%;background:var(--rose);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .lockcard p{font-weight:700;font-size:14.5px;line-height:1.35;}
</style>
</head>
<body class="sans-nav">
<div id="demo"></div>
<div id="bar"></div>
<main class="ct">
  <div id="player"></div>
  <div class="intro" id="intro"></div>
  <a class="btn" id="ctaInstall" href="#">
    <span>Voir la vidéo complète dans l'appli gratuite</span><span class="arr">›</span>
  </a>
  <button class="lien" id="web" type="button">Continuer sans installer</button>
</main>

<script>
/* Étapes 3 et 4 — page d'atterrissage du QR / NFC.
   URL imprimée sur le support : /la-garenne/c.html?s=<slug>&via=qr|nfc */
(function(){
  var slug = HL.qs('s').toLowerCase().replace(/[^a-z0-9-]/g,'');
  var via  = HL.qs('via') === 'nfc' ? 'nfc' : 'qr';
  document.getElementById('bar').innerHTML = HL.brandbar(false);

  // Déjà installée : on va droit à la vidéo complète.
  if (HL.isStandalone()) { location.replace(HL.BASE + 'video.html?s=' + encodeURIComponent(slug)); return; }

  HL.setSource(slug, via);
  HL.track('scan', slug, via);

  var install = HL.BASE + 'installer.html?s=' + encodeURIComponent(slug);
  var cta = document.getElementById('ctaInstall');
  cta.href = install;
  cta.setAttribute('data-hl','install_intention'); cta.setAttribute('data-slug',slug); cta.setAttribute('data-src','landing');

  document.getElementById('web').addEventListener('click', function(){
    HL.track('install_ignoree', slug, 'landing');
    location.href = HL.BASE + 'video.html?s=' + encodeURIComponent(slug) + '&web=1';
  });

  HL.charger().then(function(d){
    var c = d.parSlug[slug];
    if (!c) { location.replace(HL.BASE + 'app.html'); return; }
    if (c.demo) document.getElementById('demo').innerHTML = '<div class="bandeau-demo">Commerce de démonstration</div>';
    document.title = c.nom + ' – Les Commerces de La Garenne';

    var v = c.videos[0];
    if (v) {
      HL.player(document.getElementById('player'), {
        video: v, contexte: 'landing', teaser: 15, etiquette: c.nom,
        titre: 'À La Garenne, ' + c.nom + ' : ' + (c.accroche || v.titre),
        lock: '<div class="lockcard"><span class="ic">🔒</span><p>Découvrez la suite et tous les avantages dans notre appli gratuite</p></div>' +
              '<a class="btn" href="' + install + '" data-hl="install_intention" data-slug="' + HL.esc(slug) + '" data-src="teaser"><span>Installer l\'appli</span><span class="arr">›</span></a>'
      });
    } else {
      document.getElementById('player').outerHTML = c.photo ? '<div class="player wide"><div class="poster" style="background-image:url(\'' + HL.esc(c.photo) + '\')"></div></div>' : '';
    }

    var cat = HL.CATEGORIES[c.categorie] || {label: ''};
    document.getElementById('intro').innerHTML =
      '<span class="tag">' + HL.esc(cat.label) + '</span>' +
      '<h1 style="margin-top:10px">Découvrez l\'histoire de ce commerce</h1>' +
      '<p class="muted">' + HL.esc(c.accroche || '') + '</p>' +
      '<div class="meta">' +
        (c.avis ? '<span><span class="stars">★</span> <b>' + String(c.avis.note).replace('.', ',') + '/5</b> · ' + c.avis.nombre + ' avis ' + HL.esc(c.avis.source) + '</span>' : '') +
        '<span>📍 ' + HL.esc(c.quartier ? c.quartier + ', La Garenne-Colombes' : 'La Garenne-Colombes') + '</span>' +
      '</div>';
  });
})();
</script>
</body>
</html>
