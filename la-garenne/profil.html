<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D41468">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Garenne">
<link rel="manifest" id="mf" href="/la-garenne/manifest.json">
<script>
  /* Fichier d'installation propre au commerce, sur TOUTES les pages : on peut
     ajouter l'appli à l'écran d'accueil depuis n'importe laquelle (souvent
     depuis l'extrait vidéo, sans passer par installer.html). Son start_url
     app.html?first=<slug> rouvre l'appli sur la vidéo du bon commerce.
     Commerce connu par ?s= ou, à défaut, par celui qui a amené l'habitant. */
  (function(){
    var s = (new URLSearchParams(location.search).get('s') || '').toLowerCase().replace(/[^a-z0-9-]/g,'');
    if (!s) { try { var src = JSON.parse(localStorage.getItem('hl_source') || 'null'); s = (src && src.slug || '').replace(/[^a-z0-9-]/g,''); } catch(e) {} }
    if (s) document.getElementById('mf').href = '/la-garenne/manifests/' + s + '.json';
  })();
</script>
<link rel="icon" type="image/png" sizes="48x48" href="/la-garenne/icons/icon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/la-garenne/icons/icon-180.png">
<script defer src="https://progressier.app/zb3Ezrlt6Ezd6iN3VpMW/script.js"></script>
<link rel="stylesheet" href="/la-garenne/polices/polices.css">
<link rel="stylesheet" href="/la-garenne/hl.css">
<script src="/la-garenne/hl.js"></script>
<title>Mon espace – Les Commerces de La Garenne</title>
<style>
  .bloc{margin-top:18px;}
  .bloc h2{font-family:var(--sans);font-size:15px;margin-bottom:10px;}
  .vide{color:var(--muted);font-size:13.5px;line-height:1.45;}
  .ligne-lien{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);text-decoration:none;color:inherit;font-weight:600;font-size:14.5px;margin-bottom:8px;border:0;width:100%;text-align:left;}
  .ligne-lien .icn{color:var(--muted);}
</style>
</head>
<body>
<div id="bar"></div>
<main class="ct">
  <h1 style="margin:6px 0 4px">Mon espace</h1>
  <p class="muted small">Vos favoris et vos alertes restent sur ce téléphone : aucun compte, aucune donnée personnelle.</p>
  <section class="bloc"><h2>Commerces favoris</h2><div class="clist" id="favC"></div></section>
  <section class="bloc"><h2>Sorties favorites</h2><div class="rail" id="favS"></div></section>
  <section class="bloc"><h2>Réglages</h2>
    <button class="ligne-lien" type="button" data-cloche id="lAlertes"></button>
    <a class="ligne-lien" href="/la-garenne/installer.html" id="lInstaller">Installer l'appli sur mon téléphone<span class="chv"></span></a>
    <a class="ligne-lien" href="/la-garenne/confidentialite.html">Confidentialité et mesure d'audience<span class="chv"></span></a>
  </section>
</main>
<script>
/* Mon espace : favoris (commerces et sorties) et réglages ; tout reste sur l'appareil. */
(function(){
  document.getElementById('bar').innerHTML = HL.brandbar(true);
  HL.nav('');
  Array.prototype.forEach.call(document.querySelectorAll('.chv'), function(x){ x.innerHTML = HL.icone('chevron', 18); });
  document.getElementById('lAlertes').innerHTML = (HL.alertesActives() ? 'Alertes de la semaine : activées' : 'Activer les alertes de la semaine') + HL.icone('cloche', 18);
  if (HL.isStandalone()) document.getElementById('lInstaller').hidden = true;
  HL.charger().then(function(d){
    var favs = HL.favoris(), l = d.commerces.filter(function(c){ return favs.indexOf(c.slug) !== -1; });
    document.getElementById('favC').innerHTML = l.length ? l.map(HL.commerceRowHtml).join('')
      : '<p class="vide">Touchez le cœur d\'un commerce ou d\'une vidéo pour le retrouver ici.</p>';
  });
  HL.ville().then(function(V){
    var favs = HL.sortiesFavorites(), auj = HL.jour();
    var l = (V.agenda || []).filter(function(e){ return favs.indexOf(e.lien) !== -1 && (e.fin || e.debut || auj) >= auj; });
    var box = document.getElementById('favS');
    if (l.length) box.innerHTML = l.map(function(e){ return HL.sortieHtml(e, 'profil'); }).join('');
    else { box.className = ''; box.innerHTML = '<p class="vide">Touchez le cœur d\'une sortie pour la garder ici.</p>'; }
  });
})();
</script>
</body>
</html>
