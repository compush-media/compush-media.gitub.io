<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8206A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fidelavis">
<link rel="manifest" id="mf" href="/la-garenne/manifest.json">
<script>
  /* Fichier d'installation propre au commerce, sur TOUTES les pages : on peut
     ajouter l'appli à l'écran d'accueil depuis n'importe laquelle (souvent
     depuis l'extrait vidéo, sans passer par installer.html). Son start_url
     app.html?first=<slug> rouvre l'appli sur la vidéo du bon commerce.
     Commerce connu par ?s= ou, à défaut, par celui qui a amené l'habitant. */
  (function(){
    var s = (new URLSearchParams(location.search).get('s') || '').toLowerCase().replace(/[^a-z0-9-]/g,'');
    if (!s) { try { var src = JSON.parse(localStorage.getItem('hl_source') || 'null'); s = (src && src.slug || '').replace(/[^a-z0-9-]/g,''); } catch(e) {} }
    if (s) document.getElementById('mf').href = '/la-garenne/manifests/' + s + '.json';
  })();
</script>
<link rel="apple-touch-icon" sizes="180x180" href="/la-garenne/icons/icon-180.png">
<script defer src="https://progressier.app/zb3Ezrlt6Ezd6iN3VpMW/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/la-garenne/hl.css">
<script src="/la-garenne/hl.js"></script>
<title>Commerces – Les Commerces de La Garenne</title>
</head>
<body>
<div id="bar"></div>
<main class="ct">
  <h1 id="titre" style="margin:6px 0 12px">Les commerces</h1>
  <form class="search" id="rech" style="margin-bottom:12px">
    <span aria-hidden="true">🔍</span>
    <input type="search" id="q" placeholder="Rechercher un commerce…" aria-label="Rechercher un commerce">
  </form>
  <div class="chips" id="cats" style="margin-bottom:14px"></div>
  <div class="clist" id="liste"></div>
</main>
<script>
/* Annuaire : recherche, catégories et favoris (?fav=1). */
(function(){
  document.getElementById('bar').innerHTML = HL.brandbar(false);
  var fav = HL.qs('fav') === '1';
  HL.nav(fav ? 'favoris' : 'commerces');
  var cat = HL.qs('cat'), q = HL.qs('q');
  document.getElementById('q').value = q;
  if (fav) document.getElementById('titre').textContent = 'Vos favoris';

  HL.charger().then(function(d){
    var cats = Object.keys(HL.CATEGORIES);   // toutes, même vides (« Bientôt »)
    function norm(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
    function rendre(){
      document.getElementById('cats').innerHTML = ['<button class="chip' + (!cat ? ' on' : '') + '" data-c="">Tous</button>'].concat(cats.map(function(k){
        var m = HL.CATEGORIES[k];
        return '<button class="chip' + (k === cat ? ' on' : '') + '" data-c="' + HL.esc(k) + '">' + HL.esc(m.label) + '</button>';
      })).join('');
      var favs = HL.favoris(), nq = norm(q);
      var liste = d.commerces.filter(function(c){
        if (fav && favs.indexOf(c.slug) === -1) return false;
        if (cat && c.categorie !== cat) return false;
        if (nq && norm(c.nom + ' ' + c.accroche + ' ' + (HL.CATEGORIES[c.categorie]||{}).label).indexOf(nq) === -1) return false;
        return true;
      });
      document.getElementById('liste').innerHTML = liste.length ? liste.map(HL.commerceRowHtml).join('')
        : '<p class="muted">' + (fav ? 'Touchez « Favori » sur la fiche d\'un commerce pour le retrouver ici.'
            : cat && !q ? (HL.CATEGORIES[cat] ? HL.CATEGORIES[cat].label : 'Cette catégorie') + ' : bientôt à La Garenne. Les premières adresses arrivent.'
            : 'Aucun commerce ne correspond.') + '</p>';
    }
    document.getElementById('cats').addEventListener('click', function(e){
      var b = e.target.closest('[data-c]'); if (!b) return; cat = b.getAttribute('data-c'); rendre();
    });
    document.getElementById('rech').addEventListener('submit', function(e){ e.preventDefault(); });
    document.getElementById('q').addEventListener('input', function(){ q = this.value; rendre(); });
    if (q) HL.track('recherche', null, q.slice(0, 40));
    rendre();
  });
})();
</script>
</body>
</html>
