# ──────────────────────────────────────────────────────────────
#  Pilote La Garenne-Colombes : montage automatique des vidéos des commerçants.
#
#  Toutes les 5 minutes : s'il y a un montage en attente (séquences envoyées
#  depuis l'espace commerçant), installe ffmpeg et monte la vidéo avec
#  .github/scripts/hl_montage.py (avec la transcription du plan face caméra,
#  faster-whisper, sur ce serveur). Sinon, s'arrête en quelques secondes.
#  Efface aussi les séquences brutes des montages envoyés ou abandonnés.
#
#  Secret requis (Settings › Secrets and variables › Actions) :
#    SUPABASE_SERVICE_ROLE_KEY   Supabase › Project Settings › API Keys › service_role
#    HEYGEN_API_KEY              vidéos présentées par Anna (déjà utilisé par gen-dm-videos.yml)
#
#  Dépôt public : les journaux sont visibles de tous. Le script n'y écrit
#  que des identifiants de montage, jamais de contenu ni de secret.
# ──────────────────────────────────────────────────────────────
name: Pilote La Garenne · montage vidéo

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write     # pour se relancer quand une longue série n'est pas finie

concurrency:
  group: hl-montage
  cancel-in-progress: false

jobs:
  montage:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Y a-t-il un montage à faire ?
        id: file
        env:
          CLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$CLE" ]; then echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY absent."; exit 1; fi
          n=$(curl -sf -X POST "https://rtdiaeskmyjjwohirhzj.supabase.co/rest/v1/rpc/hl_montage_en_attente" \
                -H "apikey: $CLE" -H "Authorization: Bearer $CLE" -H "Content-Type: application/json" -d '{}' || echo 0)
          echo "en attente : $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            la-garenne/icons

      - name: Installer ffmpeg
        if: steps.file.outputs.n != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Transcription du plan face caméra, sur ce serveur (aucun service extérieur).
      - uses: actions/setup-python@v5
        if: steps.file.outputs.n != '0'
        with:
          python-version: '3.12'
      - name: Modèle de transcription en cache
        if: steps.file.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Installer la transcription
        if: steps.file.outputs.n != '0'
        # En cas d'échec, le montage se fait quand même, sans transcription.
        run: pip install --quiet faster-whisper || echo "::warning::faster-whisper indisponible"

      - name: Monter les vidéos et nettoyer
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Vidéos présentées par Anna (lancées par la ville seulement) : rendu payant.
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          if [ "${{ steps.file.outputs.n }}" = "0" ]; then
            # Rien à monter : seulement le nettoyage des séquences brutes, sans ffmpeg.
            python3 .github/scripts/hl_montage.py --max 0
          else
            # Une série de vidéos Anna peut durer des heures : 5 h de travail au plus, puis relance.
            HL_BUDGET_MIN=300 python3 .github/scripts/hl_montage.py --max 500
          fi

      - name: Relancer s'il reste des montages
        if: always() && steps.file.outputs.n != '0'
        env:
          CLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(curl -sf -X POST "https://rtdiaeskmyjjwohirhzj.supabase.co/rest/v1/rpc/hl_montage_en_attente" \
                -H "apikey: $CLE" -H "Authorization: Bearer $CLE" -H "Content-Type: application/json" -d '{}' || echo 0)
          echo "encore en attente : $n"
          if [ "$n" != "0" ]; then gh workflow run hl-montage.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
