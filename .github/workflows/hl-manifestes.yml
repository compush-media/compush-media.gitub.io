# ──────────────────────────────────────────────────────────────
#  Pilote La Garenne-Colombes : fichiers d'installation par commerce.
#
#  Crée la-garenne/manifests/<slug>.json pour chaque commerce validé par
#  une association (lu dans Supabase, hl_public). Sans ce fichier, l'appli
#  installée depuis le QR code d'un commerce s'ouvre sur l'accueil au lieu
#  de sa vidéo.
#
#  Efface aussi, une fois par jour, les données du pilote arrivées au bout de
#  leur durée de conservation (RGPD) : hl_purge dans Supabase.
#
#  Déclencheurs : toutes les 2 heures, ou Actions → Run workflow.
#  Aucun secret requis (clé publishable, publique par nature).
#  Pas de [skip ci] dans le commit : GitHub Pages doit republier.
# ──────────────────────────────────────────────────────────────
name: Pilote La Garenne · fichiers d'installation

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hl-manifestes
  cancel-in-progress: false

jobs:
  manifestes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Effacer les données arrivées à échéance (une fois par jour)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */2 * * *'
        run: |
          heure=$(date -u +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$heure" != "02" ]; then echo "Pas l'heure (02 h UTC)."; exit 0; fi
          curl -sf -X POST "https://rtdiaeskmyjjwohirhzj.supabase.co/rest/v1/rpc/hl_purge" \
            -H "apikey: sb_publishable_V9jcAKPdqxhupYWxoejARQ_D_AmOpcZ" \
            -H "Authorization: Bearer sb_publishable_V9jcAKPdqxhupYWxoejARQ_D_AmOpcZ" \
            -H "Content-Type: application/json" -d '{}'
          echo

      - name: Générer les fichiers manquants
        run: python3 .github/scripts/hl_manifestes.py

      - name: Publier s'il y a du nouveau
        run: |
          git add la-garenne/manifests
          if git diff --cached --quiet; then echo "Aucun fichier nouveau."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pilote La Garenne : fichiers d'installation des nouveaux commerces"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || true
          done
          echo "::error::Push impossible après 3 essais."
          exit 1
