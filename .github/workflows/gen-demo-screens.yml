# ──────────────────────────────────────────────────────────────
# Sur chaque push qui touche le wallet, la config d'un resto, un logo
# ou un hero :
#   1. Attend que GitHub Pages publie le nouveau contenu (hash check).
#   2. Capture <slug>/demo/screen.png + screen-compte.png (Playwright).
#   3. Régénère mockups/<slug>-iphone.png (Pillow).
#   4. Commit & push tout ce qui a réellement changé.
#
# Boucle évitée via paths-ignore (les chemins du bot) + bot-skip.
# ──────────────────────────────────────────────────────────────
name: Aperçus démo

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/demo/screen.png'         # évite la boucle (commits du bot)
      - '**/demo/screen-compte.png'
      - 'mockups/**'                 # outputs auto, idem
      - 'screenshots/**'             # zone manuelle locale, hors CI
      - 'apps-script/**'             # n'affecte pas le rendu wallet
      - 'data/**'                    # registre / ambassadeurs
      - 'scripts/**'                 # scripts eux-mêmes
      - '.github/**'                 # workflows
      - 'fidelavis-admin/**'         # outils agence
      - 'admin/**'                   # super-admin
  workflow_dispatch:                  # bouton manuel "Run workflow"

permissions:
  contents: write                     # nécessaire pour pousser les PNG

env:
  # opt-in Node 24 (Node 20 sera retiré le 16/09/2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: gen-demo-screens
  cancel-in-progress: true            # un nouveau push annule l'exécution en cours

jobs:
  generate:
    # n'exécute pas la job si le dernier commit vient du bot (ceinture + bretelles)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium + Pillow + polices Story
        run: |
          python -m pip install --upgrade pip
          pip install playwright Pillow
          playwright install --with-deps chromium
          # Polices pour la Story beige (serif + emoji couleur sous Linux)
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu fonts-noto-color-emoji || true

      - name: Attendre que GitHub Pages publie le nouveau contenu
        # Compare le hash de la page démo en ligne avec celui du repo : on ne
        # capture que quand Pages sert vraiment la version de ce commit. Max ~6 min.
        run: |
          target="$(md5sum jolia/demo/index.html | cut -d' ' -f1)"
          echo "Hash attendu pour jolia/demo/index.html : $target"
          for i in $(seq 1 36); do
            live="$(curl -fsSL "https://app.cartefidelavis.com/jolia/demo/index.html?cb=$(date +%s)" 2>/dev/null | md5sum | cut -d' ' -f1 || true)"
            echo "Tentative ${i} → $live"
            if [ "$live" = "$target" ]; then
              echo "✓ Pages publiée pour ce commit"
              sleep 8   # marge CDN
              exit 0
            fi
            sleep 10
          done
          echo "⚠ Pages n'a pas publié ce commit à temps — on tente quand même la capture."

      - name: Capturer les aperçus démo (wallet + Compte)
        run: python3 scripts/gen_demo_screens.py

      - name: Régénérer les mockups iPhone (HD 2×)
        env:
          MOCKUP_HD_SCALE: '2'
        run: python3 scripts/gen_iphone_mockups.py --demo

      - name: Générer les Stories DM beige (statiques, gratuit)
        # Utilise <slug>/demo/screen.png en source (fallback intégré).
        # La vidéo HeyGen reste manuelle (build_dm.sh) pour maîtriser les coûts.
        run: python3 scripts/gen_dm_story.py || echo "⚠ story: certains restos sans screenshot"

      - name: Commit & push si des fichiers ont changé
        run: |
          if git diff --quiet -- '*/demo/screen.png' '*/demo/screen-compte.png' 'mockups/' 'assets/dm-story/'; then
            echo "Aucun fichier modifié — rien à pousser."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*/demo/screen.png' '*/demo/screen-compte.png' 'mockups/' 'assets/dm-story/'
          git commit -m "chore(demo): aperçus + mockups + stories DM auto [skip ci]"
          git push
