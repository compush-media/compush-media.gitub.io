# ──────────────────────────────────────────────────────────────
#  Génère les VIDÉOS DM (style beige) à la demande, pour les restos choisis.
#
#  Pipeline HeyGen-only : avatar sur fond vert → chroma-key + masque
#  circulaire → composité (ffmpeg) dans le cercle blanc du fond beige.
#  Pas de Creatomate. ffmpeg fourni par imageio-ffmpeg (pip).
#
#  Déclencheur :
#    • Bouton « 🎬 Vidéo DM » du dashboard agence (via le proxy GAS)
#    • Onglet Actions → Run workflow (manuel)
#
#  Secret requis (Settings → Secrets → Actions) : HEYGEN_API_KEY
#  ⚠ Consomme des crédits HeyGen → déclenché uniquement sur validation.
# ──────────────────────────────────────────────────────────────
name: Vidéos DM (HeyGen)

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Slugs séparés par espace (vide = tous ceux avec une démo, sans MP4)'
        required: false
        default: ''
      force_regen:
        description: 'Régénérer même si MP4 déjà présent (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: gen-dm-videos
  cancel-in-progress: false   # ne pas annuler — un render consomme des crédits

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier le secret HeyGen
        run: |
          if [ -z "${{ secrets.HEYGEN_API_KEY }}" ]; then
            echo "::error::HEYGEN_API_KEY manquant — Settings → Secrets → Actions."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (Playwright, Pillow, imageio-ffmpeg, polices)
        run: |
          python -m pip install --upgrade pip
          pip install playwright Pillow "imageio[ffmpeg]"
          playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu fonts-noto-color-emoji || true

      - name: Calculer la liste des restos à traiter
        id: pick
        run: |
          set -e
          if [ -n "${{ github.event.inputs.slugs }}" ]; then
            echo "slugs=${{ github.event.inputs.slugs }}" >> "$GITHUB_OUTPUT"
          else
            FORCE='${{ github.event.inputs.force_regen }}'
            S=""
            for d in */; do
              s="${d%/}"
              case "$s" in
                assets|data|fidelavis-admin|admin|apps-script|images|scripts|templates|screenshots|mockups|pipeline|dm_videos|.github|node_modules) continue;;
              esac
              [[ "$s" =~ ^[._] ]] && continue
              [ -f "$s/demo/screen.png" ] || [ -f "screenshots/${s}-wallet.png" ] || continue
              if [ "$FORCE" != "true" ] && [ -f "dm_videos/${s}-dm.mp4" ]; then continue; fi
              S="$S $s"
            done
            echo "slugs=$(echo $S | xargs)" >> "$GITHUB_OUTPUT"
          fi
          echo "→ ${{ steps.pick.outputs.slugs }}"

      - name: Capturer les screenshots manquants (nouveaux restos)
        if: steps.pick.outputs.slugs != ''
        # Pour un resto fraîchement importé, le screenshot n'existe pas encore.
        # On attend que sa page démo soit publiée sur Pages, puis on capture.
        run: |
          set -e
          for s in ${{ steps.pick.outputs.slugs }}; do
            if [ -f "$s/demo/screen.png" ] || [ -f "screenshots/${s}-wallet.png" ]; then
              echo "✓ $s : screenshot déjà présent"
              continue
            fi
            echo "⏳ $s : attente de la page démo sur Pages…"
            for i in $(seq 1 30); do
              if curl -fsSL "https://app.cartefidelavis.com/$s/demo/index.html?cb=$(date +%s)" 2>/dev/null | grep -q '__FV_DEMO__'; then
                echo "  ✓ démo publiée (tentative $i)"; sleep 6; break
              fi
              sleep 10
            done
            python3 scripts/gen_demo_screens.py "$s" || echo "⚠ capture $s échouée"
            MOCKUP_HD_SCALE=2 python3 scripts/gen_iphone_mockups.py --demo "$s" 2>/dev/null || \
              MOCKUP_HD_SCALE=2 python3 scripts/gen_iphone_mockups.py || true
          done

      - name: Générer les fonds vidéo beige
        if: steps.pick.outputs.slugs != ''
        run: python3 scripts/gen_dm_story.py --video-bg ${{ steps.pick.outputs.slugs }}

      - name: Générer les vidéos (HeyGen green + compositing ffmpeg)
        if: steps.pick.outputs.slugs != ''
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: python3 scripts/gen_dm_videos.py --heygen-only ${{ steps.pick.outputs.slugs }}

      - name: Rafraîchir l'export + la file de dispatch
        if: steps.pick.outputs.slugs != ''
        run: |
          python3 scripts/gen_dm_queue.py || true
          python3 scripts/export_demos.py || true

      - name: Commit & push (avec rebase + retry anti-collision)
        run: |
          if git diff --quiet -- 'dm_videos/' 'assets/dm-bg/'; then
            echo "Rien à committer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'dm_videos/' 'assets/dm-bg/'
          git commit -m "chore(dm): vidéos DM générées (validation manuelle) [skip ci]"
          # Le remote peut avoir bougé pendant le render → rebase + retry
          for i in 1 2 3 4 5; do
            if git push; then echo "✓ poussé"; exit 0; fi
            echo "push rejeté (tentative $i) → pull --rebase"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "::error::push impossible après 5 tentatives"; exit 1
