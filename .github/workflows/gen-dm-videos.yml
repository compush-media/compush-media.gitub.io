# ──────────────────────────────────────────────────────────────
#  Génère les VIDÉOS DM (style beige) à la demande, pour les restos choisis.
#
#  Pipeline HeyGen-only : avatar sur fond vert → chroma-key + masque
#  circulaire → composité (ffmpeg) dans le cercle blanc du fond beige.
#  Pas de Creatomate. ffmpeg fourni par imageio-ffmpeg (pip).
#
#  Déclencheur :
#    • Bouton « 🎬 Vidéo DM » du dashboard agence (via le proxy GAS)
#    • Onglet Actions → Run workflow (manuel)
#
#  Secret requis (Settings → Secrets → Actions) : HEYGEN_API_KEY
#  ⚠ Consomme des crédits HeyGen → déclenché uniquement sur validation.
# ──────────────────────────────────────────────────────────────
name: Vidéos DM (HeyGen)

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Slugs séparés par espace (vide = tous ceux avec une démo, sans MP4)'
        required: false
        default: ''
      force_regen:
        description: 'Régénérer même si MP4 déjà présent (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: gen-dm-videos
  cancel-in-progress: false   # ne pas annuler — un render consomme des crédits

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # large : permet un gros batch (jusqu'à ~100 restos)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier le secret HeyGen
        run: |
          if [ -z "${{ secrets.HEYGEN_API_KEY }}" ]; then
            echo "::error::HEYGEN_API_KEY manquant — Settings → Secrets → Actions."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (Playwright, Pillow, imageio-ffmpeg, polices)
        run: |
          python -m pip install --upgrade pip
          pip install playwright Pillow "imageio[ffmpeg]"
          playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu fonts-noto-color-emoji || true

      - name: Calculer la liste des restos à traiter
        id: pick
        run: |
          set -e
          if [ -n "${{ github.event.inputs.slugs }}" ]; then
            echo "slugs=${{ github.event.inputs.slugs }}" >> "$GITHUB_OUTPUT"
          else
            FORCE='${{ github.event.inputs.force_regen }}'
            S=""
            for d in */; do
              s="${d%/}"
              case "$s" in
                assets|data|fidelavis-admin|admin|apps-script|images|scripts|templates|screenshots|mockups|pipeline|dm_videos|.github|node_modules) continue;;
              esac
              [[ "$s" =~ ^[._] ]] && continue
              [ -f "$s/demo/screen.png" ] || [ -f "screenshots/${s}-wallet.png" ] || continue
              if [ "$FORCE" != "true" ] && [ -f "dm_videos/${s}-dm.mp4" ]; then continue; fi
              S="$S $s"
            done
            echo "slugs=$(echo $S | xargs)" >> "$GITHUB_OUTPUT"
          fi
          echo "→ ${{ steps.pick.outputs.slugs }}"

      - name: Générer les vidéos resto par resto (commit après chacun)
        if: steps.pick.outputs.slugs != ''
        # Boucle scalable (jusqu'à ~100 restos) : pour chaque resto, capture le
        # screenshot si absent, génère fond + vidéo, puis COMMIT immédiatement.
        # Ainsi un échec/timeout ne perd que le resto en cours ; un re-déclenchement
        # reprend là où ça s'est arrêté (les restos avec MP4 sont déjà skippés).
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0; ko=0
          for s in ${{ steps.pick.outputs.slugs }}; do
            echo "════════ $s ════════"
            # 1. Screenshot si absent (resto fraîchement importé)
            if [ ! -f "$s/demo/screen.png" ] && [ ! -f "screenshots/${s}-wallet.png" ]; then
              echo "⏳ attente page démo sur Pages…"
              for i in $(seq 1 24); do
                curl -fsSL "https://app.cartefidelavis.com/$s/demo/index.html?cb=$(date +%s)" 2>/dev/null | grep -q '__FV_DEMO__' && { sleep 5; break; }
                sleep 10
              done
              python3 scripts/gen_demo_screens.py "$s" || { echo "⚠ capture $s échouée"; ko=$((ko+1)); continue; }
            fi
            # 2. Fond + vidéo
            if ! python3 scripts/gen_dm_story.py --video-bg "$s"; then echo "⚠ fond $s"; ko=$((ko+1)); continue; fi
            if ! python3 scripts/gen_dm_videos.py --heygen-only "$s"; then echo "⚠ vidéo $s"; ko=$((ko+1)); continue; fi
            # 3. Commit immédiat de CE resto (push avec rebase + retry)
            git add "dm_videos/${s}-dm.mp4" "dm_videos/${s}_scenes" "assets/dm-bg/${s}-bg.png" 2>/dev/null || true
            if git diff --cached --quiet; then echo "rien pour $s"; continue; fi
            git commit -m "chore(dm): vidéo $s [skip ci]" >/dev/null
            for i in 1 2 3 4 5; do
              git push && break
              git pull --rebase --autostash origin main || true
              sleep 3
            done
            ok=$((ok+1))
            echo "✓ $s poussé ($ok ok / $ko ko)"
          done
          echo "── Bilan : $ok vidéos, $ko échecs ──"

      - name: Rafraîchir l'export + la file de dispatch
        if: steps.pick.outputs.slugs != ''
        run: |
          python3 scripts/gen_dm_queue.py || true
          python3 scripts/export_demos.py || true
          git add dm_videos/dispatch_queue.* dm_videos/restaurants_demo.* 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "chore(dm): export rafraîchi [skip ci]" >/dev/null
            for i in 1 2 3 4 5; do git push && break; git pull --rebase --autostash origin main || true; sleep 3; done
          }
