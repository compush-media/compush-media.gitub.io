<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1F7A55" />
    <title>Fidelavis Agent</title>
    <script>
      // Sur iPhone, l'icône de l'écran d'accueil reprend l'adresse de la page : son manifeste n'a donc
      // pas d'adresse de départ fixe (voir preparerInstallation). Ailleurs, le manifeste habituel.
      (function () {
        var lien = document.createElement("link");
        lien.rel = "manifest";
        lien.href = /iphone|ipad|ipod/i.test(navigator.userAgent)
          ? "/agent/manifest-iphone.webmanifest"
          : "/agent/manifest.webmanifest";
        document.head.appendChild(lien);
      })();
    </script>
    <link rel="icon" href="/agent/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/agent/icons/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fidelavis" />
    <style>
      :root {
        --fond: #F5F5F3;
        --carte: #FFFFFF;
        --encre: #17201B;
        --texte: #33403A;
        --doux: #5F6B65;
        --trait: #E7E7E3;
        --vert: #1F7A55;
        --vert-clair: #E3F1EA;
        --orange: #A8521C;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--fond);
        color: var(--texte);
        font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        /* Marge basse : les barres flottantes des navigateurs (Chrome sur iPhone) ne cachent rien. */
        padding: max(24px, env(safe-area-inset-top)) 20px calc(140px + env(safe-area-inset-bottom));
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 20px;
      }
      .date {
        color: var(--doux);
        margin: 0;
      }
      h1 {
        color: var(--encre);
        font-size: 30px;
        line-height: 1.15;
        margin: 2px 0 0;
      }
      .marque {
        background: var(--vert-clair);
        color: var(--vert);
        font-weight: 700;
        font-size: 15px;
        border-radius: 999px;
        padding: 6px 14px;
        white-space: nowrap;
      }
      .carte {
        background: var(--carte);
        border-radius: 22px;
        padding: 22px;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(23, 32, 27, 0.05);
      }
      .etiquette {
        color: var(--vert);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin: 0 0 8px;
      }
      h2 {
        color: var(--encre);
        font-size: 24px;
        line-height: 1.2;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 10px;
      }
      .doux {
        color: var(--doux);
      }
      .position {
        color: var(--encre);
        font-size: 24px;
        font-weight: 800;
        margin: 2px 0 6px;
      }
      ol {
        margin: 0;
        padding-left: 22px;
      }
      li {
        margin-bottom: 6px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 6px 0;
      }
      input[type="email"],
      input.code {
        width: 100%;
        font: inherit;
        padding: 14px;
        border: 1px solid var(--trait);
        border-radius: 12px;
        margin-bottom: 12px;
      }
      .bouton {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 16px;
        background: var(--vert);
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 16px;
        cursor: pointer;
      }
      .bouton[disabled] {
        opacity: 0.6;
      }
      .lien {
        background: none;
        border: 0;
        color: var(--doux);
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
        padding: 0;
      }
      input.code {
        font-size: 28px;
        letter-spacing: 8px;
        text-align: center;
      }
      .erreur {
        color: var(--orange);
      }
      .succes {
        color: var(--vert);
        font-weight: 600;
      }
      .pied {
        text-align: center;
        margin-top: 24px;
      }
      .duree {
        color: var(--doux);
        font-weight: 400;
        letter-spacing: 0;
        text-transform: none;
      }
      .action h2 {
        font-size: 28px;
      }
      .coches {
        list-style: none;
        padding: 0;
        margin: 4px 0 16px;
      }
      .coches li {
        display: flex;
        gap: 12px;
      }
      .coches li::before {
        content: "✓";
        color: var(--vert);
        font-weight: 700;
      }
      .avis-cite {
        border-left: 3px solid var(--vert-clair);
        padding-left: 12px;
        margin: 4px 0 14px;
      }
      textarea.contenu {
        width: 100%;
        min-height: 150px;
        font: inherit;
        font-size: 16px;
        padding: 14px;
        border: 1px solid var(--trait);
        border-radius: 12px;
        margin: 4px 0 12px;
        resize: vertical;
      }
      a.bouton {
        text-align: center;
        text-decoration: none;
        box-sizing: border-box;
      }
      .bouton + .bouton {
        margin-top: 10px;
      }
      .bouton.secondaire {
        background: var(--carte);
        color: var(--encre);
        border: 1px solid var(--trait);
      }
      .deux .bouton {
        margin-top: 0;
      }
      .deux {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      .semaine-titre {
        display: flex;
        justify-content: space-between;
        color: var(--encre);
        font-weight: 700;
        margin: 22px 4px 10px;
      }
      .semaine-titre span {
        color: var(--doux);
        font-weight: 400;
      }
      .semaine {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        text-align: center;
        color: var(--doux);
        font-size: 14px;
        margin-bottom: 22px;
      }
      .semaine .case {
        aspect-ratio: 1;
        border-radius: 12px;
        background: var(--trait);
        margin-bottom: 4px;
        box-sizing: border-box;
      }
      .semaine .faite {
        background: var(--vert);
      }
      .semaine .aujourdhui {
        background: var(--carte);
        border: 2px solid var(--vert);
      }
      .semaine .repos {
        background: none;
        border: 2px dashed var(--trait);
      }
      .semaine .jour-courant {
        color: var(--encre);
        font-weight: 700;
      }
      .bascule {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: var(--trait);
        border-radius: 999px;
        padding: 4px;
        margin: 4px 0 16px;
      }
      .bascule button {
        border: 0;
        background: none;
        font: inherit;
        font-weight: 600;
        padding: 10px;
        border-radius: 999px;
        color: var(--doux);
        cursor: pointer;
      }
      .bascule button[aria-pressed="true"] {
        background: var(--carte);
        color: var(--encre);
      }
      .formule.conseillee {
        outline: 2px solid var(--vert);
      }
      .prix {
        color: var(--encre);
        font-size: 28px;
        font-weight: 800;
        margin: 0;
      }
      .formule ul {
        margin: 10px 0 16px;
      }
    </style>
  </head>
  <body>
    <main id="espace">
      <p class="doux">Chargement…</p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
    <script>
      "use strict";
      // Espace du commerçant Fidelavis Agent. Connexion sans mot de passe : l'e-mail porte un lien et un
      // code à usage unique, vérifiés ici. Le commerçant ne lit que sa propre fiche (règle RLS).
      const SUPABASE_URL = "https://rtdiaeskmyjjwohirhzj.supabase.co";
      // Clé publique (publishable) : faite pour être dans une page, les droits sont tenus par RLS.
      const SUPABASE_CLE = "sb_publishable_V9jcAKPdqxhupYWxoejARQ_D_AmOpcZ";
      const ADRESSE_AGENT = `${SUPABASE_URL}/functions/v1/agent`;
      // Clé publique des notifications (VAPID) : elle identifie Fidelavis auprès d'Apple et Google.
      const CLE_NOTIFICATIONS =
        "BKdYVmcJy3fASYOQyzNhH5rAs3Lf5Cy9wIPcPOiUt80qmBptcOwsx4zjAnHlc299SbVG0O5d3vv4Z7awAR0vLho";

      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_CLE, {
        auth: { persistSession: true, detectSessionInUrl: false, storageKey: "fidelavis-agent" },
      });
      const zone = document.getElementById("espace");
      // replaceChildren écrirait « null » en toutes lettres : les blocs absents sont retirés avant.
      const afficher = (...blocs) => zone.replaceChildren(...blocs.filter(Boolean));
      const IPHONE = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const INSTALLE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

      function el(balise, attributs, ...enfants) {
        const noeud = document.createElement(balise);
        for (const [nom, valeur] of Object.entries(attributs ?? {})) {
          if (valeur !== null && valeur !== undefined && valeur !== false) {
            noeud.setAttribute(nom, valeur === true ? "" : valeur);
          }
        }
        for (const enfant of enfants.flat(Infinity)) {
          if (enfant === null || enfant === undefined || enfant === false) continue;
          noeud.append(typeof enfant === "string" ? document.createTextNode(enfant) : enfant);
        }
        return noeud;
      }

      const jour = (date, options) =>
        new Date(date).toLocaleDateString("fr-FR", options ?? { day: "numeric", month: "long" });
      const rang = (n) => (n === 1 ? "1re" : `${n}e`);
      const majuscule = (prenom) =>
        prenom.toLocaleLowerCase("fr").replace(/(^|[\s-])(\p{L})/gu, (_, sep, l) => sep + l.toLocaleUpperCase("fr"));

      function entete(prenom) {
        const aujourdhui = jour(new Date(), { weekday: "long", day: "numeric", month: "long" });
        return el(
          "header",
          {},
          el(
            "div",
            {},
            el("p", { class: "date" }, aujourdhui.charAt(0).toUpperCase() + aujourdhui.slice(1)),
            el("h1", {}, prenom ? `Bonjour ${majuscule(prenom)}` : "Bonjour"),
          ),
          el("span", { class: "marque" }, "Fidelavis"),
        );
      }

      // Sans session : on demande l'adresse de l'essai, un e-mail part avec un lien et un code.
      // Le code est indispensable sur iPhone : l'application ajoutée à l'écran d'accueil ne partage pas
      // la connexion du navigateur, et un lien reçu par e-mail s'ouvre toujours dans le navigateur.
      const ADRESSE_VALIDE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

      function connexion(message, emailConnu) {
        const erreur = el("p", { class: "erreur", hidden: !message }, message ?? "");
        const champ = el("input", {
          id: "email",
          type: "email",
          autocomplete: "email",
          required: true,
          placeholder: "vous@exemple.fr",
          value: emailConnu ?? null,
        });
        const bouton = el("button", { class: "bouton", type: "submit" }, "Recevoir mon code");
        const dejaUnCode = el("button", { class: "lien", type: "button" }, "J'ai déjà un code");
        const form = el(
          "form",
          { class: "carte", novalidate: true },
          el("p", { class: "etiquette" }, "Votre espace"),
          el("h2", {}, "Connexion"),
          el(
            "p",
            { class: "doux" },
            "Indiquez l'adresse e-mail de votre essai : nous vous envoyons un code de connexion, sans mot de passe.",
          ),
          el("label", { for: "email" }, "E-mail"),
          champ,
          bouton,
          erreur,
          el("p", { class: "pied" }, dejaUnCode),
        );
        const adresse = () => {
          const email = champ.value.trim();
          if (ADRESSE_VALIDE.test(email)) return email;
          erreur.textContent = "Vérifiez votre adresse e-mail.";
          erreur.hidden = false;
          return null;
        };
        dejaUnCode.addEventListener("click", () => {
          const email = adresse();
          if (email) saisieDuCode(email, false);
        });
        form.addEventListener("submit", async (evenement) => {
          evenement.preventDefault();
          const email = adresse();
          if (!email) return;
          bouton.disabled = true;
          bouton.textContent = "Envoi en cours…";
          if (await demanderCode(email)) {
            saisieDuCode(email, true);
            return;
          }
          bouton.disabled = false;
          bouton.textContent = "Recevoir mon code";
          erreur.textContent = "L'envoi n'a pas abouti. Réessayez dans un instant.";
          erreur.hidden = false;
        });
        afficher(entete(null), form);
      }

      async function demanderCode(email) {
        try {
          const reponse = await fetch(ADRESSE_AGENT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "lien", email }),
          });
          return reponse.ok;
        } catch {
          return false;
        }
      }

      function saisieDuCode(email, envoye) {
        const erreur = el("p", { class: "erreur", hidden: true });
        const champ = el("input", {
          id: "code",
          type: "text",
          inputmode: "numeric",
          autocomplete: "one-time-code",
          pattern: "[0-9]*",
          maxlength: "10",
          required: true,
          placeholder: "Code reçu par e-mail",
          class: "code",
        });
        const bouton = el("button", { class: "bouton", type: "submit" }, "Se connecter");
        const renvoyer = el("button", { class: "lien", type: "button" }, "Renvoyer un code");
        const autreAdresse = el("button", { class: "lien", type: "button" }, "Changer d'adresse");
        const form = el(
          "form",
          { class: "carte", novalidate: true },
          el("p", { class: "etiquette" }, "Votre espace"),
          el("h2", {}, "Entrez votre code"),
          el(
            "p",
            { class: envoye ? "succes" : "doux" },
            envoye
              ? `Si ${email} a un essai en cours, un e-mail avec votre code vient de partir. Il est valable une heure.`
              : `Entrez le code reçu par e-mail à ${email}.`,
          ),
          el("label", { for: "code" }, "Code"),
          champ,
          bouton,
          erreur,
          el("p", { class: "pied" }, renvoyer, " · ", autreAdresse),
        );
        renvoyer.addEventListener("click", async () => {
          renvoyer.disabled = true;
          const ok = await demanderCode(email);
          erreur.textContent = ok
            ? "Un nouveau code vient de partir (au plus un par minute)."
            : "L'envoi n'a pas abouti. Réessayez dans un instant.";
          erreur.className = ok ? "succes" : "erreur";
          erreur.hidden = false;
          renvoyer.disabled = false;
        });
        autreAdresse.addEventListener("click", () => connexion(null, email));
        form.addEventListener("submit", async (evenement) => {
          evenement.preventDefault();
          const code = champ.value.replace(/\D/g, "");
          if (code.length < 6) {
            erreur.textContent = "Vérifiez le code reçu par e-mail.";
            erreur.className = "erreur";
            erreur.hidden = false;
            return;
          }
          bouton.disabled = true;
          bouton.textContent = "Connexion…";
          const { data, error } = await db.auth.verifyOtp({ email, token: code, type: "email" });
          if (error || !data.session) {
            bouton.disabled = false;
            bouton.textContent = "Se connecter";
            erreur.textContent =
              "Ce code ne fonctionne pas : il a peut-être expiré ou déjà servi. Demandez-en un nouveau.";
            erreur.className = "erreur";
            erreur.hidden = false;
            return;
          }
          await afficherEspace(data.session);
        });
        afficher(entete(null), form);
        champ.focus();
      }

      // Guide d'installation : l'espace doit être sur l'écran d'accueil pour recevoir l'Action du jour.
      // Android propose l'installation quand il le juge possible : le bouton n'apparaît qu'à ce moment-là.
      let invitationAndroid = null;
      addEventListener("beforeinstallprompt", (evenement) => {
        evenement.preventDefault();
        invitationAndroid = evenement;
        document.getElementById("installer")?.removeAttribute("hidden");
      });
      function installation() {
        if (INSTALLE) return null;
        const ua = navigator.userAgent;
        const iphone = IPHONE;
        const derniere = IPHONE
          ? "Ouvrez Fidelavis Agent depuis votre écran d'accueil : vous êtes connecté directement. S'il vous demande un code, touchez « Recevoir mon code »."
          : "Ouvrez Fidelavis Agent depuis votre écran d'accueil : vous êtes connecté directement.";
        const ecranAccueil =
          "Touchez ••• « En voir plus » si besoin, puis « Sur l'écran d'accueil ».";
        let etapes;
        if (iphone && /CriOS|EdgiOS|FxiOS/.test(ua)) {
          // Chrome, Edge et Firefox sur iPhone ajoutent à l'écran d'accueil depuis leur bouton Partager.
          etapes = [
            "Touchez le bouton Partager (le carré avec une flèche), à droite de la barre d'adresse.",
            ecranAccueil,
            "Touchez « Ajouter ».",
            derniere,
          ];
        } else if (iphone && /Safari\//.test(ua) && !/GSA\/|FBAN|FBAV|Instagram/.test(ua)) {
          etapes = [
            "Touchez le bouton Partager (le carré avec une flèche), en bas de l'écran.",
            ecranAccueil,
            "Touchez « Ajouter ».",
            derniere,
          ];
        } else if (iphone) {
          // Navigateur intégré à une application (Google, Gmail, Facebook…) : il faut passer par Safari.
          etapes = [
            "Ouvrez cette page dans Safari : touchez ••• ou le bouton Partager, puis « Ouvrir dans Safari ».",
            `Dans Safari, touchez Partager. ${ecranAccueil}`,
            derniere,
          ];
        } else {
          etapes = [
            "Touchez le menu ⋮ de votre navigateur.",
            "Choisissez « Installer l'application » ou « Ajouter à l'écran d'accueil ».",
            derniere,
          ];
        }
        const bouton = !iphone
          ? el(
            "button",
            { id: "installer", class: "bouton", type: "button", hidden: !invitationAndroid },
            "Installer Fidelavis Agent",
          )
          : null;
        bouton?.addEventListener("click", async () => {
          if (!invitationAndroid) return;
          invitationAndroid.prompt();
          await invitationAndroid.userChoice;
          invitationAndroid = null;
          bouton.hidden = true;
        });
        return el(
          "section",
          { class: "carte" },
          el("p", { class: "etiquette" }, "À faire une fois"),
          el("h2", {}, "Ajoutez Fidelavis Agent à votre écran d'accueil"),
          el(
            "p",
            { class: "doux" },
            "Vous retrouverez votre Action du jour en un geste, comme une application.",
          ),
          el("ol", {}, etapes.map((etape) => el("li", {}, etape))),
          // Chrome sur iPhone n'affiche pas la fin de l'adresse : on dit clairement si l'accès est prêt.
          accesPret()
            ? el("p", { class: "succes" }, "✓ Votre accès est prêt : l'application s'ouvrira connectée.")
            : null,
          bouton,
        );
      }

      // Sur iPhone, l'application ajoutée à l'écran d'accueil ne partage pas la connexion du navigateur.
      // Avant l'ajout, la page se recharge à une adresse qui porte un accès à usage unique : l'icône
      // reprend cette adresse, et l'application installée s'en sert à sa première ouverture, sans code.
      // L'accès vaut une heure ; au-delà de 50 minutes, il est renouvelé. Sur Android, la connexion est
      // déjà partagée avec le navigateur.
      const ACCES_FRAIS_MS = 50 * 60 * 1000;
      const accesPret = () => {
        const parametres = new URLSearchParams(location.search);
        return IPHONE && Boolean(parametres.get("installation")) &&
          Date.now() - Number(parametres.get("le")) < ACCES_FRAIS_MS;
      };
      async function preparerInstallation(session) {
        if (!IPHONE || INSTALLE) return;
        if (accesPret()) return;
        try {
          const reponse = await fetch(ADRESSE_AGENT, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${session.access_token}`,
            },
            body: JSON.stringify({ action: "installation" }),
          });
          if (!reponse.ok) return;
          const { token_hash: jeton } = await reponse.json();
          if (!jeton) return;
          location.replace(`/agent/?installation=${encodeURIComponent(jeton)}&le=${Date.now()}`);
        } catch {
          // Sans accès préparé, l'application installée demandera un code : rien de bloquant.
        }
      }

      function positionDeDepart(depart) {
        if (!depart?.mot_cle) return null;
        const autres = (depart.autres_positions ?? []).map((a) =>
          el(
            "p",
            { class: "doux" },
            `Sur « ${a.mot_cle} » tout court : ${
              a.position === null ? `au-delà des ${a.profondeur} premiers` : rang(a.position)
            }.`,
          )
        );
        return el(
          "section",
          { class: "carte" },
          el("p", { class: "doux" }, `« ${depart.mot_cle} » sur Google Maps`),
          el(
            "p",
            { class: "position" },
            depart.position === null
              ? "Hors des résultats relevés"
              : `Vous êtes ${rang(depart.position)}`,
          ),
          autres,
          depart.releve_le
            ? el("p", { class: "doux" }, `Point de départ relevé le ${jour(depart.releve_le)}.`)
            : null,
        );
      }

      // --- Action du jour ---------------------------------------------------------------------------
      // Préparée chaque matin par Fidelavis. Le commerçant la fait lui-même sur sa fiche Google (copier,
      // ouvrir la fiche, coller) : rien n'est publié sans lui. « Déjà fait » sera vérifié demain sur sa
      // fiche publique.
      const jourDeParis = (date) =>
        new Intl.DateTimeFormat("fr-CA", { timeZone: "Europe/Paris" }).format(date);
      const ficheGoogle = (commercant) =>
        `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(commercant.nom_fiche)}&query_place_id=${encodeURIComponent(commercant.place_id)}`;
      // Types qu'un relevé public peut confirmer (photos, réponse sous l'avis, nouveaux avis).
      const VERIFIABLES = ["photo", "video", "reponse_avis", "demande_avis"];
      const etoiles = (note) => (note ? "★".repeat(Math.round(note)) : "");

      function lundiDeLaSemaine(aujourdhui) {
        const date = new Date(`${aujourdhui}T12:00:00Z`);
        const decalage = (date.getUTCDay() + 6) % 7;
        date.setUTCDate(date.getUTCDate() - decalage);
        return date.toISOString().slice(0, 10);
      }

      function boutonCopier(zoneTexte, libelle, secondaire) {
        const bouton = el(
          "button",
          { class: secondaire ? "bouton secondaire" : "bouton", type: "button" },
          libelle,
        );
        bouton.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(zoneTexte.value);
          } catch {
            zoneTexte.select();
            document.execCommand("copy");
          }
          bouton.textContent = "Texte copié ✓";
          setTimeout(() => (bouton.textContent = libelle), 2500);
        });
        return bouton;
      }

      function boutonsPrincipaux(action, commercant, zoneTexte) {
        const ouvrir = (principal) =>
          el(
            "a",
            {
              class: principal ? "bouton" : "bouton secondaire",
              href: ficheGoogle(commercant),
              target: "_blank",
              rel: "noopener",
            },
            "Ouvrir ma fiche Google",
          );
        if (action.type === "demande_avis" && zoneTexte) {
          const sms = el("a", { class: "bouton", href: "#" }, "Envoyer par SMS");
          sms.addEventListener("click", (evenement) => {
            evenement.preventDefault();
            location.href = `sms:${IPHONE ? "&" : "?"}body=${encodeURIComponent(zoneTexte.value)}`;
          });
          return [sms, boutonCopier(zoneTexte, "Copier le message", true)];
        }
        if (zoneTexte) return [boutonCopier(zoneTexte, "Copier le texte"), ouvrir(false)];
        return [ouvrir(true)];
      }

      function carteAction(action, avis, commercant, surRetour) {
        if (!action) {
          return el(
            "section",
            { class: "carte action" },
            el("p", { class: "etiquette" }, "Action du jour"),
            el("h2", {}, "Rien à faire aujourd'hui"),
            el("p", { class: "doux" }, "Votre prochaine Action du jour arrivera un matin de la semaine, ici."),
          );
        }
        if (action.statut === "faite") {
          return el(
            "section",
            { class: "carte action" },
            el("p", { class: "etiquette" }, "Action du jour"),
            el("h2", {}, action.verifiee_le ? "Vérifié sur votre fiche ✓" : "C'est noté, merci"),
            el("p", {}, action.titre),
            action.verifiee_le
              ? el("p", { class: "succes" }, "Votre fiche Google publique le montre déjà.")
              : VERIFIABLES.includes(action.type)
              ? el("p", { class: "doux" }, "Nous le vérifierons sur votre fiche Google publique dans les prochains jours.")
              : null,
          );
        }
        const zoneTexte = action.contenu_propose
          ? el("textarea", { class: "contenu", "aria-label": "Texte proposé, modifiable" })
          : null;
        if (zoneTexte) zoneTexte.value = action.contenu_propose;
        const dejaFait = el("button", { class: "bouton secondaire", type: "button" }, "Déjà fait");
        const plusTard = el("button", { class: "bouton secondaire", type: "button" }, "Plus tard");
        const retour = async (choix, bouton) => {
          bouton.disabled = true;
          const { error } = await db.rpc("agent_retour_action", { action_id: action.id, choix });
          bouton.disabled = false;
          if (!error) surRetour(choix);
        };
        dejaFait.addEventListener("click", () => retour("faite", dejaFait));
        plusTard.addEventListener("click", () => retour("reportee", plusTard));
        return el(
          "section",
          { class: "carte action" },
          el("p", { class: "etiquette" }, "Action du jour ", el("span", { class: "duree" }, "· 2 min")),
          el("h2", {}, action.titre),
          el("p", {}, action.message),
          action.type === "photo"
            ? el(
              "ul",
              { class: "coches" },
              el("li", {}, "Avant ou après l'intervention"),
              el("li", {}, "Bien éclairée, sans client ni adresse visible"),
            )
            : null,
          avis
            ? el(
              "div",
              { class: "avis-cite" },
              el("p", {}, `${etoiles(avis.note)} ${avis.auteur_prenom ?? "Un client"}`),
              avis.texte ? el("p", { class: "doux" }, `« ${avis.texte} »`) : null,
            )
            : null,
          zoneTexte,
          boutonsPrincipaux(action, commercant, zoneTexte),
          action.statut === "reportee"
            ? el("p", { class: "doux pied" }, "Gardée pour plus tard : elle reste ici aujourd'hui.")
            : null,
          el("div", { class: "deux" }, dejaFait, action.statut === "reportee" ? null : plusTard),
        );
      }

      function semaine(actions, aujourdhui) {
        const lundi = lundiDeLaSemaine(aujourdhui);
        const lettres = ["L", "M", "M", "J", "V", "S", "D"];
        const parJour = new Map(actions.map((a) => [a.date, a]));
        const cases = lettres.map((lettre, i) => {
          const date = new Date(`${lundi}T12:00:00Z`);
          date.setUTCDate(date.getUTCDate() + i);
          const iso = date.toISOString().slice(0, 10);
          const classe = parJour.get(iso)?.statut === "faite"
            ? "faite"
            : iso === aujourdhui
            ? "aujourdhui"
            : i === 6
            ? "repos"
            : "";
          return el(
            "div",
            { class: iso === aujourdhui ? "jour-courant" : null },
            el("div", { class: `case ${classe}` }),
            lettre,
          );
        });
        const faites = actions.filter((a) => a.statut === "faite").length;
        return [
          el(
            "div",
            { class: "semaine-titre" },
            "Cette semaine",
            el("span", {}, `${faites} action${faites > 1 ? "s" : ""} sur ${actions.length}`),
          ),
          el("div", { class: "semaine" }, cases),
        ];
      }

      function positionSuivie(releve, commercant) {
        if (!releve || !commercant.mot_cle_suivi) return positionDeDepart(commercant.depart);
        return el(
          "section",
          { class: "carte" },
          el("p", { class: "doux" }, `« ${commercant.mot_cle_suivi} » sur Google Maps`),
          el(
            "p",
            { class: "position" },
            releve.position === null ? "Hors des résultats relevés" : `Vous êtes ${rang(releve.position)}`,
          ),
          el("p", { class: "doux" }, `Relevé le ${jour(releve.date)}.`),
        );
      }

      // --- Notifications ------------------------------------------------------------------------------
      // Sur iPhone, elles ne marchent que dans l'application ajoutée à l'écran d'accueil. Sans elles,
      // l'Action du jour arrive par e-mail.
      const NOTIFICATIONS_POSSIBLES = "serviceWorker" in navigator && "PushManager" in window &&
        "Notification" in window && (INSTALLE || !IPHONE);

      function octetsDeBase64(texte) {
        const base64 = (texte + "=".repeat((4 - (texte.length % 4)) % 4))
          .replace(/-/g, "+").replace(/_/g, "/");
        return Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
      }

      async function abonner() {
        const enregistrement = await navigator.serviceWorker.ready;
        const abonnement = await enregistrement.pushManager.getSubscription() ??
          await enregistrement.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: octetsDeBase64(CLE_NOTIFICATIONS),
          });
        const { error } = await db.rpc("agent_enregistrer_notifications", {
          abonnement: abonnement.toJSON(),
        });
        if (error) throw error;
      }

      function blocNotifications(dejaAbonne) {
        if (!NOTIFICATIONS_POSSIBLES) return null;
        if (Notification.permission === "granted") {
          // Le téléphone peut renouveler son abonnement : on le réenregistre à chaque ouverture.
          abonner().catch(() => {});
          return dejaAbonne
            ? el("p", { class: "doux pied" }, "Notifications activées : votre action arrive chaque matin.")
            : null;
        }
        if (Notification.permission === "denied") {
          return el(
            "p",
            { class: "doux pied" },
            "Notifications bloquées sur ce téléphone : votre Action du jour arrive par e-mail.",
          );
        }
        const bouton = el("button", { class: "bouton", type: "button" }, "Recevoir mon action chaque matin");
        const message = el("p", { class: "doux" }, "Une notification par jour au plus, à 8 h, et un rappel à 18 h si besoin.");
        const bloc = el(
          "section",
          { class: "carte" },
          el("p", { class: "etiquette" }, "Notifications"),
          message,
          bouton,
        );
        bouton.addEventListener("click", async () => {
          bouton.disabled = true;
          try {
            if ((await Notification.requestPermission()) !== "granted") {
              message.textContent = "D'accord : votre Action du jour arrivera par e-mail.";
              bouton.hidden = true;
              return;
            }
            await abonner();
            bloc.replaceChildren(
              el("p", { class: "etiquette" }, "Notifications"),
              el("p", { class: "succes" }, "C'est activé : votre action arrivera chaque matin."),
            );
          } catch {
            message.textContent = "L'activation n'a pas marché. Réessayez dans un instant.";
            bouton.disabled = false;
          }
        });
        return bloc;
      }

      // --- Fin de l'essai : bilan et formules -----------------------------------------------------------
      // Le bilan affiché est celui qui a été envoyé, tel quel : uniquement des valeurs relevées.
      function lignesDuBilan(bilan) {
        const lignes = [];
        if (bilan.depart?.position && bilan.actuel?.position) {
          lignes.push(`Sur « ${bilan.mot_cle} » : ${rang(bilan.depart.position)} au départ, ${rang(bilan.actuel.position)} au dernier relevé.`);
        }
        if (bilan.avis_gagnes !== null && bilan.avis_gagnes !== undefined) {
          lignes.push(bilan.avis_gagnes > 0
            ? `${bilan.avis_gagnes} ${bilan.avis_gagnes > 1 ? "nouveaux avis" : "nouvel avis"} sur votre fiche depuis le début.`
            : "Pas encore de nouvel avis sur votre fiche depuis le début.");
        }
        if (bilan.actions_proposees > 0) {
          const s = (n) => (n > 1 ? "s" : "");
          lignes.push(bilan.actions_faites === 0
            ? `${bilan.actions_proposees} action${s(bilan.actions_proposees)} proposée${s(bilan.actions_proposees)}, pas encore faite${s(bilan.actions_proposees)}.`
            : `${bilan.actions_faites} action${s(bilan.actions_faites)} faite${s(bilan.actions_faites)} sur ${bilan.actions_proposees}` +
              (bilan.actions_verifiees > 0 ? `, dont ${bilan.actions_verifiees} vérifiée${s(bilan.actions_verifiees)} sur votre fiche publique.` : "."));
        }
        return lignes;
      }

      function carteBilan(commercant) {
        const termine = commercant.statut === "termine";
        return el(
          "section",
          { class: "carte" },
          el("p", { class: "etiquette" }, termine ? "Essai terminé" : "Votre bilan"),
          el("h2", {}, termine ? "Votre essai est terminé" : "Votre bilan de l'essai"),
          lignesDuBilan(commercant.bilan).map((ligne) => el("p", {}, ligne)),
          termine
            ? el("p", { class: "doux" }, "Vos données sont conservées. Choisissez une formule pour retrouver votre Action du jour.")
            : el("p", { class: "doux" }, `Votre essai continue jusqu'au ${jour(commercant.essai_fin)}.`),
        );
      }

      // Grille du cahier des charges (prix HT par mois ; paiement annuel : 2 mois offerts).
      const FORMULES = [
        {
          cle: "essentiel",
          nom: "Essentiel",
          prix: 59,
          points: ["1 action par semaine sur votre téléphone", "Demandes d'avis et réponses préparées", "Sans engagement"],
        },
        {
          cle: "visibilite",
          nom: "Visibilité",
          prix: 99,
          points: ["Une action chaque jour", "Demandes d'avis et réponses préparées", "Rappel le soir si besoin", "Veille du 1er et du concurrent juste au-dessus", "Engagement 3 mois"],
        },
        {
          cle: "croissance",
          nom: "Croissance",
          prix: 149,
          points: ["Une action chaque jour", "Demandes d'avis et réponses préparées", "Rappel le soir si besoin", "Veille de 3 recherches : les 3 premiers et le concurrent juste au-dessus", "Carte de votre position, chaque mois", "Engagement 3 mois"],
        },
      ];
      const euros = (n) => `${n.toLocaleString("fr-FR")} €`;

      function choixDesFormules(commercant) {
        const conseillee = commercant.bilan?.formule_conseillee ?? "croissance";
        let annuel = false;
        const liste = el("div", {});
        const message = el("p", { class: "doux", hidden: true });
        const mensuel = el("button", { type: "button", "aria-pressed": "true" }, "Mensuel");
        const parAn = el("button", { type: "button", "aria-pressed": "false" }, "Annuel");
        const dessiner = () => {
          mensuel.setAttribute("aria-pressed", String(!annuel));
          parAn.setAttribute("aria-pressed", String(annuel));
          liste.replaceChildren(...FORMULES.map((f) => {
            const bouton = el("button", { class: f.cle === conseillee ? "bouton" : "bouton secondaire", type: "button" }, `Choisir ${f.nom}`);
            bouton.addEventListener("click", () => {
              message.hidden = false;
              message.textContent = "Le paiement en ligne arrive très prochainement : votre essai et vos données restent en place d'ici là.";
            });
            return el(
              "section",
              { class: f.cle === conseillee ? "carte formule conseillee" : "carte formule" },
              f.cle === conseillee ? el("p", { class: "etiquette" }, "Conseillée pour vous") : null,
              el("h2", {}, f.nom),
              el("p", { class: "prix" }, annuel ? `${euros(f.prix * 10)} HT / an` : `${euros(f.prix)} HT / mois`),
              annuel ? el("p", { class: "doux" }, `Soit 2 mois offerts sur ${euros(f.prix * 12)}.`) : null,
              el("ul", {}, f.points.map((p) => el("li", {}, p))),
              bouton,
            );
          }));
        };
        mensuel.addEventListener("click", () => { annuel = false; dessiner(); });
        parAn.addEventListener("click", () => { annuel = true; dessiner(); });
        dessiner();
        return el(
          "div",
          { id: "formules" },
          el("div", { class: "semaine-titre" }, "Choisir ma formule"),
          el("div", { class: "bascule" }, mensuel, parAn),
          liste,
          message,
        );
      }

      async function afficherEspace(session) {
        const { data: commercant, error } = await db.from("commercants")
          .select("id, prenom, nom_fiche, place_id, metier, mot_cle_suivi, statut, essai_fin, depart, push_subscription, bilan")
          .eq("user_id", session.user.id).maybeSingle();
        const deconnexion = el("button", { class: "lien", type: "button" }, "Se déconnecter");
        deconnexion.addEventListener("click", async () => {
          await db.auth.signOut();
          connexion(null, null);
        });
        if (error || !commercant) {
          afficher(
            entete(null),
            el(
              "section",
              { class: "carte" },
              el("h2", {}, "Aucun essai pour cette adresse"),
              el(
                "p",
                { class: "doux" },
                "Pour commencer, utilisez le bouton « Essayer 15 jours gratuitement » de votre audit.",
              ),
            ),
            el("p", { class: "pied" }, deconnexion),
          );
          return;
        }
        const enEssai = commercant.statut === "essai";
        preparerInstallation(session);
        const aujourdhui = jourDeParis(new Date());
        const [{ data: actions }, { data: releve }] = await Promise.all([
          db.from("actions").select("id, date, type, titre, message, contenu_propose, statut, avis_id, verifiee_le")
            .eq("commercant_id", commercant.id).gte("date", lundiDeLaSemaine(aujourdhui))
            .order("date"),
          db.from("releves").select("date, position").eq("commercant_id", commercant.id)
            .eq("statut", "termine").order("date", { ascending: false }).limit(1).maybeSingle(),
        ]);
        const action = (actions ?? []).find((a) => a.date === aujourdhui) ?? null;
        const { data: avis } = action?.avis_id
          ? await db.from("avis").select("auteur_prenom, note, texte").eq("id", action.avis_id)
            .maybeSingle()
          : { data: null };
        const surRetour = () => afficherEspace(session);
        const termine = commercant.statut === "termine";
        const formules = (commercant.bilan || termine || new URLSearchParams(location.search).has("formules"))
          ? choixDesFormules(commercant)
          : null;
        if (termine) {
          afficher(
            entete(commercant.prenom),
            commercant.bilan ? carteBilan(commercant) : null,
            formules,
            positionSuivie(releve, commercant),
            el("p", { class: "pied" }, deconnexion),
          );
          return;
        }
        afficher(
          entete(commercant.prenom),
          carteAction(action, avis, commercant, surRetour),
          ...semaine(actions ?? [], aujourdhui),
          commercant.bilan ? carteBilan(commercant) : null,
          formules,
          blocNotifications(Boolean(commercant.push_subscription)),
          installation(),
          positionSuivie(releve, commercant),
          el(
            "section",
            { class: "carte" },
            el("p", { class: "etiquette" }, enEssai ? "Essai gratuit" : "Votre espace"),
            el("h2", {}, commercant.nom_fiche),
            enEssai
              ? el("p", { class: "doux" }, `Votre essai court jusqu'au ${jour(commercant.essai_fin)}.`)
              : null,
          ),
          el("p", { class: "pied" }, deconnexion),
        );
      }

      async function demarrer() {
        const parametres = new URLSearchParams(location.search);
        const jetonLien = parametres.get("token_hash");
        // Accès préparé avant l'ajout à l'écran d'accueil : il ne sert que dans l'application installée,
        // jamais dans le navigateur (qui l'épuiserait avant elle).
        const jetonInstallation = parametres.get("installation");
        if (jetonInstallation && INSTALLE) {
          const { data: existante } = await db.auth.getSession();
          if (!existante.session) {
            await db.auth.verifyOtp({ token_hash: jetonInstallation, type: "email" });
          }
          history.replaceState(null, "", location.pathname);
        }
        if (jetonLien) {
          // Le jeton ne sert qu'une fois : on le retire tout de suite de l'adresse affichée.
          history.replaceState(null, "", location.pathname);
          const { error } = await db.auth.verifyOtp({ token_hash: jetonLien, type: "email" });
          if (error) {
            const { data } = await db.auth.getSession();
            if (!data.session) {
              connexion("Ce lien a expiré ou a déjà servi. Demandez un code ci-dessous.", null);
              return;
            }
          }
        }
        const { data } = await db.auth.getSession();
        if (data.session) await afficherEspace(data.session);
        else connexion(null, null);
      }

      // L'application installée reste ouverte des jours entiers en arrière-plan : au retour, si elle est
      // restée cachée plus de 10 minutes ou si la date a changé, on recharge la page (nouvelle version
      // publiée, nouvelle Action du jour). Un aller-retour rapide vers Google, pour coller un texte, ne
      // recharge rien.
      const ABSENCE_AVANT_RECHARGE_MS = 10 * 60_000;
      let cacheeDepuis = null;
      const jourAffiche = new Date().toDateString();
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          cacheeDepuis = Date.now();
          return;
        }
        const longue = cacheeDepuis !== null && Date.now() - cacheeDepuis > ABSENCE_AVANT_RECHARGE_MS;
        if (longue || new Date().toDateString() !== jourAffiche) location.reload();
        cacheeDepuis = null;
      });

      if ("serviceWorker" in navigator) navigator.serviceWorker.register("/agent/sw.js").catch(() => {});
      demarrer().catch(() => connexion("Un problème est survenu. Réessayez dans un instant.", null));
    </script>
  </body>
