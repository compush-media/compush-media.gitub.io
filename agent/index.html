<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1F7A55" />
    <title>Fidelavis Agent</title>
    <script>
      // Sur iPhone, l'icône de l'écran d'accueil reprend l'adresse de la page : son manifeste n'a donc
      // pas d'adresse de départ fixe (voir preparerInstallation). Ailleurs, le manifeste habituel.
      (function () {
        var lien = document.createElement("link");
        lien.rel = "manifest";
        lien.href = /iphone|ipad|ipod/i.test(navigator.userAgent)
          ? "/agent/manifest-iphone.webmanifest"
          : "/agent/manifest.webmanifest";
        document.head.appendChild(lien);
      })();
    </script>
    <link rel="icon" href="/agent/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/agent/icons/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fidelavis" />
    <style>
      :root {
        --fond: #F5F5F3;
        --carte: #FFFFFF;
        --encre: #17201B;
        --texte: #33403A;
        --doux: #5F6B65;
        --trait: #E7E7E3;
        --vert: #1F7A55;
        --vert-clair: #E3F1EA;
        --orange: #A8521C;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--fond);
        color: var(--texte);
        font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        /* Marge basse : les barres flottantes des navigateurs (Chrome sur iPhone) ne cachent rien. */
        padding: max(24px, env(safe-area-inset-top)) 20px calc(140px + env(safe-area-inset-bottom));
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 20px;
      }
      .date {
        color: var(--doux);
        margin: 0;
      }
      h1 {
        color: var(--encre);
        font-size: 30px;
        line-height: 1.15;
        margin: 2px 0 0;
      }
      .marque {
        background: var(--vert-clair);
        color: var(--vert);
        font-weight: 700;
        font-size: 15px;
        border-radius: 999px;
        padding: 6px 14px;
        white-space: nowrap;
      }
      .carte {
        background: var(--carte);
        border-radius: 22px;
        padding: 22px;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(23, 32, 27, 0.05);
      }
      .etiquette {
        color: var(--vert);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin: 0 0 8px;
      }
      h2 {
        color: var(--encre);
        font-size: 24px;
        line-height: 1.2;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 10px;
      }
      .doux {
        color: var(--doux);
      }
      .position {
        color: var(--encre);
        font-size: 24px;
        font-weight: 800;
        margin: 2px 0 6px;
      }
      ol {
        margin: 0;
        padding-left: 22px;
      }
      li {
        margin-bottom: 6px;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 6px 0;
      }
      input[type="email"],
      input.code {
        width: 100%;
        font: inherit;
        padding: 14px;
        border: 1px solid var(--trait);
        border-radius: 12px;
        margin-bottom: 12px;
      }
      .bouton {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 16px;
        background: var(--vert);
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 16px;
        cursor: pointer;
      }
      .bouton[disabled] {
        opacity: 0.6;
      }
      .lien {
        background: none;
        border: 0;
        color: var(--doux);
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
        padding: 0;
      }
      input.code {
        font-size: 28px;
        letter-spacing: 8px;
        text-align: center;
      }
      .erreur {
        color: var(--orange);
      }
      .succes {
        color: var(--vert);
        font-weight: 600;
      }
      .pied {
        text-align: center;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <main id="espace">
      <p class="doux">Chargement…</p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
    <script>
      "use strict";
      // Espace du commerçant Fidelavis Agent. Connexion sans mot de passe : l'e-mail porte un lien et un
      // code à usage unique, vérifiés ici. Le commerçant ne lit que sa propre fiche (règle RLS).
      const SUPABASE_URL = "https://rtdiaeskmyjjwohirhzj.supabase.co";
      // Clé publique (publishable) : faite pour être dans une page, les droits sont tenus par RLS.
      const SUPABASE_CLE = "sb_publishable_V9jcAKPdqxhupYWxoejARQ_D_AmOpcZ";
      const ADRESSE_AGENT = `${SUPABASE_URL}/functions/v1/agent`;

      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_CLE, {
        auth: { persistSession: true, detectSessionInUrl: false, storageKey: "fidelavis-agent" },
      });
      const zone = document.getElementById("espace");
      // replaceChildren écrirait « null » en toutes lettres : les blocs absents sont retirés avant.
      const afficher = (...blocs) => zone.replaceChildren(...blocs.filter(Boolean));
      const IPHONE = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const INSTALLE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

      function el(balise, attributs, ...enfants) {
        const noeud = document.createElement(balise);
        for (const [nom, valeur] of Object.entries(attributs ?? {})) {
          if (valeur !== null && valeur !== undefined && valeur !== false) {
            noeud.setAttribute(nom, valeur === true ? "" : valeur);
          }
        }
        for (const enfant of enfants.flat(Infinity)) {
          if (enfant === null || enfant === undefined || enfant === false) continue;
          noeud.append(typeof enfant === "string" ? document.createTextNode(enfant) : enfant);
        }
        return noeud;
      }

      const jour = (date, options) =>
        new Date(date).toLocaleDateString("fr-FR", options ?? { day: "numeric", month: "long" });
      const rang = (n) => (n === 1 ? "1re" : `${n}e`);
      const majuscule = (prenom) =>
        prenom.toLocaleLowerCase("fr").replace(/(^|[\s-])(\p{L})/gu, (_, sep, l) => sep + l.toLocaleUpperCase("fr"));

      function entete(prenom) {
        const aujourdhui = jour(new Date(), { weekday: "long", day: "numeric", month: "long" });
        return el(
          "header",
          {},
          el(
            "div",
            {},
            el("p", { class: "date" }, aujourdhui.charAt(0).toUpperCase() + aujourdhui.slice(1)),
            el("h1", {}, prenom ? `Bonjour ${majuscule(prenom)}` : "Bonjour"),
          ),
          el("span", { class: "marque" }, "Fidelavis"),
        );
      }

      // Sans session : on demande l'adresse de l'essai, un e-mail part avec un lien et un code.
      // Le code est indispensable sur iPhone : l'application ajoutée à l'écran d'accueil ne partage pas
      // la connexion du navigateur, et un lien reçu par e-mail s'ouvre toujours dans le navigateur.
      const ADRESSE_VALIDE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

      function connexion(message, emailConnu) {
        const erreur = el("p", { class: "erreur", hidden: !message }, message ?? "");
        const champ = el("input", {
          id: "email",
          type: "email",
          autocomplete: "email",
          required: true,
          placeholder: "vous@exemple.fr",
          value: emailConnu ?? null,
        });
        const bouton = el("button", { class: "bouton", type: "submit" }, "Recevoir mon code");
        const dejaUnCode = el("button", { class: "lien", type: "button" }, "J'ai déjà un code");
        const form = el(
          "form",
          { class: "carte", novalidate: true },
          el("p", { class: "etiquette" }, "Votre espace"),
          el("h2", {}, "Connexion"),
          el(
            "p",
            { class: "doux" },
            "Indiquez l'adresse e-mail de votre essai : nous vous envoyons un code de connexion, sans mot de passe.",
          ),
          el("label", { for: "email" }, "E-mail"),
          champ,
          bouton,
          erreur,
          el("p", { class: "pied" }, dejaUnCode),
        );
        const adresse = () => {
          const email = champ.value.trim();
          if (ADRESSE_VALIDE.test(email)) return email;
          erreur.textContent = "Vérifiez votre adresse e-mail.";
          erreur.hidden = false;
          return null;
        };
        dejaUnCode.addEventListener("click", () => {
          const email = adresse();
          if (email) saisieDuCode(email, false);
        });
        form.addEventListener("submit", async (evenement) => {
          evenement.preventDefault();
          const email = adresse();
          if (!email) return;
          bouton.disabled = true;
          bouton.textContent = "Envoi en cours…";
          if (await demanderCode(email)) {
            saisieDuCode(email, true);
            return;
          }
          bouton.disabled = false;
          bouton.textContent = "Recevoir mon code";
          erreur.textContent = "L'envoi n'a pas abouti. Réessayez dans un instant.";
          erreur.hidden = false;
        });
        afficher(entete(null), form);
      }

      async function demanderCode(email) {
        try {
          const reponse = await fetch(ADRESSE_AGENT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "lien", email }),
          });
          return reponse.ok;
        } catch {
          return false;
        }
      }

      function saisieDuCode(email, envoye) {
        const erreur = el("p", { class: "erreur", hidden: true });
        const champ = el("input", {
          id: "code",
          type: "text",
          inputmode: "numeric",
          autocomplete: "one-time-code",
          pattern: "[0-9]*",
          maxlength: "10",
          required: true,
          placeholder: "Code reçu par e-mail",
          class: "code",
        });
        const bouton = el("button", { class: "bouton", type: "submit" }, "Se connecter");
        const renvoyer = el("button", { class: "lien", type: "button" }, "Renvoyer un code");
        const autreAdresse = el("button", { class: "lien", type: "button" }, "Changer d'adresse");
        const form = el(
          "form",
          { class: "carte", novalidate: true },
          el("p", { class: "etiquette" }, "Votre espace"),
          el("h2", {}, "Entrez votre code"),
          el(
            "p",
            { class: envoye ? "succes" : "doux" },
            envoye
              ? `Si ${email} a un essai en cours, un e-mail avec votre code vient de partir. Il est valable une heure.`
              : `Entrez le code reçu par e-mail à ${email}.`,
          ),
          el("label", { for: "code" }, "Code"),
          champ,
          bouton,
          erreur,
          el("p", { class: "pied" }, renvoyer, " · ", autreAdresse),
        );
        renvoyer.addEventListener("click", async () => {
          renvoyer.disabled = true;
          const ok = await demanderCode(email);
          erreur.textContent = ok
            ? "Un nouveau code vient de partir (au plus un par minute)."
            : "L'envoi n'a pas abouti. Réessayez dans un instant.";
          erreur.className = ok ? "succes" : "erreur";
          erreur.hidden = false;
          renvoyer.disabled = false;
        });
        autreAdresse.addEventListener("click", () => connexion(null, email));
        form.addEventListener("submit", async (evenement) => {
          evenement.preventDefault();
          const code = champ.value.replace(/\D/g, "");
          if (code.length < 6) {
            erreur.textContent = "Vérifiez le code reçu par e-mail.";
            erreur.className = "erreur";
            erreur.hidden = false;
            return;
          }
          bouton.disabled = true;
          bouton.textContent = "Connexion…";
          const { data, error } = await db.auth.verifyOtp({ email, token: code, type: "email" });
          if (error || !data.session) {
            bouton.disabled = false;
            bouton.textContent = "Se connecter";
            erreur.textContent =
              "Ce code ne fonctionne pas : il a peut-être expiré ou déjà servi. Demandez-en un nouveau.";
            erreur.className = "erreur";
            erreur.hidden = false;
            return;
          }
          await afficherEspace(data.session);
        });
        afficher(entete(null), form);
        champ.focus();
      }

      // Guide d'installation : l'espace doit être sur l'écran d'accueil pour recevoir l'Action du jour.
      // Android propose l'installation quand il le juge possible : le bouton n'apparaît qu'à ce moment-là.
      let invitationAndroid = null;
      addEventListener("beforeinstallprompt", (evenement) => {
        evenement.preventDefault();
        invitationAndroid = evenement;
        document.getElementById("installer")?.removeAttribute("hidden");
      });
      function installation() {
        if (INSTALLE) return null;
        const ua = navigator.userAgent;
        const iphone = IPHONE;
        const derniere = IPHONE
          ? "Ouvrez Fidelavis Agent depuis votre écran d'accueil : vous êtes connecté directement. S'il vous demande un code, touchez « Recevoir mon code »."
          : "Ouvrez Fidelavis Agent depuis votre écran d'accueil : vous êtes connecté directement.";
        const ecranAccueil =
          "Touchez ••• « En voir plus » si besoin, puis « Sur l'écran d'accueil ».";
        let etapes;
        if (iphone && /CriOS|EdgiOS|FxiOS/.test(ua)) {
          // Chrome, Edge et Firefox sur iPhone ajoutent à l'écran d'accueil depuis leur bouton Partager.
          etapes = [
            "Touchez le bouton Partager (le carré avec une flèche), à droite de la barre d'adresse.",
            ecranAccueil,
            "Touchez « Ajouter ».",
            derniere,
          ];
        } else if (iphone && /Safari\//.test(ua) && !/GSA\/|FBAN|FBAV|Instagram/.test(ua)) {
          etapes = [
            "Touchez le bouton Partager (le carré avec une flèche), en bas de l'écran.",
            ecranAccueil,
            "Touchez « Ajouter ».",
            derniere,
          ];
        } else if (iphone) {
          // Navigateur intégré à une application (Google, Gmail, Facebook…) : il faut passer par Safari.
          etapes = [
            "Ouvrez cette page dans Safari : touchez ••• ou le bouton Partager, puis « Ouvrir dans Safari ».",
            `Dans Safari, touchez Partager. ${ecranAccueil}`,
            derniere,
          ];
        } else {
          etapes = [
            "Touchez le menu ⋮ de votre navigateur.",
            "Choisissez « Installer l'application » ou « Ajouter à l'écran d'accueil ».",
            derniere,
          ];
        }
        const bouton = !iphone
          ? el(
            "button",
            { id: "installer", class: "bouton", type: "button", hidden: !invitationAndroid },
            "Installer Fidelavis Agent",
          )
          : null;
        bouton?.addEventListener("click", async () => {
          if (!invitationAndroid) return;
          invitationAndroid.prompt();
          await invitationAndroid.userChoice;
          invitationAndroid = null;
          bouton.hidden = true;
        });
        return el(
          "section",
          { class: "carte" },
          el("p", { class: "etiquette" }, "À faire une fois"),
          el("h2", {}, "Ajoutez Fidelavis Agent à votre écran d'accueil"),
          el(
            "p",
            { class: "doux" },
            "Vous retrouverez votre Action du jour en un geste, comme une application.",
          ),
          el("ol", {}, etapes.map((etape) => el("li", {}, etape))),
          bouton,
        );
      }

      // Sur iPhone, l'application ajoutée à l'écran d'accueil ne partage pas la connexion du navigateur.
      // Avant l'ajout, la page se recharge à une adresse qui porte un accès à usage unique : l'icône
      // reprend cette adresse, et l'application installée s'en sert à sa première ouverture, sans code.
      // L'accès vaut une heure ; au-delà de 50 minutes, il est renouvelé. Sur Android, la connexion est
      // déjà partagée avec le navigateur.
      const ACCES_FRAIS_MS = 50 * 60 * 1000;
      async function preparerInstallation(session) {
        if (!IPHONE || INSTALLE) return;
        const parametres = new URLSearchParams(location.search);
        const prepareLe = Number(parametres.get("le"));
        if (parametres.get("installation") && Date.now() - prepareLe < ACCES_FRAIS_MS) return;
        try {
          const reponse = await fetch(ADRESSE_AGENT, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${session.access_token}`,
            },
            body: JSON.stringify({ action: "installation" }),
          });
          if (!reponse.ok) return;
          const { token_hash: jeton } = await reponse.json();
          if (!jeton) return;
          location.replace(`/agent/?installation=${encodeURIComponent(jeton)}&le=${Date.now()}`);
        } catch {
          // Sans accès préparé, l'application installée demandera un code : rien de bloquant.
        }
      }

      function positionDeDepart(depart) {
        if (!depart?.mot_cle) return null;
        const autres = (depart.autres_positions ?? []).map((a) =>
          el(
            "p",
            { class: "doux" },
            `Sur « ${a.mot_cle} » tout court : ${
              a.position === null ? `au-delà des ${a.profondeur} premiers` : rang(a.position)
            }.`,
          )
        );
        return el(
          "section",
          { class: "carte" },
          el("p", { class: "doux" }, `« ${depart.mot_cle} » sur Google Maps`),
          el(
            "p",
            { class: "position" },
            depart.position === null
              ? "Hors des résultats relevés"
              : `Vous êtes ${rang(depart.position)}`,
          ),
          autres,
          depart.releve_le
            ? el("p", { class: "doux" }, `Point de départ relevé le ${jour(depart.releve_le)}.`)
            : null,
        );
      }

      async function afficherEspace(session) {
        const { data: commercant, error } = await db.from("commercants")
          .select("prenom, nom_fiche, mot_cle_suivi, statut, essai_fin, depart")
          .eq("user_id", session.user.id).maybeSingle();
        const deconnexion = el("button", { class: "lien", type: "button" }, "Se déconnecter");
        deconnexion.addEventListener("click", async () => {
          await db.auth.signOut();
          connexion(null, null);
        });
        if (error || !commercant) {
          afficher(
            entete(null),
            el(
              "section",
              { class: "carte" },
              el("h2", {}, "Aucun essai pour cette adresse"),
              el(
                "p",
                { class: "doux" },
                "Pour commencer, utilisez le bouton « Essayer 15 jours gratuitement » de votre audit.",
              ),
            ),
            el("p", { class: "pied" }, deconnexion),
          );
          return;
        }
        const enEssai = commercant.statut === "essai";
        preparerInstallation(session);
        afficher(
          entete(commercant.prenom),
          el(
            "section",
            { class: "carte" },
            el("p", { class: "etiquette" }, enEssai ? "Essai gratuit" : "Votre espace"),
            el("h2", {}, commercant.nom_fiche),
            enEssai
              ? el("p", {}, `Votre essai court jusqu'au ${jour(commercant.essai_fin)}.`)
              : null,
            el(
              "p",
              { class: "doux" },
              "Chaque matin, votre Action du jour s'affichera ici : une chose simple à faire en 2 minutes, depuis votre téléphone, pour faire progresser votre fiche Google.",
            ),
          ),
          installation(),
          positionDeDepart(commercant.depart),
          el("p", { class: "pied" }, deconnexion),
        );
      }

      async function demarrer() {
        const parametres = new URLSearchParams(location.search);
        const jetonLien = parametres.get("token_hash");
        // Accès préparé avant l'ajout à l'écran d'accueil : il ne sert que dans l'application installée,
        // jamais dans le navigateur (qui l'épuiserait avant elle).
        const jetonInstallation = parametres.get("installation");
        if (jetonInstallation && INSTALLE) {
          const { data: existante } = await db.auth.getSession();
          if (!existante.session) {
            await db.auth.verifyOtp({ token_hash: jetonInstallation, type: "email" });
          }
          history.replaceState(null, "", location.pathname);
        }
        if (jetonLien) {
          // Le jeton ne sert qu'une fois : on le retire tout de suite de l'adresse affichée.
          history.replaceState(null, "", location.pathname);
          const { error } = await db.auth.verifyOtp({ token_hash: jetonLien, type: "email" });
          if (error) {
            const { data } = await db.auth.getSession();
            if (!data.session) {
              connexion("Ce lien a expiré ou a déjà servi. Demandez un code ci-dessous.", null);
              return;
            }
          }
        }
        const { data } = await db.auth.getSession();
        if (data.session) await afficherEspace(data.session);
        else connexion(null, null);
      }

      if ("serviceWorker" in navigator) navigator.serviceWorker.register("/agent/sw.js").catch(() => {});
      demarrer().catch(() => connexion("Un problème est survenu. Réessayez dans un instant.", null));
    </script>
  </body>
</html>
