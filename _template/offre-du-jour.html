<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offre du jour – Fidelavis</title>

  <script src="../assets/core.js"></script>

  <script>(function(){
    var m=location.pathname.match(/^\/([^/]+)\//);var s=m?m[1]:'';
    var c=s?localStorage.getItem('fv_brand_'+s):null;
    if(c)document.documentElement.style.setProperty('--brand',c);
    fetch('/'+s+'/config.json').then(function(r){return r.json();}).then(function(d){
      if(d&&d.color)document.documentElement.style.setProperty('--brand',d.color);
    }).catch(function(){});
  })();</script>

  <style>
    :root{
      --brand:#B48C4A;
      --bg:#fbfaf8;
      --card:#ffffff;
      --ink:#191919;
      --muted:#6f6f6f;
      --line:rgba(0,0,0,.08);
      --shadow:0 18px 50px rgba(0,0,0,.08);
      --r:22px;
      --topbar-h:56px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:
        radial-gradient(1100px 520px at 50% -160px,rgba(180,140,74,0.16),transparent 60%),
        linear-gradient(180deg,#fbfaf8 0%,#f6f2ec 100%);
      color:var(--ink);
      padding-top:calc(var(--topbar-h) + 16px);
      padding-bottom:32px;
    }
    .wrap{ max-width:520px; margin:0 auto; padding:0 14px; }

    /* Topbar */
    .topbar{
      position:fixed; top:0; left:0; right:0;
      height:var(--topbar-h); display:flex; align-items:center;
      justify-content:space-between; padding:0 16px;
      background:rgba(251,250,248,.88); backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line); z-index:100;
    }
    .back-btn{
      display:inline-grid; place-items:center;
      width:38px; height:38px; border-radius:50%;
      background:rgba(180,140,74,.14); border:none; cursor:pointer;
    }
    .back-btn::before{
      content:""; width:11px; height:11px;
      border-left:2.5px solid var(--brand);
      border-bottom:2.5px solid var(--brand);
      transform:translateX(2px) rotate(45deg);
      display:block;
    }
    .topbar-title{ font-size:15px; font-weight:800; color:var(--ink); }

    /* Offer card */
    .offer-card{
      background:var(--card); border:1px solid var(--line);
      border-radius:var(--r); box-shadow:var(--shadow);
      overflow:hidden; margin-bottom:16px;
    }
    .offer-image{
      width:100%; height:200px; object-fit:cover;
      display:block; background:rgba(180,140,74,.08);
    }
    .offer-image-placeholder{
      width:100%; height:180px;
      background:linear-gradient(135deg,rgba(180,140,74,.18) 0%,rgba(180,140,74,.06) 100%);
      display:flex; align-items:center; justify-content:center;
      font-size:56px;
    }
    .offer-body{ padding:20px 18px; }
    .offer-badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:5px 12px; border-radius:999px;
      background:rgba(180,140,74,.12); border:1px solid rgba(180,140,74,.25);
      font-size:11px; font-weight:800; color:var(--brand);
      text-transform:uppercase; letter-spacing:.5px;
      margin-bottom:12px;
    }
    .offer-title{
      font-size:22px; font-weight:950; color:var(--ink);
      margin:0 0 10px; line-height:1.2;
    }
    .offer-desc{
      font-size:15px; color:var(--muted); line-height:1.5;
      margin:0 0 14px;
    }
    .offer-date{
      font-size:12px; color:var(--muted);
      display:flex; align-items:center; gap:6px;
    }

    /* No offer */
    .no-offer{
      background:var(--card); border:1px solid var(--line);
      border-radius:var(--r); box-shadow:var(--shadow);
      padding:48px 24px; text-align:center;
    }
    .no-offer-icon{ font-size:52px; margin-bottom:16px; }
    .no-offer-title{ font-size:20px; font-weight:900; margin:0 0 8px; }
    .no-offer-sub{ font-size:14px; color:var(--muted); margin:0; line-height:1.4; }

    /* Actions */
    .actions{ display:flex; flex-direction:column; gap:10px; }
    .btn{
      width:100%; padding:15px 16px; border-radius:14px;
      border:none; cursor:pointer; font-weight:800; font-size:15px;
      font-family:inherit; transition:opacity .15s;
    }
    .btn:active{ opacity:.82; }
    .btnPrimary{
      background:linear-gradient(180deg,var(--brand) 0%,#a97f37 100%);
      color:#fff; box-shadow:0 14px 28px rgba(180,140,74,.22);
    }
    .btnSecondary{
      background:var(--card); color:var(--brand);
      border:2px solid rgba(180,140,74,.5);
    }
    .btnOutline{
      background:transparent; color:var(--muted);
      border:1.5px solid var(--line); font-size:14px;
    }
    @keyframes fadeIn{
      from{opacity:0;transform:translateY(8px);}
      to{opacity:1;transform:translateY(0);}
    }
    .anim{ animation:fadeIn .35s ease; }
  </style>
</head>

<body>
  <header class="topbar">
    <button class="back-btn" aria-label="Retour" onclick="goBack()"></button>
    <span class="topbar-title">Offre du jour</span>
    <div style="width:38px"></div>
  </header>

  <div class="wrap">
    <div id="content" class="anim">
      <!-- rempli par JS -->
    </div>
  </div>

<script>
const RESTO = window.Fidelavis?.getRestoSlug?.() || "resto1";

function goBack(){
  if(window.history.length > 1) window.history.back();
  else window.Fidelavis?.go?.("index.html");
}

function callResto(phone){
  window.Fidelavis?.track?.("call_click",{src:"offre_page"});
  window.location.href = "tel:" + phone.replace(/\s/g,"");
}

function reserverResto(url){
  window.Fidelavis?.track?.("reserve_click",{src:"offre_page"});
  if(url) window.open(url,"_blank");
  else window.Fidelavis?.go?.("reservation.html");
}

(async function init(){
  let cfg = null;
  try{ cfg = await window.Fidelavis?.loadConfig?.(); }catch(e){}

  window.Fidelavis?.track?.("offer_day_click",{src:"offre_page"});

  const el = document.getElementById("content");
  const offre = cfg && cfg.offre_jour;

  if(!offre || !offre.active || !offre.titre){
    el.innerHTML = `
      <div class="no-offer">
        <div class="no-offer-icon">🎁</div>
        <div class="no-offer-title">Aucune offre aujourd'hui</div>
        <p class="no-offer-sub">Revenez bientôt, de nouvelles offres arrivent régulièrement !</p>
      </div>
      <div class="actions" style="margin-top:16px">
        ${cfg&&cfg.phone ? `<button class="btn btnSecondary" onclick="callResto('${cfg.phone}')">📞 Appeler le restaurant</button>` : ''}
        <button class="btn btnOutline" onclick="goBack()">← Retour à l'accueil</button>
      </div>`;
    return;
  }

  const dateFin = offre.date_fin ? (() => {
    try{ return new Date(offre.date_fin).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}); }
    catch(_){ return offre.date_fin; }
  })() : null;

  el.innerHTML = `
    <div class="offer-card">
      ${offre.image
        ? `<img class="offer-image" src="${esc(offre.image)}" alt="${esc(offre.titre)}" loading="lazy" onerror="this.style.display='none'">`
        : `<div class="offer-image-placeholder">🔥</div>`}
      <div class="offer-body">
        <div class="offer-badge">🔥 Offre du jour</div>
        <h1 class="offer-title">${esc(offre.titre)}</h1>
        ${offre.description ? `<p class="offer-desc">${esc(offre.description)}</p>` : ''}
        ${dateFin ? `<div class="offer-date">⏰ Valable jusqu'au ${dateFin}</div>` : ''}
      </div>
    </div>
    <div class="actions">
      <button class="btn btnPrimary" onclick="reserverResto('${cfg&&cfg.reservationUrl?esc(cfg.reservationUrl):''}')">📅 Réserver une table</button>
      ${cfg&&cfg.phone ? `<button class="btn btnSecondary" onclick="callResto('${esc(cfg.phone)}')">📞 Appeler le restaurant</button>` : ''}
      <button class="btn btnOutline" onclick="goBack()">← Retour à l'accueil</button>
    </div>`;
})();

function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
</script>
</body>
</html>
