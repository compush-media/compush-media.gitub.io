<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Inscription confirmée — Fidelavis</title>

<script src="../assets/core.js"></script>
<!-- ✅ Manifest + Progressier (push notifications) -->
<link rel="manifest" href="progressier.json"/>
<script defer src="https://progressier.app/zb3Ezrlt6Ezd6iN3VpMW/script.js"></script>
<script>(function(){var m=location.pathname.match(/^\/([^/]+)\//);var s=m?m[1]:'';var c=s?localStorage.getItem('fv_brand_'+s):null;if(c)document.documentElement.style.setProperty('--gold',c);if(!s)return;fetch('/'+s+'/config.json').then(function(r){return r.json();}).then(function(d){var col=d&&d.color;if(col){document.documentElement.style.setProperty('--gold',col);try{localStorage.setItem('fv_brand_'+s,col);}catch(_){}}var nom=d&&d.name;if(nom)document.getElementById('sub').textContent='Ajoutez l’app '+nom+' à votre écran d’accueil pour retrouver votre cadeau de bienvenue à chaque visite.';}).catch(function(){});})();</script>
<style>
:root{
  --gold:#b8924f;
  --bg:#f6efe5;
  --card:#ffffff;
  --ink:#1d1d1d;
  --muted:#6b6b6b;
  --line:rgba(0,0,0,0.08);
  --shadow:0 18px 40px rgba(0,0,0,0.12);
  --ok:#1f8a4c;
  --radius:22px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:
    radial-gradient(1200px 600px at 50% -120px, rgba(184,146,79,0.18), transparent 60%),
    linear-gradient(180deg,#f7f0e8 0%,#f4eadf 100%);
  color:var(--ink);
  padding:20px 14px 110px;
  text-align:center;
}
.wrap{max-width:560px;margin:0 auto}

/* Cette page a deja sa propre invitation a installer : la bulle flottante
   de Progressier ferait doublon. */
.progressier-widget { display: none !important; }

.badge{
  display:inline-flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:999px;
  background:rgba(255,255,255,.84);
  border:1px solid var(--line);
  font-weight:950;font-size:13px;
  box-shadow:0 10px 18px rgba(0,0,0,.05);
}
.dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 6px rgba(31,138,76,.15);
}
h1{ margin:16px 0 8px; font-size:28px; font-weight:1000; letter-spacing:-.3px; }
.sub{ margin:0 0 20px; font-size:14px; color:var(--muted); line-height:1.45; }

.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:20px 18px;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
  text-align:left;
}
.step{ display:flex; gap:12px; margin:14px 0 0; font-size:14px; line-height:1.4; }
.step:first-child{ margin-top:0; }
.num{
  width:28px;height:28px;border-radius:9px;
  background:rgba(184,146,79,.16);
  display:flex;align-items:center;justify-content:center;
  font-weight:1000;
  flex:0 0 auto;
}

.btn{
  display:block;
  width:100%;
  margin-top:22px;
  border:none;
  border-radius:18px;
  padding:17px 14px;
  font-size:15px;
  font-weight:1000;
  font-family:inherit;
  color:#fff;
  background:linear-gradient(135deg, var(--gold), #9E7A3E);
  box-shadow:0 14px 26px rgba(184,146,79,.28);
  cursor:pointer;
}
.lien{
  display:inline-block;
  margin-top:14px;
  font-size:13px;
  font-weight:800;
  color:var(--muted);
  background:none;
  border:0;
  cursor:pointer;
  font-family:inherit;
  text-decoration:underline;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="badge"><span class="dot"></span>Inscription confirmée</div>

  <h1>✅ Bienvenue !</h1>
  <p class="sub" id="sub">Ajoutez l'app à votre écran d'accueil pour retrouver votre cadeau de bienvenue à chaque visite.</p>

  <div class="card">
    <div class="step"><div class="num">1</div><div>Installez l'app (10 secondes, une seule fois).</div></div>
    <div class="step"><div class="num">2</div><div>Lors de votre prochaine visite, ouvrez-la.</div></div>
    <div class="step"><div class="num">3</div><div>Présentez votre cadeau à la caisse ✅</div></div>
  </div>

  <button class="btn" id="ctaInstall" type="button">📲 Installer l'app</button>
  <button class="lien" id="skipBtn" type="button">Plus tard, voir mon compte →</button>
</div>

<script>
function currentFolderBase(){
  const p = location.pathname;
  return p.slice(0, p.lastIndexOf("/") + 1);
}
const base = currentFolderBase();
const params = new URLSearchParams(location.search);
params.delete("email"); // jamais transmis plus loin
const qs = params.toString() ? "?" + params.toString() : "";

document.getElementById("ctaInstall").addEventListener("click", function(){
  location.href = base + "redit.html" + qs;
});

// Pas d'installation immédiate souhaitée : le compte reste accessible,
// l'inscription est déjà enregistrée. Aucune fonctionnalité n'est bloquée
// derrière ce choix.
document.getElementById("skipBtn").addEventListener("click", function(){
  location.href = base + "index.html" + qs;
});
</script>

<!-- =====================================================
     TRACKING / STATISTIQUES — non-visuel
     Reprend le meme mecanisme que redit.html : cette page peut aussi
     etre atteinte directement depuis un lien GoHighLevel (?email=...)
     sans passer par inscription.html, qui pose normalement ces drapeaux.
     Sans ce bloc, un client arrivant ici directement se voyait dire
     « inscription confirmee » sans l'etre reellement pour le reste du site.
===================================================== -->
<script>
(function(){
  try {
    if (!sessionStorage.getItem("fv_session_id")) {
      sessionStorage.setItem(
        "fv_session_id",
        "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8)
      );
    }
  } catch(e){}

  var RESTO = (window.Fidelavis && window.Fidelavis.getRestoSlug)
    ? window.Fidelavis.getRestoSlug()
    : (new URLSearchParams(location.search).get("resto") || "resto2");

  try {
    var urlEmail = new URLSearchParams(location.search).get("email");
    if (urlEmail && urlEmail.indexOf("@") !== -1 && urlEmail.length < 300) {
      localStorage.setItem("user_email", urlEmail);
    }
  } catch(e){}

  try {
    var now = Date.now();
    var dedupKey = "signup_" + RESTO;
    var last = Number(localStorage.getItem(dedupKey) || "0");

    if (!last || (now - last) > 86400000) {
      localStorage.setItem(dedupKey, String(now));
      localStorage.setItem("is_registered",            "1");
      localStorage.setItem("fv_onboarding_done",       "1");
      localStorage.setItem("fv_registered_" + RESTO,   "1");
      localStorage.setItem("fv_registered_at_" + RESTO, String(now));

      if (window.Fidelavis && window.Fidelavis.track) {
        window.Fidelavis.track("signup", { src: "ghl_merci", resto: RESTO });
      }
    }
  } catch(e){}

  try {
    var viewKey = "merci_view_" + RESTO;
    if (!sessionStorage.getItem(viewKey)) {
      sessionStorage.setItem(viewKey, "1");
      if (window.Fidelavis && window.Fidelavis.track) {
        window.Fidelavis.track("merci_view", { src: "merci", resto: RESTO });
      }
    }
  } catch(e){}

  window.Fidelavis?.setAuthCookie?.();

  try {
    document.getElementById("ctaInstall").addEventListener("click", function(){
      if (window.Fidelavis && window.Fidelavis.track) {
        window.Fidelavis.track("install_attempt", { src: "merci", resto: RESTO });
      }
    });
  } catch(e){}
})();
</script>
</body>
</html>
