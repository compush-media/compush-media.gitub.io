<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" role="img" aria-label="Fidelavis">
  <defs>
    <linearGradient id="fvGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="fvGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4C95D"/>
      <stop offset="100%" stop-color="#B8924F"/>
    </linearGradient>
    <filter id="fvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Badge rond -->
  <g filter="url(#fvShadow)">
    <circle cx="55" cy="55" r="46" fill="url(#fvGrad)"/>
    <circle cx="55" cy="55" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- Étoile or centrale (avis) -->
  <path d="M55 28 L61.7 46.3 L81.3 47 L65.5 58.8 L71.1 77.5 L55 66.6 L38.9 77.5 L44.5 58.8 L28.7 47 L48.3 46.3 Z"
        fill="url(#fvGold)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Coeur en surimpression (fidélité) -->
  <path d="M55 61.5 c-3.5 -4 -9 -5.5 -9 -11 c0 -3.3 2.7 -6 6 -6 c1.7 0 3.2 0.7 3 1.6 c0.8 -0.9 1.3 -1.6 3 -1.6 c3.3 0 6 2.7 6 6 c0 5.5 -5.5 7 -9 11 z"
        fill="#ffffff" opacity="0.95"/>

  <!-- Wordmark -->
  <g font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-weight="800">
    <text x="120" y="62" font-size="38" fill="#1E3A8A" letter-spacing="-1">Fidel<tspan fill="#2563EB">avis</tspan></text>
    <text x="121" y="84" font-size="12" fill="#6B7280" font-weight="600" letter-spacing="2.8">FIDÉLITÉ · AVIS · IA</text>
  </g>
</svg>
