<script>
/* ============================
   TRACKING + REDIRECT (via core.js)
============================ */
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches ||
         window.navigator.standalone === true;
}

function ensureHelperUI(){
  if (document.getElementById("accessHelp")) return;

  const wrap = document.querySelector(".wrap");
  const card = document.querySelector(".card");
  if (!wrap || !card) return;

  const box = document.createElement("div");
  box.id = "accessHelp";
  box.style.marginTop = "14px";
  box.style.padding = "14px";
  box.style.borderRadius = "16px";
  box.style.border = "1px solid rgba(0,0,0,0.08)";
  box.style.background = "rgba(255,255,255,0.82)";
  box.style.boxShadow = "0 12px 26px rgba(0,0,0,0.08)";
  box.style.textAlign = "left";

  box.innerHTML = `
    <div style="font-weight:950; font-size:14px; margin-bottom:6px;">⏳ Synchronisation en cours…</div>
    <div style="color:#6b6b6b; font-weight:700; font-size:13px; line-height:1.35;">
      Sur iPhone, il faut parfois <b>1 seconde</b> après l’installation pour récupérer l’accès.
      <br>Ne fermez pas : nous vérifions automatiquement.
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
      <button id="btnRetry" type="button"
        style="flex:1; min-width:140px; padding:12px 14px; border-radius:14px; border:2px solid rgba(184,146,79,.35); background:#fff; font-weight:950; cursor:pointer;">
        🔄 Rafraîchir
      </button>

      <button id="btnCoupon" type="button"
        style="flex:1; min-width:140px; padding:12px 14px; border-radius:14px; border:none; background:linear-gradient(180deg, #B8924F 0%, #9E7A3E 100%); color:#fff; font-weight:950; cursor:pointer;">
        🎟️ Aller au coupon
      </button>
    </div>

    <div id="accessState"
      style="margin-top:10px; font-size:12.5px; font-weight:800; color:#7a1120; background:rgba(182,21,43,.06); border:1px solid rgba(182,21,43,.14); padding:10px 12px; border-radius:14px;">
      Vérification…
    </div>
  `;

  card.appendChild(box);

  document.getElementById("btnRetry").addEventListener("click", () => {
    try { location.reload(); } catch(e){}
  });

  document.getElementById("btnCoupon").addEventListener("click", () => {
    // Si accès ok -> index.html, sinon on ne fait rien
    try{
      if (window.Fidelavis?.hasAccess?.()){
        window.location.replace("index.html");
      } else {
        const s = document.getElementById("accessState");
        if (s) s.textContent = "⚠️ Accès pas encore prêt. Patientez 1 seconde puis réessayez.";
      }
    }catch(e){}
  });
}

(function(){
  try{
    const RESTO = window.Fidelavis?.rememberLastResto?.() || "resto1";

    // install_attempt 1x/session/RESTO
    const k = `install_attempt_${RESTO}`;
    if (!sessionStorage.getItem(k)){
      sessionStorage.setItem(k, "1");
      window.Fidelavis?.track?.("install_attempt");
    }

    // Si PWA ouverte
    if (isStandalone()){
      window.Fidelavis?.track?.("install_open");

      // On affiche une UI d'aide (au cas où)
      ensureHelperUI();

      // On retente plusieurs fois (iOS restore LS/cookies)
      const triesMax = 6;        // ~ 6 * 350ms = 2.1s
      let tries = 0;

      const tick = () => {
        tries++;
        const ok = (window.Fidelavis?.hasAccess?.() === true);

        const s = document.getElementById("accessState");
        if (s){
          s.textContent = ok
            ? "✅ Accès confirmé. Ouverture du coupon…"
            : `⏳ Vérification (${tries}/${triesMax})…`;
        }

        if (ok){
          window.Fidelavis?.track?.("install");
          setTimeout(()=> window.location.replace("index.html"), 220);
          return;
        }

        if (tries < triesMax){
          setTimeout(tick, 350);
        } else {
          // Après plusieurs essais, on garde la page + message clair
          window.Fidelavis?.track?.("install_no_access");
          if (s) s.textContent = "⚠️ Accès non confirmé. Cliquez sur “Rafraîchir” ou réouvrez via le lien email.";
        }
      };

      setTimeout(tick, 350);
      return;
    }
  }catch(e){}
})();

/* Charge config resto (nom, couleurs…) */
(async function(){
  try { await window.Fidelavis?.loadConfig?.(); } catch(e){}
})();
</script>
