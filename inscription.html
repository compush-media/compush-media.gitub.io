<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Activer -10% — Fidelavis</title>

  <!-- ✅ Core commun -->
  <script src="../assets/core.js"></script>

  <!-- ✅ Tracking Apps Script Fidelavis -->
  <script>
  (function(){
    const STATS_URL = "https://script.google.com/macros/s/AKfycbxiZSHloUbi5zxx-jYanNiY6TnOO7u5GUzCVaVzHz5iuqU-PFxLg_-eDpepJCP4LXmATA/exec";

    window.trackEventFidelavis = function(eventName, restoName, extra = {}) {
      try {
        let iframe = document.getElementById("stats_iframe");
        if (!iframe) {
          iframe = document.createElement("iframe");
          iframe.name = "stats_iframe";
          iframe.id = "stats_iframe";
          iframe.style.display = "none";
          document.body.appendChild(iframe);
        }

        const form = document.createElement("form");
        form.method = "POST";
        form.action = STATS_URL;
        form.target = "stats_iframe";
        form.style.display = "none";

        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "data";
        input.value = JSON.stringify({
          resto: restoName || "resto1",
          event: eventName || "",
          mois: new Date().getMonth() + 1,
          annee: new Date().getFullYear(),
          user: localStorage.getItem("user_email") || "",
          userAgent: navigator.userAgent,
          pageURL: location.href,
          demo: extra.demo ?? "",
          deviceId: extra.deviceId ?? localStorage.getItem("device_id") || "",
          sessionId: extra.sessionId ?? sessionStorage.getItem("fv_session_id") || "",
          src: extra.src ?? ""
        });

        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();

        setTimeout(() => {
          try { form.remove(); } catch(e){}
        }, 1200);

      } catch(e) {
        console.warn("trackEventFidelavis error", e);
      }
    };
  })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --gold:#B8924F;
      --line:rgba(0,0,0,.08);
      --shadow:0 16px 34px rgba(0,0,0,.10);
      --radius:18px;
      --bg1:#f7f0e8;
      --bg2:#f4eadf;
      --ok:#1f8a4c;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);
      color:#1d1d1d;
      padding:10px 12px calc(70px + env(safe-area-inset-bottom));
      text-align:center;
    }
    .wrap{max-width:460px;margin:0 auto;}

    .badge{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 12px;border-radius:999px;
      background:#fff;border:1px solid var(--line);
      font-weight:900;font-size:12px;
      margin:0 0 6px;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
    h1{
      margin:0 0 6px;
      font-size:22px;
      line-height:1.10;
      font-weight:950;
      letter-spacing:-0.35px;
    }
    .micro{
      margin:0 0 10px;
      font-size:13px;
      font-weight:900;
      color:#2b2b2b;
      opacity:.88;
    }

    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:10px;
      text-align:left;
    }
    iframe{
      width:100%;
      border:0;
      border-radius:14px;
      background:#fff;
      display:block;
      height:560px;
    }

    .sticky{
      position:fixed;
      left:0; right:0; bottom:0;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:linear-gradient(180deg, rgba(247,240,232,0) 0%, rgba(247,240,232,.92) 30%, rgba(247,240,232,.98) 100%);
      backdrop-filter: blur(10px);
      z-index:999;
    }
    .stickyInner{
      max-width:460px;
      margin:0 auto;
      display:flex;
      gap:10px;
      justify-content:center;
      align-items:center;
    }
    .btnLink{
      flex:1 1 0;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      font-weight:950;font-size:13px;
      color:#2b2b2b;
      text-decoration:none;
      box-shadow:0 10px 22px rgba(0,0,0,.06);
    }
  </style>

  <!-- ✅ Détection retour GHL après soumission -->
  <script>
  (function(){
    const params = new URLSearchParams(location.search);
    if (params.get("submitted") !== "1") return;

    const RESTO = window.Fidelavis?.rememberLastResto?.() || window.Fidelavis?.getRestoSlug?.() || "resto1";
    const now = Date.now();

    // Persiste l'inscription
    try {
      localStorage.setItem("is_registered", "1");
      localStorage.setItem("fv_onboarding_done", "1");
      localStorage.setItem(`fv_registered_${RESTO}`, "1");
      localStorage.setItem(`fv_registered_at_${RESTO}`, String(now));
    } catch(e){}

    // Nettoie l'URL
    params.delete("submitted");
    const clean = location.pathname + (params.toString() ? "?" + params.toString() : "");
    try { history.replaceState({}, document.title, clean); } catch(e){}

    // Tracking signup — sendBeacon survit à la navigation, pas besoin de document.body
    const dedupKey = `signup_${RESTO}`;
    const last = Number(localStorage.getItem(dedupKey) || "0");

    if (!last || (now - last) > 86400000) {
      try { localStorage.setItem(dedupKey, String(now)); } catch(e){}

      const STATS_URL = "https://script.google.com/macros/s/AKfycbxiZSHloUbi5zxx-jYanNiY6TnOO7u5GUzCVaVzHz5iuqU-PFxLg_-eDpepJCP4LXmATA/exec";
      const payload = JSON.stringify({
        resto:     RESTO,
        event:     "signup",
        jour:      new Date().toISOString().slice(0, 10),
        mois:      new Date().getMonth() + 1,
        annee:     new Date().getFullYear(),
        user:      localStorage.getItem("user_email") || "",
        userAgent: navigator.userAgent,
        pageURL:   location.href,
        deviceId:  localStorage.getItem("device_id") || "",
        sessionId: sessionStorage.getItem("fv_session_id") || "",
        src:       "ghl_redirect_inscription",
        demo:      location.pathname.includes("/demo/") ? "1" : "0"
      });

      try {
        // sendBeacon : fire-and-forget, survit à window.location.replace
        const fd = new FormData();
        fd.append("data", payload);
        navigator.sendBeacon(STATS_URL, fd);
      } catch(e) {
        // Fallback si sendBeacon indisponible : track via core.js (nécessite body)
        document.addEventListener("DOMContentLoaded", function() {
          try { window.Fidelavis?.track?.("signup", { src: "ghl_redirect_inscription" }); } catch(e2){}
        });
      }
    }

    // Redirection après un court délai
    setTimeout(() => window.location.replace("redit.html"), 400);
  })();
  </script>
</head>

<body>
  <div class="wrap">
    <div class="badge"><span class="dot"></span>Dernière étape</div>
    <h1>🎁 Où devons-nous envoyer votre -10% ?</h1>
    <p class="micro">⚡ 10 secondes • 🎁 Gratuit • 🔒 Anti-spam</p>

    <div class="card" id="card">
      <iframe
        id="ghlFrame"
        src="https://api.leadconnectorhq.com/widget/form/MAbxQNqssstYs2a4VbuI"
        title="Formulaire d'inscription"></iframe>
    </div>
  </div>

  <div class="sticky">
    <div class="stickyInner">
      <a class="btnLink" id="ppBtn" href="/privacy.html">🔐 Confidentialité</a>
      <a class="btnLink" id="cguBtn" href="/cgu.html">📄 CGU</a>
    </div>
  </div>

  <script>
  (function(){
    const RESTO = window.Fidelavis?.rememberLastResto?.() || window.Fidelavis?.getRestoSlug?.() || "resto1";

    try {
      if (!sessionStorage.getItem("fv_session_id")) {
        sessionStorage.setItem("fv_session_id", "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2,8));
      }
    } catch(e){}

    try {
      if (!localStorage.getItem("device_id")) {
        localStorage.setItem("device_id", "dev_" + Math.random().toString(36).slice(2,10));
      }
    } catch(e){}

    try{
      const key = `scan_to_signup_${RESTO}_${new Date().toISOString().slice(0,10)}`;
      if (!sessionStorage.getItem(key)) {
        sessionStorage.setItem(key, "1");

        window.Fidelavis?.track?.("scan_to_signup", {
          src: "inscription",
          page: "inscription",
          resto: RESTO
        });

        window.trackEventFidelavis?.("scan_to_signup", RESTO, {
          src: "inscription",
          demo: location.pathname.includes("/demo/") ? "1" : "0"
        });
      }
    }catch(e){}

    const from = encodeURIComponent(location.pathname);
    document.getElementById("ppBtn").href  = "/privacy.html?from=" + from;
    document.getElementById("cguBtn").href = "/cgu.html?from=" + from;

    function setFrameHeight(){
      const frame = document.getElementById("ghlFrame");
      const card  = document.getElementById("card");
      const sticky = document.querySelector(".sticky");

      const vh = window.innerHeight;
      const top = card.getBoundingClientRect().top;
      const stickyH = sticky.getBoundingClientRect().height;

      const safety = 8;
      const available = Math.max(420, Math.floor(vh - top - stickyH - safety));
      frame.style.height = available + "px";
    }

    window.addEventListener("resize", setFrameHeight);
    window.addEventListener("orientationchange", setFrameHeight);
    setTimeout(setFrameHeight, 60);
    setTimeout(setFrameHeight, 240);
  })();
  </script>

</body>
</html>
