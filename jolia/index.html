  <link rel="apple-touch-icon-precomposed" id="atip" sizes="180x180" href="" />

  <script>if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){});}</script>

  <!-- Fonts lifestyle -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Brand couleur rapide (avant le fetch config) -->
  <script>(function(){
    var m=location.pathname.match(/^\/([^/]+)\//);var s=m?m[1]:'';
    var FALLBACK_ICON='https://dn721804.ca.archive.org/0/items/512x-512-icon-logo-png/512x512%20icon%20logo%20png.png';
    var iconUrl=localStorage.getItem('fv_icon_'+s)||FALLBACK_ICON;
    function enforceIcon(u){
      document.querySelectorAll('link[rel="apple-touch-icon"],link[rel="apple-touch-icon-precomposed"]').forEach(function(l){
        if(l.id!=='ati'&&l.id!=='atip')l.parentNode.removeChild(l);
      });
      var a=document.getElementById('ati');if(!a){a=document.createElement('link');a.rel='apple-touch-icon';a.id='ati';a.setAttribute('sizes','180x180');document.head.appendChild(a);}a.href=u;
      var p=document.getElementById('atip');if(!p){p=document.createElement('link');p.rel='apple-touch-icon-precomposed';p.id='atip';p.setAttribute('sizes','180x180');document.head.appendChild(p);}p.href=u;
    }
    enforceIcon(iconUrl);
    var n=0,iv=setInterval(function(){enforceIcon(iconUrl);if(++n>=20)clearInterval(iv);},250);
  })();</script>

  <style>
    :root {
      --rose: #D4637A;
      --rose-mid: #E8809A;
      --rose-light: #F5C2C8;
      --rose-pale: #FFF0F3;
      --cream: #FDFAF8;
      --text: #2D1015;
      --muted: #8A6570;
      --gold: #C9962A;
      --hero-url: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--rose-pale);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
    }

    /* ── HERO ── */
    .hero-wrap { position: relative; height: 360px; overflow: hidden; }

    .hero-bg {
      position: absolute; inset: -30px;
      background-image: var(--hero-url);
      background-size: cover;
      background-position: center;
      filter: blur(18px) saturate(1.2) brightness(1.0);
      transform: scale(1.18);
    }
    .hero-bg.no-photo {
      background-image: linear-gradient(135deg, #F9C8D4 0%, #F0A8B8 50%, #E890A8 100%);
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255,240,245,.50) 0%,
        rgba(250,195,210,.62) 55%,
        rgba(245,175,195,.78) 100%
      );
    }

    /* ── STATUS BAR ── */
    .status-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px 0;
      font-size: 15px; font-weight: 700; color: var(--text);
    }
    .status-icons { display: flex; align-items: center; gap: 5px; font-size: 12px; }

    /* ── LOGO ── */
    .hero-logo-wrap {
      position: absolute; top: 42px; left: 20px; z-index: 8;
      width: 74px; height: 74px; border-radius: 50%; overflow: hidden;
      border: 3px solid rgba(255,255,255,.9);
      box-shadow: 0 4px 20px rgba(212,99,122,.25);
      background: var(--rose-light);
      display: flex; align-items: center; justify-content: center;
    }
    .hero-logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .logo-init {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 700; color: #fff;
    }

    /* ── BELL ── */
    .hero-bell {
      position: absolute; top: 44px; right: 20px; z-index: 8;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.8); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
      cursor: pointer; border: none;
    }

    /* ── TITLE CENTER ── */
    .hero-center {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -52%);
      text-align: center; z-index: 5; width: 220px;
    }
    .hero-sun { font-size: 20px; color: var(--gold); margin-bottom: 6px; line-height: 1; }
    .hero-name {
      font-family: 'Playfair Display', serif;
      font-size: 26px; font-weight: 700;
      color: var(--text); letter-spacing: 2px; text-transform: uppercase;
      line-height: 1.1;
      text-shadow: 0 1px 8px rgba(255,255,255,.65);
    }
    .hero-subtitle {
      font-size: 11px; font-weight: 700; letter-spacing: 5px;
      color: var(--rose); text-transform: uppercase; margin-top: 5px;
    }
    .hero-tagline {
      font-family: 'Dancing Script', cursive;
      font-size: 17px; color: var(--muted); margin-top: 7px; line-height: 1.2;
    }

    /* ── PROFILE CARD (inside hero bottom-left) ── */
    .profile-card {
      position: absolute; bottom: 18px; left: 16px; z-index: 8;
      background: rgba(255,255,255,.9); backdrop-filter: blur(12px);
      border-radius: 18px; padding: 13px 18px;
      box-shadow: 0 8px 32px rgba(212,99,122,.18); min-width: 180px;
    }
    .profile-hello {
      font-family: 'Dancing Script', cursive;
      font-size: 18px; color: var(--rose); line-height: 1;
    }
    .profile-name {
      font-family: 'Playfair Display', serif;
      font-size: 28px; font-weight: 700;
      color: var(--text); line-height: 1.1; margin-top: 1px;
    }
    .profile-since {
      font-size: 12px; color: var(--muted); margin-top: 5px;
      display: flex; align-items: center; gap: 4px;
    }
    .crown { color: var(--gold); }

    /* ── SCROLLABLE CONTENT ── */
    .content { padding: 16px 16px 100px; }

    /* ── OFFER CARD ── */
    .offer-card {
      border-radius: 22px; overflow: hidden;
      position: relative; height: 230px; margin-bottom: 14px;
      background: linear-gradient(145deg,#4A1525 0%,#7A2840 35%,#B04060 70%,#C85870 100%);
    }
    .offer-photo {
      position: absolute; inset: 0;
      background-image: var(--offer-photo-url, none);
      background-size: cover; background-position: center;
      opacity: .4;
    }
    .offer-deco {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 65% 50% at 75% 35%, rgba(230,130,80,.35), transparent),
        radial-gradient(ellipse 45% 60% at 15% 65%, rgba(180,50,80,.3), transparent);
    }
    .offer-body {
      position: relative; z-index: 2;
      padding: 20px; height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end;

    .offer-pill {
      display: inline-block;

      font-size: 9px; font-weight: 700; letter-spacing: 1.8px;
      text-transform: uppercase; padding: 5px 13px;
      border-radius: 30px; margin-bottom: 10px; align-self: flex-start;

    .offer-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px; font-weight: 700; color: #fff; line-height: 1.1;
    }
    .offer-italic {

      font-size: 28px; font-weight: 700;
      color: var(--rose-light); line-height: 1; margin-top: 2px;
    }
    .offer-desc {
      font-size: 12px; color: rgba(255,255,255,.65);
      margin-top: 7px; line-height: 1.4;
    }
    .offer-badge {
      position: absolute; right: 16px; bottom: 16px; z-index: 3;
      width: 76px; height: 76px; border-radius: 50%;
      background: rgba(212,99,122,.88);
      border: 2px solid rgba(255,255,255,.4);
      display: flex; align-items: center; justify-content: center;
      text-align: center; color: #fff;
      font-size: 8.5px; font-weight: 700;
      letter-spacing: .6px; text-transform: uppercase;
      line-height: 1.25; padding: 10px;
    }

    /* ── ACTIONS 2×2 ── */
    .actions-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 12px;
    }
    .action-card {
      background: #fff; border-radius: 18px;
      padding: 16px 14px 14px;
      box-shadow: 0 2px 14px rgba(212,99,122,.07);
      text-decoration: none; color: inherit;
      display: flex; flex-direction: column; gap: 3px;
      position: relative; cursor: pointer;
      border: none; font-family: inherit; text-align: left;
    }
    .action-card:active { transform: scale(.97); }
    .action-icon-circle {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg,#FDEAED,#F7D0D6);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; margin-bottom: 8px;
    }
    .action-label {
      font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.2;
    }
    .action-desc { font-size: 11px; color: var(--muted); line-height: 1.3; }
    .action-desc.pink { color: var(--rose); }
    .action-arrow {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--rose-light); font-size: 20px;
    }

    /* ── SHARE BANNER ── */
    .share-banner {
      border-radius: 22px; overflow: hidden;
      background: linear-gradient(120deg,#D4637A 0%,#C04868 60%,#A83858 100%);
      padding: 20px 18px;
      display: flex; align-items: center; gap: 14px;
      position: relative; cursor: pointer;
      min-height: 96px; border: none; font-family: inherit; width: 100%;
      text-align: left;
    }
    .share-banner:active { transform: scale(.99); }
    .share-env {
      width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%;
      background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; z-index: 1;
    }
    .share-text { z-index: 1; flex: 1; }
    .share-title {
      font-family: 'Dancing Script', cursive;
      font-size: 24px; font-weight: 700; color: #fff; line-height: 1;
    }
    .share-sub {
      font-size: 11px; color: rgba(255,255,255,.72);
      margin-top: 4px; line-height: 1.35;
    }
    .share-arrow { color: rgba(255,255,255,.55); font-size: 24px; z-index: 1; }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed; bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 390px;
      background: rgba(255,240,243,.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(212,99,122,.12);
      padding: 10px 0 env(safe-area-inset-bottom, 16px);
      display: flex; z-index: 20;

    .nav-tab {
      flex: 1; display: flex; flex-direction: column;

      cursor: pointer; font-family: inherit;
    }
    .nav-tab.active { color: var(--rose); }
    .nav-icon { font-size: 22px; line-height: 1; }

    /* ── TOAST notification ── */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(45,16,21,.9); color: #fff;
      padding: 10px 20px; border-radius: 30px;
      font-size: 13px; font-weight: 600;
      opacity: 0; transition: opacity .3s;
      pointer-events: none; z-index: 100; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    .progressier-widget { display: none !important; }
  </style>
</head>

<script>
/* ══ GATE : accès client requis ══ */
(function(){
  function hasAccessSafe(){
    try{ return window.Fidelavis?.hasAccess?.() === true; }catch(e){ return false; }
  }
  function isStandalone(){
    return window.navigator.standalone===true||window.matchMedia("(display-mode:standalone)").matches;
  }
  if(!hasAccessSafe()){
    setTimeout(()=>{
      if(!hasAccessSafe()){
        window.Fidelavis?.go?.(isStandalone()?"indexnfc.html?from=pwa":"indexnfc.html");
      }
    },350);
  }
})();

/* ══ CONFIG + RENDER ══ */
var _cfg = {};

(async function init(){
  window.Fidelavis?.rememberLastResto?.();

  const slug = window.Fidelavis?.getRestoSlug?.() ||
               (location.pathname.match(/^\/([^/]+)\//) || [])[1] || '';

  try { _cfg = await window.Fidelavis?.loadConfig?.() || {}; } catch(e){}

  /* ── Hero image ── */
  const heroBg = document.getElementById('heroBg');
  const heroUrl = _cfg.heroUrl || _cfg.iconUrl || null;
  if (heroUrl) {
    heroBg.style.backgroundImage = `url("${heroUrl}")`;
    heroBg.classList.remove('no-photo');
  }

  /* ── Logo ── */
  const logoWrap = document.getElementById('logoWrap');
  const logoInit = document.getElementById('logoInit');
  if (_cfg.iconUrl) {
    logoWrap.innerHTML = `<img src="${_cfg.iconUrl}" alt="logo" onerror="this.style.display='none'">`;
  } else if (_cfg.name) {
    logoInit.textContent = _cfg.name.split(' ').slice(0,2).map(w=>w[0].toUpperCase()).join('');
  }

  /* ── Restaurant name ── */
  const name = _cfg.name || 'Le Restaurant';
  document.getElementById('heroName').textContent =
    name.replace(/\b(brunch|lunch|dinner|coffee|shop|restaurant|paris|le|la|les|du)\b/gi,'').replace(/\s+/,' ').trim().toUpperCase();

  /* ── Subtitle (style-based) ── */
  const cat = (_cfg.category || '').toLowerCase();
  const subtitle = cat.includes('coffee') ? 'COFFEE SHOP'
                 : cat.includes('gastro') ? 'RESTAURANT'
                 : 'BRUNCH CLUB';
  document.getElementById('heroSubtitle').textContent = subtitle;

  /* ── Tagline ── */
  if (_cfg.tagline) document.getElementById('heroTagline').textContent = _cfg.tagline;

  /* ── Profile ── */
  const savedName = localStorage.getItem('fv_firstname') || 'Marie';
  document.getElementById('profileName').textContent = savedName + ' ✨';
  const registeredAt = localStorage.getItem('fv_registered_at_' + slug);
  if (registeredAt) {
    const d = new Date(parseInt(registeredAt));
    document.getElementById('memberSince').textContent =
      'Membre depuis ' + d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  }

  /* ── Offer card ── */
  const coupon = _cfg.activeCoupon || {};
  if (coupon.title) {
    document.getElementById('offerTitle').textContent = coupon.title.replace(/offert[e]?/gi,'').trim();
  }
  if (coupon.imageUrl) {
    document.getElementById('offerPhoto').style.backgroundImage = `url("${coupon.imageUrl}")`;
  }

  /* ── Instagram ── */
  if (_cfg.instagramUrl) {
    const handle = _cfg.instagramUrl.replace(/\/$/, '').split('/').pop();
    document.getElementById('instaHandle').textContent = '@' + handle;
  }

  /* ── Share label ── */
  if (_cfg.shareLabel) {
    document.getElementById('shareTitle').textContent = '💌 ' + _cfg.shareLabel;
  }

  window.Fidelavis?.trackOnce?.('wallet_view', `wallet_view_${slug}`, { src: 'brunch_wallet' });
})();

/* ══ ACTIONS ══ */
function goOffer() {
  window.Fidelavis?.track?.('offer_click', { src: 'brunch_wallet' });
  window.Fidelavis?.go?.('offre-du-jour.html');
}
function goReserver() {
  window.Fidelavis?.track?.('reserve_click', { src: 'brunch_wallet' });
  if (_cfg.reservationUrl) window.open(_cfg.reservationUrl, '_blank');
  else window.Fidelavis?.go?.('reservation.html');
}
function goInsta() {
  window.Fidelavis?.track?.('instagram_click', { src: 'brunch_wallet' });
  if (_cfg.instagramUrl) window.open(_cfg.instagramUrl, '_blank');
}
function goAvis() {
  window.Fidelavis?.track?.('review_click', { src: 'brunch_wallet' });
  if (_cfg.googleReview) window.open(_cfg.googleReview, '_blank');
  else window.Fidelavis?.go?.('avis.html');
}
function goShare() {
  window.Fidelavis?.track?.('share_click', { src: 'brunch_wallet' });
  if (navigator.share) {
    navigator.share({
      title: (_cfg.name || 'Fidelavis'),
      text: 'Découvrez ce spot incroyable 🌸',
      url: window.location.href
    }).catch(()=>{});
  } else {
    window.Fidelavis?.go?.('recommander.html');
  }
}

/* ══ TOAST ══ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ══ PWA TRACKING ══ */
window.addEventListener('appinstalled', function(){
  window.Fidelavis?.track?.('install', { src: 'pwa_appinstalled', page: 'brunch_wallet' });
});
(function detectFirstStandaloneLaunch(){
  try {
    var standalone = window.navigator.standalone===true ||
                     window.matchMedia("(display-mode:standalone)").matches;
    if (!standalone) return;
    var slug = window.Fidelavis?.getRestoSlug?.() || '';
    var k = 'fv_install_tracked_' + slug;
    if (localStorage.getItem(k)) return;
    localStorage.setItem(k, String(Date.now()));
    localStorage.setItem('fv_registered_' + slug, '1');
    localStorage.setItem('fv_registered_at_' + slug, String(Date.now()));
    window.Fidelavis?.setAuthCookie?.();
    window.Fidelavis?.track?.('install_confirmed', { src: 'standalone_first_launch', page: 'brunch_wallet' });
  } catch(e){}
})();
</script>
