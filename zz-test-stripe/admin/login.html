<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion Admin</title>
  <script>
    // Désinstalle les Service Workers qui n'appartiennent pas à ce restaurant
    if ('serviceWorker' in navigator) {
      var slug = location.pathname.split('/')[1];
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) {
          if (reg.scope && reg.scope.indexOf('/' + slug + '/') === -1) {
            reg.unregister();
          }
        });
      });
    }
  </script>
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background:#f7f7f7;
      text-align:center;
      margin:0;
      padding:0;
    }
    .login-box {
      width:90%;
      max-width:360px;
      background:#fff;
      margin:110px auto;
      padding:25px;
      border-radius:16px;
      box-shadow:0 4px 14px rgba(0,0,0,0.15);
    }
    input {
      width:90%;
      padding:12px;
      margin-top:10px;
      font-size:16px;
      border-radius:10px;
      border:1px solid #ccc;
    }
    button {
      width:92%;
      margin-top:18px;
      padding:14px;
      background:#b6152b;
      color:white;
      border-radius:10px;
      font-size:17px;
      border:none;
      cursor:pointer;
    }
    .err {
      margin-top:12px;
      font-size:14px;
    }
    .forgot {
      display:block;
      margin-top:14px;
      font-size:13px;
      color:#999;
      text-decoration:none;
    }
    .forgot:hover { color:#b6152b; text-decoration:underline; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2 style="color:#b6152b;">🔐 Connexion Admin</h2>
    <input id="user" placeholder="Identifiant" autocomplete="off">
    <input id="pass" placeholder="Mot de passe" type="password">
    <button onclick="login()">Se connecter</button>
    <div id="error" class="err"></div>
    <a class="forgot" href="#" onclick="location.href='/fidelavis-admin/forgot-password.html?resto='+location.pathname.split('/')[1];return false;">
      Mot de passe oublié ?
    </a>
  </div>

  <script>
    // Phase 5a-bis : auth 100% Supabase (RPC fv_admin_login + bcrypt).
    // Plus aucun mot de passe en clair côté client.
    const SUPA_URL = "https://rtdiaeskmyjjwohirhzj.supabase.co";
    const SUPA_KEY = "sb_publishable_V9jcAKPdqxhupYWxoejARQ_D_AmOpcZ";

    async function login() {
      const u = document.getElementById("user").value.trim();
      const p = document.getElementById("pass").value.trim();
      const error = document.getElementById("error");
      const site = window.location.pathname.split("/")[1];

      try {
        const r = await fetch(SUPA_URL + "/rest/v1/rpc/fv_admin_login", {
          method: "POST",
          headers: {
            "apikey":        SUPA_KEY,
            "Authorization": "Bearer " + SUPA_KEY,
            "Content-Type":  "application/json"
          },
          body: JSON.stringify({ p_slug: site, p_username: u, p_password: p })
        });

        if (!r.ok) {
          // 5xx ou erreur : service indisponible
          error.style.color = "red";
          error.innerText = "Service d'authentification indisponible. Réessayez dans quelques minutes.";
          return;
        }

        const j = await r.json();
        if (!j || !j.ok) {
          error.style.color = "red";
          error.innerText = "Identifiants incorrects";
          return;
        }

        // Authentification OK
        localStorage.setItem(`admin_${site}`, "true");
        localStorage.setItem(`role_${site}`, j.role);
        // Jeton de session : c'est lui qui prouvera au proxy que les écritures
        // viennent bien de ce restaurant. Sans lui, n'importe qui pouvait
        // modifier ses offres, sa facturation, ou écrire à ses clients —
        // l'URL du proxy et les noms d'actions étant lisibles dans le HTML
        // public de cette page.
        if (j.token) {
          localStorage.setItem(`fv_session_${site}`, j.token);
          if (j.expires_at) localStorage.setItem(`fv_session_exp_${site}`, j.expires_at);
        }
        error.style.color = "green";
        error.innerText = "Connexion réussie. Redirection...";
        setTimeout(() => {
          window.location.href = `/${site}/admin/espace-admin.html`;
        }, 800);

      } catch (e) {
        // Erreur réseau (offline, DNS, …)
        error.style.color = "red";
        error.innerText = "Connexion impossible. Vérifiez votre réseau.";
      }
    }
  </script>

</body>
</html>
